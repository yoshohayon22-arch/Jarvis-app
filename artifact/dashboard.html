<title>Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;700&family=Patrick+Hand&family=Space+Grotesk:wght@500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/*
 * Design tokens des 4 thèmes.
 * Le thème actif est porté par l'attribut data-theme sur <html> (appliqué avant le premier rendu).
 * Toutes les couleurs de texte ont été vérifiées à un contraste ≥ 4.5:1 sur leur fond (scripts/check-contrast.mjs).
 */

:root,
[data-dash="nuit"] {
  color-scheme: dark;
  --bg: #0b0e14;
  --surface: #151a23;
  --surface-2: #1c2230;
  --border: #252c38;
  --border-width: 1px;
  --radius: 16px;
  --radius-sm: 10px;
  --card-shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset;
  --card-blur: none;
  --text: #e8ecf2;
  --text-2: #a3adbb;
  --accent: #f5c451;
  --on-accent: #14110a;
  --accent-2: #f5c451;
  --accent-soft: rgb(245 196 81 / 0.12);
  --glow: 0 0 0 1px rgb(245 196 81 / 0.35), 0 8px 32px -8px rgb(245 196 81 / 0.35);
  --focus: #f5c451;
  --nav-bg: rgb(11 14 20 / 0.86);
  --ff-heading: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --ff-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --heading-weight: 600;
  --heading-tracking: -0.02em;
}

[data-dash="glass"] {
  color-scheme: dark;
  --bg: #0b0e1d;
  --surface: rgb(255 255 255 / 0.08);
  --surface-2: rgb(255 255 255 / 0.12);
  --border: rgb(255 255 255 / 0.2);
  --border-width: 1px;
  --radius: 22px;
  --radius-sm: 14px;
  --card-shadow: 0 8px 32px -12px rgb(0 0 0 / 0.45), 0 1px 0 rgb(255 255 255 / 0.12) inset;
  --card-blur: blur(18px) saturate(140%);
  --text: #f3f5fb;
  --text-2: #c6ccdd;
  --accent: #9be7ff;
  --on-accent: #06202a;
  --accent-2: #9be7ff;
  --accent-soft: rgb(155 231 255 / 0.14);
  --glow: 0 0 0 1px rgb(155 231 255 / 0.4), 0 12px 40px -10px rgb(155 231 255 / 0.4);
  --focus: #9be7ff;
  --nav-bg: rgb(16 18 40 / 0.82);
  --ff-heading: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --ff-body: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --heading-weight: 700;
  --heading-tracking: -0.02em;
}

[data-dash="brutal"] {
  color-scheme: light;
  --bg: #f2f0e6;
  --surface: #ffffff;
  --surface-2: #ffe14d;
  --border: #000000;
  --border-width: 3px;
  --radius: 0px;
  --radius-sm: 0px;
  --card-shadow: 6px 6px 0 #000000;
  --card-blur: none;
  --text: #000000;
  --text-2: #333333;
  --accent: #ff4a1c;
  --on-accent: #000000;
  --accent-2: #ffe14d;
  --accent-soft: #ffe14d;
  --glow: 6px 6px 0 #000000;
  --focus: #000000;
  --nav-bg: #f2f0e6;
  --ff-heading: "Archivo Black", Impact, ui-sans-serif, system-ui, sans-serif;
  --ff-body: "Space Mono", ui-monospace, monospace;
  --heading-weight: 400;
  --heading-tracking: -0.01em;
}

[data-dash="dessine"] {
  color-scheme: light;
  --bg: #fbf7ee;
  --surface: #ffffff;
  --surface-2: #fff3b0;
  --border: #2b2b2b;
  --border-width: 2px;
  /* Rayons irréguliers pour l'effet « tracé au feutre ». */
  --radius: 18px 6px 16px 8px / 8px 16px 6px 18px;
  --radius-sm: 12px 4px 10px 5px / 5px 10px 4px 12px;
  --card-shadow: 3px 4px 0 #2b2b2b;
  --card-blur: none;
  --text: #2b2b2b;
  --text-2: #555555;
  --accent: #c7402a;
  --on-accent: #ffffff;
  --accent-2: #fff3b0;
  --accent-soft: #fff3b0;
  --glow: 3px 4px 0 #2b2b2b;
  --focus: #c7402a;
  --nav-bg: rgb(251 247 238 / 0.94);
  --ff-heading: "Caveat", "Comic Sans MS", cursive;
  --ff-body: "Patrick Hand", "Comic Sans MS", cursive;
  --heading-weight: 700;
  --heading-tracking: 0;
}

/*
 * Mise en page de la version artefact.
 * Concept : une coque d'application (barre latérale sur ordinateur, barre du bas sur téléphone)
 * autour d'une grille de cartes. Les couleurs viennent toutes des jetons de thème (tokens.css) :
 * la page a ses 4 thèmes propres, choisis par l'utilisateur (Nuit par défaut), et fixe donc
 * elle-même toutes ses couleurs quel que soit le thème de l'hôte.
 */
:root { --card-solid: #151a23; --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px)); }
[data-dash="nuit"] { --nav-bg: rgb(11 14 20 / 0.95); }
[data-dash="glass"] { --card-solid: #1b1d3a; --nav-bg: rgb(16 18 40 / 0.94); }
[data-dash="brutal"], [data-dash="dessine"] { --card-solid: #ffffff; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--ff-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[data-dash="dessine"] body { font-size: 17px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, .brand, .big { font-family: var(--ff-heading); font-weight: var(--heading-weight); letter-spacing: var(--heading-tracking); margin: 0; text-wrap: balance; }
[data-dash="brutal"] h1 { text-transform: uppercase; }
p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; top: 8px; left: 8px; z-index: 100; padding: 8px 16px; background: var(--accent); color: var(--on-accent); border-radius: var(--radius-sm); transform: translateY(-200%); }
.skip:focus { transform: none; }
.muted { color: var(--text-2); }
.small { font-size: 0.85em; }
.tiny { font-size: 11px; }
.note { font-size: 12px; color: var(--text-2); }
.num, .big, table, .stat dd { font-variant-numeric: tabular-nums; }

/* ---- Icônes ---- */
.ic { width: 20px; height: 20px; flex: none; }
.ic-sm { width: 14px; height: 14px; }
.ic-xs { width: 12px; height: 12px; display: inline-block; vertical-align: -1px; }

/* ---- Coque ---- */
.layout { display: flex; min-height: 100%; }
.column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sidebar { display: none; position: sticky; top: 0; height: 100vh; width: 248px; flex: none; flex-direction: column; background: var(--nav-bg); border-right: var(--border-width) solid var(--border); }
.brand { font-size: 20px; padding: 20px 20px 12px; }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; scrollbar-width: none; }
.side-foot { padding: 12px; border-top: var(--border-width) solid var(--border); }
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); padding: 14px 12px 4px; }
.side-link { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-sm); text-decoration: none; color: var(--text-2); font-size: 14px; }
.side-link:hover { color: var(--text); }
.side-link.active { color: var(--text); font-weight: 600; background: var(--accent-soft); }
[data-dash="brutal"] .side-link.active { border: 3px solid #000; }
[data-dash="dessine"] .side-link.active { background: none; text-decoration: underline wavy var(--accent) 2px; text-underline-offset: 6px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; min-height: 64px; padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--nav-bg); border-bottom: var(--border-width) solid var(--border); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.topbar h1 { flex: 1; min-width: 0; font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; background: none; border: 0; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; }
.icon-btn:hover { color: var(--text); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.icon-btn.fav { color: var(--accent); }
.icon-btn.fav svg { fill: currentColor; }
[data-dash="brutal"] .icon-btn.fav { color: #000; }
.boxed { background: var(--surface); border: var(--border-width) solid var(--border); color: var(--text); }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; min-width: 44px; justify-content: center; padding: 0 12px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 14px; }
kbd { font: 12px var(--ff-body); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
.wide-only { display: none; }

.main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 20px 110px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.view { display: flex; flex-direction: column; gap: 18px; animation: view-in 320ms cubic-bezier(0.22, 1, 0.36, 1) both; }
[data-dash="brutal"] .view { animation-timing-function: steps(3); animation-duration: 220ms; }
@keyframes view-in { from { opacity: 0; transform: translateX(calc(var(--dir, 0) * 10px)); } }

.bottombar { position: fixed; inset: auto 0 0; z-index: 25; display: flex; gap: 4px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--nav-bg); border-top: var(--border-width) solid var(--border); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.bottom-link { flex: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; border-radius: var(--radius-sm); color: var(--text-2); font-size: 11px; text-decoration: none; }
.bottom-link span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.bottom-link.active { color: var(--text); font-weight: 600; background: var(--accent-soft); }
[data-dash="brutal"] .bottom-link.active { border: 3px solid #000; }
[data-dash="dessine"] .bottom-link.active { background: none; text-decoration: underline wavy var(--accent) 2px; text-underline-offset: 4px; }

@media (min-width: 900px) {
  .sidebar { display: flex; }
  .bottombar, .narrow-only { display: none; }
  .wide-only { display: inline; }
  .topbar { padding-inline: 32px; }
  .main { padding: 28px 32px 48px; }
}

/* ---- Cartes ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.slot { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius); box-shadow: var(--card-shadow); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head h2 { font-size: 18px; line-height: 1.2; }
.badge-text { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.skeleton-card { min-height: 180px; }
.skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--radius-sm); }
[data-dash="brutal"] .skeleton, [data-dash="dessine"] .skeleton { background: #ebe7d8; }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.12), transparent); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.empty { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.empty .ic { width: 16px; height: 16px; margin-top: 3px; color: var(--text-2); }
.empty-title { font-weight: 600; }
.sep { border-top: var(--border-width) solid var(--border); padding-top: 14px; }

.btn, .link-btn, .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; border-radius: var(--radius-sm); font-size: 14px; transition: transform 120ms ease-out; }
.btn { padding: 0 16px; background: var(--surface-2); border: var(--border-width) solid var(--border); font-weight: 500; flex: none; align-self: flex-start; }
.btn.center { align-self: center; }
.btn:active, .chip:active { transform: scale(0.97); }
[data-dash="brutal"] .btn { box-shadow: 4px 4px 0 #000; transition: none; }
[data-dash="brutal"] .btn:active { transform: translate(4px, 4px); box-shadow: none; }
[data-dash="dessine"] .btn { box-shadow: 2px 3px 0 #2b2b2b; }
.link-btn { align-self: flex-start; margin: -6px -8px -8px; padding: 0 8px; background: none; border: 0; color: var(--text-2); }
.link-btn:hover { color: var(--text); }
.link-btn .ic { width: 16px; height: 16px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toolbar p { font-size: 13px; min-width: 0; }
.btn-label { display: none; }
@media (min-width: 560px) { .btn-label { display: inline; } }

/* ---- Météo ---- */
.now { display: flex; align-items: center; gap: 16px; }
.big { font-size: 48px; line-height: 1; }
.unit { font-size: 0.6em; }
.wx-lg { width: 80px; height: 80px; flex: none; }
.wx-sm { width: 28px; height: 28px; }
.wx-xs { width: 24px; height: 24px; flex: none; }
.stats { display: grid; gap: 12px; }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat dt { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }
.stat dd { font-size: 14px; font-weight: 500; }
/* position: relative : les textes « sr-only » (en position absolue) restent ainsi rognés par la zone défilante. */
.hours { position: relative; display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.hours li { flex: none; min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; background: var(--surface-2); border-radius: var(--radius-sm); text-align: center; }
.days li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
.day { width: 84px; flex: none; text-transform: capitalize; }
.days .num { width: 32px; flex: none; text-align: right; }
.days strong.num { text-align: left; }
.range { position: relative; flex: 1; min-width: 32px; height: 6px; border-radius: 99px; background: var(--surface-2); }
.range span { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: var(--accent); }
.aqi { display: flex; align-items: baseline; gap: 12px; }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alerts li { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; background: var(--accent-soft); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); }
.table-wrap { position: relative; overflow-x: auto; border-top: var(--border-width) solid var(--border); padding-top: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
th, td { padding: 6px 12px 6px 0; white-space: nowrap; }
thead th { font-size: 12px; font-weight: 500; color: var(--text-2); }
tbody tr { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
tbody th { font-weight: 500; text-transform: capitalize; }

.wx-animated .wx-sun { animation: wx-spin 24s linear infinite; }
.wx-animated .wx-cloud { animation: wx-drift 6s ease-in-out infinite alternate; }
.wx-animated .wx-drop { animation: wx-fall 1.1s linear infinite; }
.wx-animated .wx-flake { animation: wx-fall 2.4s linear infinite; }
.wx-animated .wx-fog { animation: wx-drift 5s ease-in-out infinite alternate-reverse; }
.wx-animated .wx-bolt { animation: wx-flash 2.6s steps(1) infinite; }
.wx-animated .wx-delay-1 { animation-delay: -0.4s; }
.wx-animated .wx-delay-2 { animation-delay: -0.8s; }
@keyframes wx-spin { to { transform: rotate(360deg); } }
@keyframes wx-drift { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
@keyframes wx-fall { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
@keyframes wx-flash { 0%, 70%, 78%, 100% { opacity: 1; } 74%, 82% { opacity: 0.2; } }

/* ---- Presse ---- */
.chips { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.chip { flex: none; padding: 0 16px; border-radius: 99px; background: var(--surface); border: var(--border-width) solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.article { gap: 8px; height: 100%; }
.article h2 { font-size: 16px; line-height: 1.3; }
.article h2 a { text-decoration: none; }
.article h2 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.article h2 a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--text-2); }
.meta strong { color: var(--text); }
.pill { border: 1px solid var(--border); border-radius: 99px; padding: 0 6px; }
.summary { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.read { margin-top: auto; padding-top: 4px; display: flex; align-items: center; gap: 5px; }
.links { display: flex; flex-direction: column; gap: 12px; }
.links li { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.links a { text-decoration: none; line-height: 1.3; }
.links a:hover { text-decoration: underline; }
.links .ic { margin-left: 4px; color: var(--text-2); }

/* ---- Vie juive ---- */
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
.kv.line { border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); padding: 8px 0; }
.kv a { text-align: right; }
.cap::first-letter { text-transform: uppercase; }
.big-2 { font-family: var(--ff-heading); font-weight: var(--heading-weight); font-size: 30px; line-height: 1.15; }
.title-2 { font-size: 24px; line-height: 1.2; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile-stat { padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); }
.tile-stat dt { font-size: 12px; color: var(--text-2); }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.hebrew { font-family: "SBL Hebrew", "Ezra SIL", "Frank Ruehl CLM", "Times New Roman", serif; font-size: 21px; line-height: 1.7; }
.hebrew.left { text-align: left; }
.reader { max-width: 760px; }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; align-self: flex-start; font-size: 14px; font-weight: 500; text-underline-offset: 4px; }
.callout { padding: 8px 12px; font-size: 14px; background: var(--accent-soft); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); }
.two-col { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); column-gap: 24px; }
.section-title { font-size: 16px; }
.verses { display: flex; flex-direction: column; gap: 16px; }
.verses li { display: flex; gap: 12px; }
.verses li > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; line-height: 1.6; }
.verse-n { width: 28px; flex: none; padding-top: 6px; text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.small-2 { font-size: 14px; }

.bullets { display: flex; flex-direction: column; gap: 6px; padding-left: 18px; list-style: disc; font-size: 14px; }

/* ---- Mail ---- */
.search-row { display: flex; gap: 8px; }
.field { flex: 1; min-width: 0; height: 44px; padding: 0 12px; font: 16px var(--ff-body); color: var(--text); background: var(--surface-2); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); }
.field::placeholder { color: var(--text-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: 0.55; cursor: default; }
a.btn { text-decoration: none; }
.mails { display: flex; flex-direction: column; gap: 10px; }
.mail { gap: 6px; padding: 14px 16px; }
.mail-open { align-self: flex-start; min-height: 44px; margin: -6px 0; padding: 0; background: none; border: 0; text-align: left; font: inherit; }
.mail-subject { font-family: var(--ff-heading); font-weight: var(--heading-weight); font-size: 16px; line-height: 1.3; }
.mail-open:hover .mail-subject { text-decoration: underline; }
.mail.unread .mail-subject { font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.cat-urgent { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.cat-a-lire { background: var(--accent-soft); color: var(--text); }
.mail-body { max-height: 38vh; overflow-y: auto; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
.ai-out { white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
.ai-out:empty { display: none; }
.draft { width: 100%; padding: 12px; font: 15px/1.5 var(--ff-body); color: var(--text); background: var(--surface-2); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); resize: vertical; }
.label { font-size: 14px; font-weight: 500; }

/* ---- Réglages ---- */
.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.theme-choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 76px; padding: 12px; text-align: left; font-size: 14px; background: var(--surface-2); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); }
.theme-choice.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.swatches { display: flex; gap: 4px; }
.swatches span { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgb(0 0 0 / 0.25); }
.tab-list li { display: flex; align-items: center; gap: 8px; min-height: 48px; border-bottom: var(--border-width) solid var(--border); font-size: 14px; }
.tab-list li:last-child { border-bottom: 0; }
.tab-list .ic:first-child { color: var(--text-2); margin: 0 4px; }
.tab-list .dim { opacity: 0.6; }
.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Fenêtres ---- */
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgb(0 0 0 / 0.5); opacity: 0; transition: opacity 180ms ease-out; }
.overlay.open { opacity: 1; }
.overlay.clear { background: none; display: block; padding: 0; }
.overlay.top { align-items: flex-start; padding-top: 12vh; }
.overlay.bottom { align-items: flex-end; padding: 0; }
.overlay > .card { background: var(--card-solid); max-height: 85vh; overflow-y: auto; transform: translateY(10px) scale(0.98); transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1); }
.overlay.open > .card { transform: none; }
[data-dash="brutal"] .overlay > .card { transition-timing-function: steps(3); }
.dialog { width: 100%; max-width: 680px; }
.menu { position: absolute; min-width: 230px; padding: 6px; gap: 0; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; background: none; border: 0; border-radius: var(--radius-sm); font-size: 14px; text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); }
.sheet { width: 100%; max-height: 80vh; border-bottom-left-radius: 0; border-bottom-right-radius: 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
.overlay.bottom > .card { transform: translateY(100%); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 80px; padding: 8px; text-align: center; font-size: 12px; text-decoration: none; background: var(--surface-2); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); }
.tile.active { background: var(--accent-soft); font-weight: 600; }
.palette { width: 100%; max-width: 560px; padding: 0; gap: 0; overflow: hidden; }
.palette-input { width: 100%; height: 56px; padding: 0 16px; font: 16px var(--ff-body); color: var(--text); background: none; border: 0; border-bottom: var(--border-width) solid var(--border); outline: none; }
.palette-input::placeholder { color: var(--text-2); }
.palette-list { max-height: 55vh; overflow-y: auto; padding: 6px; }
.palette-list li { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; }
.palette-list li span:first-of-type { flex: 1; }
.palette-list .ic { width: 16px; height: 16px; color: var(--text-2); }
.palette-list .sel { background: var(--surface-2); }
.palette-list .none { justify-content: center; cursor: default; }

/* ---- Fond Glassmorphism ---- */
.glass-backdrop { display: none; position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #0b0e1d; pointer-events: none; }
[data-dash="glass"] .glass-backdrop { display: block; }
[data-dash="glass"] body { background: #0b0e1d; }
.glass-backdrop span { position: absolute; border-radius: 50%; opacity: 0.55; animation: float 18s ease-in-out infinite alternate; }
.glass-backdrop span:nth-child(1) { width: 70vmax; height: 70vmax; top: -20vmax; left: -15vmax; background: radial-gradient(circle, #43308c 0%, transparent 65%); }
.glass-backdrop span:nth-child(2) { width: 60vmax; height: 60vmax; top: 30vh; left: 45vw; background: radial-gradient(circle, #0c6e7e 0%, transparent 65%); animation-delay: -6s; }
.glass-backdrop span:nth-child(3) { width: 55vmax; height: 55vmax; top: 55vh; left: -10vw; background: radial-gradient(circle, #7a2e6b 0%, transparent 65%); animation-delay: -12s; }
@keyframes float { to { transform: translate(3vmax, -2vmax); } }
[data-dash="glass"] .layout { position: relative; z-index: 0; }

::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

@media (prefers-reduced-motion: reduce) {
  .view, .skeleton::after, .wx-animated *, .glass-backdrop span { animation: none; }
  .overlay, .overlay > .card, .btn, .chip { transition: none; }
}

/* ---- Budget ---- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; align-items: end; }
.form-grid > .btn { align-self: end; justify-content: center; }
.form-grid > .note { grid-column: 1 / -1; }
.form-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.form-field .field { width: 100%; flex: none; }
select.field { appearance: none; -webkit-appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
select.field option { background: var(--card-solid); color: var(--text); }
.error { color: var(--text); font-weight: 600; }
.error:empty, .note:empty { display: none; }
.month-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
.month-title { font-size: 18px; min-width: 9ch; text-align: center; }
.toolbar { flex-wrap: wrap; }
.over { display: flex; align-items: center; gap: 4px; font-weight: 600; }
.meters { display: flex; flex-direction: column; gap: 14px; }
.meters li { display: flex; flex-direction: column; gap: 5px; }
.meter-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.bar { position: relative; height: 10px; border-radius: 4px; background: var(--surface-2); }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); box-shadow: 0 0 0 2px var(--card-solid); }
[data-dash="brutal"] .bar, [data-dash="dessine"] .bar { border: 2px solid var(--border); height: 14px; }
[data-dash="brutal"] .bar-fill { background: #000; border-radius: 0; }
.expenses li { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); font-size: 14px; }
.expenses li:last-child { border-bottom: 0; }
.grow-2 { flex: 1; min-width: 0; }
.expense-title { font-weight: 500; overflow-wrap: anywhere; }
.row-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.trend { display: flex; flex-direction: column; gap: 10px; }
.trend li { display: grid; grid-template-columns: 64px minmax(0, 1fr) 104px; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
.trend li.current { color: var(--text); font-weight: 600; }
.trend-value { text-align: right; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn { flex: 0 1 auto; min-width: 0; text-align: left; padding-block: 8px; }
.dialog > * { min-width: 0; max-width: 100%; }
.right { text-align: right; }
td.wrap { white-space: normal; min-width: 140px; overflow-wrap: anywhere; }
td.right, th.right { padding-right: 0; padding-left: 10px; }

/* ---- Projets et études ---- */
.board { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.column-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.search-row .btn { align-self: stretch; }
textarea.draft { display: block; }
.meta .over { display: inline-flex; color: var(--text); }
.meta a, .card-foot a { min-height: 24px; display: inline-flex; align-items: center; }

/* ---- Veille IA et Culture G ---- */
.btn.above { position: relative; z-index: 1; }
.quiz { display: flex; flex-direction: column; gap: 20px; }
.quiz li { display: flex; flex-direction: column; gap: 8px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.choice { align-self: stretch; text-align: left; padding-block: 8px; }
.choice:disabled { opacity: 0.7; }
.choice.good { opacity: 1; border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.choice.bad { opacity: 1; text-decoration: line-through; }

/* ---- Football ---- */
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; font-size: 15px; }
.score .team { overflow-wrap: anywhere; }
.score strong { font-family: var(--ff-heading); font-size: 18px; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
.live .dot { animation: live-pulse 1.6s ease-in-out infinite; }
@keyframes live-pulse { 50% { opacity: 0.4; transform: scale(0.85); } }
.result { min-width: 26px; text-align: center; font-weight: 600; flex: none; }
tr.mine th, tr.mine td { font-weight: 700; background: var(--accent-soft); }
tr.mine td:first-child { padding-left: 6px; }
@media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } }

/* ================= Nouvelle structure des onglets ================= */
/* Plus d'air : cartes moins serrées, titres plus nets. */
.view { gap: 22px; }
.grid, .grid.two { gap: 20px; }
.card { padding: 22px; gap: 16px; }
.card-head h2 { font-size: 17px; }
.mail, .article { padding: 16px 18px; }
@media (min-width: 900px) { .card { padding: 24px; } }

/* Sous-sections : une rangée de boutons, une seule section visible. */
.segs { position: relative; display: flex; gap: 6px; padding: 5px; overflow-x: auto; scrollbar-width: none; background: var(--surface); border: var(--border-width) solid var(--border); border-radius: 999px; align-self: flex-start; max-width: 100%; }
.seg { flex: none; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: none; color: var(--text-2); font-size: 14px; white-space: nowrap; }
.seg:hover { color: var(--text); }
.seg { position: relative; z-index: 1; transition: color 200ms ease-out, transform 120ms ease-out; }
.seg:active { transform: scale(0.96); }
.seg.on { color: var(--on-accent); font-weight: 600; }
.seg-pill { position: absolute; top: 5px; left: 0; height: 44px; width: 0; border-radius: 999px; background: var(--accent); transform-origin: left center; pointer-events: none; }
[data-dash="brutal"] .segs, [data-dash="brutal"] .seg, [data-dash="brutal"] .seg-pill { border-radius: 0; }
[data-dash="brutal"] .seg-pill { outline: 3px solid #000; outline-offset: -3px; }
[role="tabpanel"]:focus-visible { outline-offset: 6px; }

/* L'essentiel en haut de page. */
.hero { display: flex; flex-direction: column; gap: 20px; padding: 24px; border-radius: calc(var(--radius) + 4px); border: var(--border-width) solid var(--border); background: linear-gradient(140deg, var(--accent-soft), transparent 60%), var(--surface); box-shadow: var(--card-shadow); }
[data-dash="brutal"] .hero, [data-dash="dessine"] .hero { background: var(--surface); }
.hero-main { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); font-family: var(--ff-body); }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.versus-team { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-family: var(--ff-heading); font-weight: var(--heading-weight); font-size: 17px; overflow-wrap: anywhere; }
.versus-team .badge { width: 56px; height: 56px; font-size: 15px; }
.versus-mid { font-family: var(--ff-heading); font-size: clamp(30px, 8vw, 44px); line-height: 1; white-space: nowrap; }
.center { text-align: center; justify-content: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--surface-2); border-radius: var(--radius-sm); min-width: 0; }
.kpi dt { font-size: 12px; color: var(--text-2); }
.kpi dd { font-size: 14px; }
.kpi-value { font-family: var(--ff-heading); font-weight: var(--heading-weight); font-size: 26px; line-height: 1.1; }
.forms { display: flex; gap: 6px; align-items: center; min-height: 29px; }
.page-head { display: flex; justify-content: flex-end; margin-bottom: -8px; }
.toolbar > .btn:last-child, .toolbar > .icon-btn:last-child { margin-left: auto; }

/* Pastilles : équipe, résultat. */
.badge { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--surface-2); border: var(--border-width) solid var(--border); font: 600 10px/1 var(--ff-body); letter-spacing: 0.02em; color: var(--text); }
[data-dash="brutal"] .badge { border-radius: 0; border-color: #000; }
.form { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none; border-radius: 50%; font: 700 12px/1 var(--ff-body); border: var(--border-width) solid var(--border); background: var(--surface-2); color: var(--text); }
.form-v { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.form-d { background: none; color: var(--text-2); border-style: dashed; }

/* Lignes de match. */
.matches { display: flex; flex-direction: column; }
.match { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.match:last-child { border-bottom: 0; padding-bottom: 0; }
.match:first-child { padding-top: 0; }
.match-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; font-size: 15px; }
.side { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; text-align: right; }
.side.away { justify-content: flex-start; text-align: left; }
.team-name { overflow-wrap: anywhere; min-width: 0; }
.match-score { font-family: var(--ff-heading); font-size: 19px; white-space: nowrap; min-width: 58px; text-align: center; }
.match-score.is-live { color: var(--accent); }
[data-dash="brutal"] .match-score.is-live, [data-dash="dessine"] .match-score.is-live { color: var(--text); text-decoration: underline; }
.match-time { min-width: 58px; text-align: center; padding: 4px 8px; border-radius: 999px; background: var(--surface-2); font-size: 14px; }
.live-row { background: var(--accent-soft); margin-inline: -10px; padding-inline: 10px !important; border-radius: var(--radius-sm); }
.squad { display: flex; flex-direction: column; gap: 14px; }
.squad-names { font-size: 14px; line-height: 1.7; }
.scorer .bar { height: 8px; }

/* Sources et précisions repliées. */
.folded { display: none !important; }
.info { font-size: 12px; color: var(--text-2); }
.info summary { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; cursor: pointer; list-style: none; border-radius: var(--radius-sm); }
.info summary::-webkit-details-marker { display: none; }
.info summary:hover { color: var(--text); }
.card-info { margin: -10px 0 -12px; }
/* Replié, le « i » se loge dans le coin de la carte au lieu d'occuper une ligne. */
.card-info:not([open]) { position: absolute; right: 6px; bottom: 4px; margin: 0; }
.card-info:not([open]) summary { margin: 0; }
.card:has(> .card-info:not([open])) { padding-bottom: 44px; }
.card:has(> .link-btn):has(> .card-info:not([open])) { padding-bottom: 22px; }
.card-info summary { font-size: 0; gap: 0; width: 44px; justify-content: center; margin-left: -12px; }
.card-info summary .ic { width: 16px; height: 16px; }
.info-body { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 10px; }
.info-line a { color: inherit; }
.card > .link-btn + .card-info { margin-top: -4px; }
@media (max-width: 420px) { .match-line { font-size: 14px; gap: 6px; } .badge { width: 28px; height: 28px; font-size: 9px; } .versus-team .badge { width: 48px; height: 48px; } }


/* ================= Motion design =================
 * Seuls transform et opacity sont animés. Les entrées utilisent « backwards » : une fois jouées,
 * elles rendent la main aux styles normaux (survol, pression). Le thème Brutaliste passe en paliers nets.
 */
:root { --spring: cubic-bezier(0.34, 1.45, 0.64, 1); --glide: cubic-bezier(0.22, 1, 0.36, 1); }
@supports (animation-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1.004 83.8%, 1); }
}
[data-dash="brutal"] { --spring: steps(3, end); --glide: steps(4, end); }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes rise-sm { from { opacity: 0; transform: translateY(6px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes from-left { from { opacity: 0; transform: translateX(-22px); } }
@keyframes from-right { from { opacity: 0; transform: translateX(22px); } }
@keyframes zoom { from { opacity: 0; transform: scale(0.85); } }

/* Arrivée d'un onglet : ses blocs montent l'un après l'autre. */
.view > * { animation: rise 460ms var(--glide) backwards; }
.view > :nth-child(2) { animation-delay: 50ms; }
.view > :nth-child(3) { animation-delay: 100ms; }
.view > :nth-child(4) { animation-delay: 150ms; }
.view > :nth-child(n + 5) { animation-delay: 200ms; }
/* Une donnée qui arrive remplace son squelette en douceur. */
.slot > * { animation: fade 320ms ease-out backwards; }
.grid > .slot:nth-child(2) > * { animation-delay: 70ms; }
.grid > .slot:nth-child(3) > * { animation-delay: 140ms; }
.grid > .slot:nth-child(n + 4) > * { animation-delay: 210ms; }
/* Changement de sous-section. */
[role="tabpanel"]:not([hidden]) { animation: rise-sm 340ms var(--glide) backwards; }

/* Listes : les lignes entrent en cascade (les premières seulement, pour rester rapide). */
.matches > .match, .grid > .article, .mails > li, .kpis > .kpi, .meters > li, .trend > li { animation: rise-sm 420ms var(--glide) backwards; }
:is(.matches, .mails, .kpis, .meters, .trend) > :nth-child(2), .grid > .article:nth-child(2) { animation-delay: 45ms; }
:is(.matches, .mails, .kpis, .meters, .trend) > :nth-child(3), .grid > .article:nth-child(3) { animation-delay: 90ms; }
:is(.matches, .mails, .kpis, .meters, .trend) > :nth-child(4), .grid > .article:nth-child(4) { animation-delay: 135ms; }
:is(.matches, .mails, .kpis, .meters, .trend) > :nth-child(5), .grid > .article:nth-child(5) { animation-delay: 180ms; }
:is(.matches, .mails, .kpis, .meters, .trend) > :nth-child(n + 6), .grid > .article:nth-child(n + 6) { animation-delay: 225ms; }

/* L'essentiel du Real : les deux équipes arrivent de chaque côté, l'heure ou le score surgit au centre. */
.versus-team:first-child { animation: from-left 560ms var(--spring) 120ms backwards; }
.versus-team:last-child { animation: from-right 560ms var(--spring) 120ms backwards; }
.versus-mid { animation: zoom 520ms var(--spring) 260ms backwards; }
/* Pastilles de forme : elles « poppent » une à une. */
.forms > .form { animation: pop 440ms var(--spring) backwards; }
.forms > .form:nth-child(1) { animation-delay: 380ms; }
.forms > .form:nth-child(2) { animation-delay: 450ms; }
.forms > .form:nth-child(3) { animation-delay: 520ms; }
.forms > .form:nth-child(4) { animation-delay: 590ms; }
.forms > .form:nth-child(5) { animation-delay: 660ms; }
.match .form { animation: pop 380ms var(--spring) 200ms backwards; }

/* Barres et jauges : elles se remplissent depuis la gauche. */
.bar-fill, .range span { transform-origin: left center; animation: grow-x 800ms var(--glide) 180ms backwards; }
.bar-mark { animation: fade 300ms ease-out 700ms backwards; }

/* Survol et pression. */
.card.article, .card.mail, .kpi, .tile, .theme-choice { transition: transform 220ms var(--glide); }
@media (hover: hover) {
  .card.article:hover, .card.mail:hover { transform: translateY(-3px); }
  .kpi:hover { transform: translateY(-2px); }
  .side-link .ic { transition: transform 220ms var(--spring); }
  .side-link:hover .ic { transform: translateX(3px) scale(1.08); }
  .icon-btn .ic { transition: transform 300ms var(--spring); }
  .icon-btn:hover .ic { transform: rotate(-12deg) scale(1.1); }
}
.icon-btn:active .ic { transform: scale(0.85); }
/* Barre du bas et liste latérale : l'icône de l'onglet choisi rebondit. */
.bottom-link.active .ic, .side-link.active .ic { animation: pop 420ms var(--spring) backwards; }
/* Précisions dépliées, fenêtres. */
.info[open] .info-body { animation: rise-sm 260ms var(--glide) backwards; }
.live-row .match-score { animation: zoom 500ms var(--spring) backwards; }
.badge { transition: transform 260ms var(--spring); }
@media (hover: hover) { .match:hover .badge { transform: scale(1.12); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---- Plein écran ---- */
.wide-only-flex { display: none; }
@media (min-width: 900px) { .wide-only-flex { display: inline-flex; } }
:fullscreen, :fullscreen body { background: var(--bg); }
:fullscreen { overflow-y: auto; }
/* En plein écran sur grand écran, le contenu profite de la largeur. */
:fullscreen .main { max-width: 1600px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; max-width: min(92vw, 520px); padding: 12px 18px; transform: translateX(-50%); background: var(--card-solid); color: var(--text); border: var(--border-width) solid var(--border); border-radius: 999px; box-shadow: 0 12px 40px -12px rgb(0 0 0 / 0.5); font-size: 14px; text-align: center; animation: toast-in 380ms var(--spring) backwards; }
[data-dash="brutal"] .toast { border-radius: 0; box-shadow: 6px 6px 0 #000; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } }
@media (max-width: 899px) { .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); } }
