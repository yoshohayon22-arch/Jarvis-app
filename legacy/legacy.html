R.endTiles = (s, x) => [["Buts en carrière", String(s.career.goals), "Réalité : plus de 900"], ["Ballons d’or", String(s.career.ballons), "Réalité : 5"], ["Ligues des champions", String(s.career.cl), "Réalité : 5"], ["Sélections · buts", `${s.career.caps} · ${s.career.natGoals}`, "Réalité : plus de 220 sélections"], ["Trophées", String(s.career.trophies.length), s.career.trophies.slice(-3).map(t => t.n).join(", ") || "Aucun"], ["Fidélité à la réalité", `${x.fidelity} %`, `${x.same} choix sur ${x.total} comme le vrai Ronaldo`]];

/* ---------------- Match en direct : situations et options ---------------- */
R.matchSkill = (s, k) => k === "physique" ? s.stats.forme : (s.skills[k] || 70);
R.moments = [
  { txt: "Lancé dans la profondeur, vous vous présentez seul face au gardien.", opts: [{ id: "frappe", label: "Frapper", sk: "finition", base: .46, goal: true }, { id: "dribble", label: "Dribbler le gardien", sk: "vitesse", base: .36, goal: true, bonus: .3 }, { id: "passe", label: "Passer au coéquipier démarqué", sk: "passe", base: .62, assist: true }] },
  { txt: "Coup franc à vingt-cinq mètres, légèrement sur la gauche. Le mur se place.", opts: [{ id: "cf", label: "Coup franc direct", sk: "cf", base: .17, goal: true, bonus: .4 }, { id: "centre", label: "Centrer au second poteau", sk: "passe", base: .3, assist: true }, { id: "court", label: "Jouer court", sk: "passe", base: .9, none: true }] },
  { txt: "Un centre arrive de l’aile droite, à hauteur du point de penalty.", opts: [{ id: "tete", label: "Reprendre de la tête", sk: "tete", base: .36, goal: true }, { id: "volee", label: "Tenter la volée", sk: "finition", base: .22, goal: true, bonus: .5 }, { id: "remise", label: "Remettre en retrait", sk: "passe", base: .5, assist: true }] },
  { txt: "Contre-attaque : vous partez du milieu de terrain avec un défenseur devant vous.", opts: [{ id: "dribble", label: "Dribbler", sk: "vitesse", base: .4, goal: true, bonus: .3 }, { id: "loin", label: "Frapper de loin", sk: "finition", base: .13, goal: true, bonus: .5 }, { id: "passe", label: "Décaler un partenaire", sk: "passe", base: .48, assist: true }] },
  { txt: "Penalty ! L’arbitre désigne le point. Le gardien vous fixe.", pen: true, opts: [{ id: "droite", label: "À ras de terre, à droite", sk: "finition", base: .8, goal: true }, { id: "gauche", label: "En hauteur, à gauche", sk: "finition", base: .76, goal: true, bonus: .1 }, { id: "panenka", label: "Une panenka", sk: "finition", base: .62, goal: true, bonus: .5 }] },
  { txt: "Ballon récupéré à l’entrée de la surface, deux défenseurs reviennent sur vous.", opts: [{ id: "frappe", label: "Frapper tout de suite", sk: "finition", base: .26, goal: true }, { id: "dribble", label: "Passement de jambes et crochet", sk: "vitesse", base: .3, goal: true, bonus: .3 }, { id: "passe", label: "Passer dans la course d’un coéquipier", sk: "passe", base: .44, assist: true }] }
];
})();
</script>
<script>
"use strict";
/* =====================================================================
   MOTEUR — temps (semaine), effets, santé, mort, événements, mémoire
   ===================================================================== */
const SAVE_VERSION = 3;
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const parseD = d => { const [y, m, dd] = String(d).split("-").map(Number); return { y, m: m || 1, d: dd || 1 }; };
const fmtD = (y, m, d) => `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const frDate = d => { const p = parseD(d); return `${p.d === 1 ? "1er" : p.d} ${MONTHS[p.m - 1]} ${p.y}`; };
const frMonth = d => { const p = parseD(d); return `${MONTHS[p.m - 1]} ${p.y}`; };
const addDays = (d, n) => { const p = parseD(d); const t = new Date(Date.UTC(2000, p.m - 1, p.d)); t.setUTCFullYear(p.y); t.setUTCDate(t.getUTCDate() + n); return fmtD(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
const addMonths = (d, n) => { const p = parseD(d); let m = p.m - 1 + n; const y = p.y + Math.floor(m / 12); m = ((m % 12) + 12) % 12; return fmtD(y, m + 1, Math.min(p.d, 28)); };
const yearsBetween = (a, b) => { const A = parseD(a), B = parseD(b); let y = B.y - A.y; if (B.m < A.m || (B.m === A.m && B.d < A.d)) y--; return y; };
const pickW = arr => { const tot = arr.reduce((t, x) => t + (x.w || 1), 0); let r = Math.random() * tot; for (const x of arr) { r -= (x.w || 1); if (r <= 0) return x; } return arr[arr.length - 1]; };
const WEEK = 7 / 30.4375;   // fraction de mois écoulée en une semaine

const GAME = {
  s: null,
  ch: s => CHARACTERS[(s || GAME.s).char],
  age: s => yearsBetween(GAME.ch(s).born, s.date),
  power: s => (GAME.ch(s).ranks[s.rank] || { power: 0 }).power,
  rankLabel: s => GAME.ch(s).rankLabel ? GAME.ch(s).rankLabel(s) : (GAME.ch(s).ranks[s.rank] || { label: s.rank }).label,
  statDef: (s, id) => GAME.ch(s).stats.find(x => x.id === id),
  relDef: (s, id) => GAME.ch(s).relations.find(x => x.id === id),
  relKnown: (s, id) => { const r = GAME.relDef(s, id); return !!r && r.from <= s.date; },
  relAlive: (s, id) => GAME.relKnown(s, id) && !s.deadRel[id],
  hasHeir: s => s.family.children.length > 0 || !!s.family.heir,
  relStatus: v => v >= 40 ? "allie" : v >= -15 ? "neutre" : v >= -50 ? "rival" : "ennemi",
  relStatusLabel: { allie: "Allié", neutre: "Neutre", rival: "Rival", ennemi: "Ennemi", mort: "Décédé" },
  canAct: s => !s.dead && s.actionWeek !== s.week,

  newGame(charId, startId, slot){
    const ch = CHARACTERS[charId]; const st = ch.starts.find(x => x.id === startId) || ch.starts[0];
    const stats = {}; for (const d of ch.stats) stats[d.id] = st.stats[d.id] ?? 50;
    const rel = {}; for (const r of ch.relations) rel[r.id] = st.rel?.[r.id] ?? r.start ?? 0;
    const done = {}; for (const e of ch.events) if (e.date < st.date) done[e.id] = "pre"; for (const id of (st.done || [])) done[id] = "pre";
    const s = {
      v: SAVE_VERSION, char: charId, mode: "carriere", slot, startId: st.id, startDate: st.date, date: st.date, week: 0,
      stats, prev: { ...stats }, rel, flags: { ...(st.flags || {}) }, rank: st.rank, scene: st.scene, place: st.place,
      family: { spouse: st.family?.spouse || null, spouseName: null, exSpouses: [...(st.family?.exSpouses || [])], children: [...(st.family?.children || [])], heir: null },
      conditions: [], done, history: [], feed: [], journal: [], deferred: [], deadRel: {},
      counters: { battlesWon: 0, battlesLost: 0, reforms: 0, treaties: 0, weeks: 0, maxDep: stats.departements || 0, popSum: 0, powerWeeks: 0, ...(st.counters || {}) },
      nextRandomIn: 6, nextRivalIn: 8, nextMailIn: 3, recentRandom: [], actionWeek: -1, corr: {}, corrQueue: [], fin: [], where: null, feedN: 0, dead: null, pending: null, speed: 0, savedAt: null
    };
    for (const r of ch.relations) if (r.dies && r.dies.date <= s.date) s.deadRel[r.id] = r.dies.date;
    if (ch.setup) ch.setup(s, st.id, false);
    GAME.news(s, { src: "Carnet", title: st.title, text: st.summary, tone: "key" });
    return s;
  },

  /* Fil d’actualité : articles, dépêches et notes */
  news(s, it){
    const ch = GAME.ch(s); const src = it.src || "Carnet";
    const cat = it.cat || (ch.newsCat ? ch.newsCat(src) : "sys");
    let ton = { favorable: "fav", hostile: "hos", neutre: "neu", fav: "fav", hos: "hos", neu: "neu" }[String(it.ton || "").toLowerCase()] || (cat === "sys" ? "" : "neu");
    // Effet visible de l’article sur l’opinion, en France ou à l’étranger
    let fx = null;
    if (cat !== "sys" && ton && ton !== "neu" && ch.newsFx) fx = ch.newsFx(s, cat, ton === "fav" ? 1 : -1);
    s.feed.unshift({ d: s.date, src, title: it.title || "", text: it.text || "", tone: it.tone || "", kind: it.kind || "", cat, ton, fx });
    s.feedN = (s.feedN || 0) + 1; if (s.feed.length > 220) s.feed.length = 220;
  },
  log(s, t, tone = "", src){ GAME.news(s, { src: src || "Carnet", text: t, tone }); },

  /* Applique un bloc d’effets. Renvoie les variations pour l’affichage. */
  applyFx(s, fx, out = { deltas: {}, rels: {}, notes: [], death: null }){
    if (!fx) return out;
    const ch = GAME.ch(s); const hooks = ch.statHooks || {};
    const setStat = (k, nv) => { const d = GAME.statDef(s, k); if (!d) return; const before = s.stats[k]; if (hooks[k]) { hooks[k].set(s, clamp(nv, d.min, d.max)); ch.sync && ch.sync(s); } else s.stats[k] = clamp(nv, d.min, d.max); out.deltas[k] = (out.deltas[k] || 0) + (s.stats[k] - before); };
    const addStat = (k, v) => { const d = GAME.statDef(s, k); if (!d || typeof v !== "number" || !isFinite(v) || !v) return; const before = s.stats[k]; if (hooks[k]) { hooks[k].add(s, v); ch.sync && ch.sync(s); } else s.stats[k] = clamp(before + v, d.min, d.max); out.deltas[k] = (out.deltas[k] || 0) + (s.stats[k] - before); };
    if (fx.preset && ch.applyPreset) ch.applyPreset(s, fx.preset, false);
    if (fx.set) for (const [k, v] of Object.entries(fx.set)) setStat(k, v);
    if (fx.s) for (const [k, v] of Object.entries(fx.s)) addStat(k, v);
    if (fx.r) for (const [k, v] of Object.entries(fx.r)) { if (!(k in s.rel) || !GAME.relAlive(s, k) || typeof v !== "number") continue; const nv = clamp(s.rel[k] + v, -100, 100); out.rels[k] = (out.rels[k] || 0) + (nv - s.rel[k]); s.rel[k] = nv; }
    if (fx.spouseRel && s.family.spouse) { const k = s.family.spouse; const nv = clamp(s.rel[k] + fx.spouseRel, -100, 100); out.rels[k] = (out.rels[k] || 0) + (nv - s.rel[k]); s.rel[k] = nv; }
    if (fx.pays && s.pays) for (const [k, o] of Object.entries(fx.pays)) { const c = s.pays[k]; if (!c || !o) continue; if (o.statut && o.statut !== c.statut) { c.statut = o.statut; if (o.statut !== "guerre") c.ws = 0; out.notes.push(`${ch.regionName(k)} : ${ch.map.statusLabel[o.statut].toLowerCase()}.`); } if (typeof o.rel === "number") c.rel = clamp(c.rel + o.rel, -100, 100); if (typeof o.armee === "number") c.armee = Math.max(0, c.armee + o.armee); if (typeof o.ws === "number") c.ws = clamp((c.ws || 0) + o.ws, -100, 100); if (typeof o.pression === "number") c.pression = clamp((c.pression || 0) + o.pression, 0, 100); }
    if (fx.paysAll && s.pays) for (const c of Object.values(s.pays)) if (c.statut === "guerre") { c.statut = fx.paysAll; c.ws = 0; }
    if (fx.moveCorps && s.corps) for (const c of s.corps) if (c.loc !== "espagne" || fx.moveCorps === "espagne" || s.corps.length <= 3) { c.loc = fx.moveCorps; c.dest = null; c.eta = null; }
    if (fx.moveCorps) s.where = fx.moveCorps; else if (fx.place && (fx.scene === "palais" || fx.scene === "paris")) s.where = "france";
    if (fx.thr && s.thrones) Object.assign(s.thrones, fx.thr);
    if (typeof fx.depot === "number" && "depot" in s) s.depot = Math.max(0, s.depot + fx.depot);
    if (fx.f) Object.assign(s.flags, fx.f);
    if (fx.c) for (const [k, v] of Object.entries(fx.c)) s.counters[k] = (s.counters[k] || 0) + v;
    if (fx.rank && fx.rank !== s.rank) { s.rank = fx.rank; out.notes.push(`Nouveau titre : ${GAME.rankLabel(s)}.`); }
    if (fx.scene) s.scene = fx.scene;
    if (fx.place) s.place = fx.place;
    if ("spouse" in fx) { if (fx.ex) s.family.exSpouses.push(fx.ex); s.family.spouse = fx.spouse; s.family.spouseName = fx.spouseName || null; if (fx.spouse || fx.spouseName) out.notes.push(`Mariage : ${fx.spouseName || GAME.relDef(s, fx.spouse).name}.`); else if (fx.ex) out.notes.push("Divorce prononcé."); }
    if (fx.child) { s.family.children.push({ name: fx.child.name, born: s.date }); out.notes.push(`Naissance : ${fx.child.name}.`); }
    if (fx.heir) { s.family.heir = fx.heir; out.notes.push(`Héritier désigné : ${fx.heir}.`); }
    if (fx.danger && !out.death) { const p = clamp(+fx.danger.p || 0, 0, .3); if (Math.random() < p) out.death = { type: fx.danger.type || "accident", cause: fx.danger.cause || "Mort brutale." }; }
    if (fx.call && ch.fxCall) ch.fxCall(s, fx.call, out);
    if (fx.gamble) { const g = fx.gamble; const v = s.rel[g.rel] ?? 0; const p = clamp(.35 + (v - g.threshold) / 120, .05, .9); const ok = Math.random() < p; out.notes.push(g[ok ? "win" : "loss"].txt); GAME.applyFx(s, g[ok ? "win" : "loss"], out); }
    ch.sync && ch.sync(s);
    return out;
  },

  /* Résolution rapide d’une bataille (quand le joueur délègue) */
  quickBattle(s, b){
    const st = s.stats;
    let p = b.base + (st.moral - 60) * .003 + (st.loyaute - 55) * .0015 - Math.max(0, st.fatigue - 60) * .002;
    if (b.need) p += clamp((st.armee - b.need) / b.need * .15, -.25, .12);
    const win = Math.random() < clamp(p, .04, .95);
    return { win, lossPct: win ? .08 + Math.random() * .08 : .15 + Math.random() * .15, quick: true };
  },
  /* Applique l’issue d’une bataille (tactique ou rapide) */
  battleOutcome(s, b, res, out){
    out.battle = { name: b.name, win: res.win };
    s.counters[res.win ? "battlesWon" : "battlesLost"]++;
    s.lastBattle = { name: b.name, win: res.win, week: s.week, used: false };
    const r = res.win ? b.win : b.loss;
    if (r) { const copy = JSON.parse(JSON.stringify(r)); if (!res.quick && copy.s && copy.s.armee < 0) delete copy.s.armee; GAME.applyFx(s, copy, out); if (r.txt) out.notes.unshift(r.txt); }
    if (res.quick && s.corps) { for (const c of s.corps) if (c.loc !== "espagne" || b.region === "espagne") c.men *= 1 - res.lossPct * .5; GAME.ch(s).sync(s); }
    const risk = b.risk ?? .006;
    if (!out.death && Math.random() < risk * (res.win ? 1 : 2.2)) out.death = { type: "bataille", cause: `Tué à la bataille de ${b.name}.` };
    return out;
  },

  /* Avance d’une semaine */
  tick(s){
    const ch = GAME.ch(s);
    s.prev = { ...s.stats };
    s.date = addDays(s.date, ch.unit.days || 7);
    s.week++; s.counters.weeks++;
    const p = parseD(s.date); const dt = WEEK;
    const h = {
      age: GAME.age(s), month: p.m - 1, dt,
      add: (k, v) => { const d = GAME.statDef(s, k); if (!d) return; const hk = ch.statHooks && ch.statHooks[k]; if (hk) hk.add(s, v * dt); else s.stats[k] = clamp(s.stats[k] + v * dt, d.min, d.max); },
      drift: (k, target, rate) => { const d = GAME.statDef(s, k); if (d) s.stats[k] = clamp(s.stats[k] + (target - s.stats[k]) * rate * dt, d.min, d.max); },
      chance: pm => Math.random() < pm * dt,
      fx: fx => GAME.applyFx(s, fx),
      condition: (id, name, sev) => { if (!s.conditions.find(c => c.id === id)) { s.conditions.push({ id, name, sev, since: s.date }); GAME.log(s, `Santé : ${name}.`, "bad"); } },
      hasCondition: id => !!s.conditions.find(c => c.id === id)
    };
    const msgs = ch.tick.call(ch, s, h) || [];
    for (const m of msgs) GAME.log(s, m.t, m.tone, m.src);
    for (const c of [...s.conditions]) {
      s.stats.sante = clamp(s.stats.sante - c.sev * dt, 0, 100);
      if (c.id === "cancer") c.sev = Math.min(4, c.sev + .045 * dt);
      if (c.id === "typhus" && Math.random() < .3 * dt) { s.conditions = s.conditions.filter(x => x !== c); GAME.log(s, "Vous vous remettez du typhus.", "good"); }
    }
    for (const r of ch.relations) {
      if (!s.deadRel[r.id] && r.dies && r.dies.date <= s.date && (!r.dies.cond || r.dies.cond(s))) {
        s.deadRel[r.id] = s.date; GAME.log(s, `${r.name} : ${r.dies.cause}.`, "bad");
        if (s.family.spouse === r.id) { s.family.spouse = null; GAME.log(s, "Vous voilà veuf.", "bad"); s.stats.stress = clamp(s.stats.stress + 12, 0, 100); }
      }
    }
    // Conséquences différées arrivées à échéance
    const fired = [];
    for (const d of [...s.deferred]) if (d.date <= s.date) { s.deferred = s.deferred.filter(x => x !== d); const o = GAME.applyFx(s, d.fx); GAME.news(s, { src: d.src || "Conséquence", title: d.title, text: d.text, tone: "key", kind: "differe" }); const j = s.journal.find(x => x.id === d.from); if (j) (j.suites = j.suites || []).push({ d: s.date, t: d.title }); fired.push({ d, o }); }
    // Finances : un relevé par mois pour le graphique
    if (ch.budget && s.week % 4 === 0) { const bu = ch.budget(s); s.fin.push({ d: s.date, t: s.stats[ch.fin.stat], R: bu.R, D: bu.D }); if (s.fin.length > 14) s.fin.shift(); }
    // Courrier : lettres arrivées chez leur destinataire, réponses arrivées chez vous
    const arrived = [], mail = [];
    for (const [id, th] of Object.entries(s.corr)) for (const m of th) if (m.me && m.arrive && !m.asked && m.arrive <= s.date) { m.asked = true; arrived.push({ id, m }); }
    for (const q of [...s.corrQueue]) if (q.at <= s.date) { s.corrQueue = s.corrQueue.filter(x => x !== q); if (!GAME.relAlive(s, q.id)) continue; (s.corr[q.id] = s.corr[q.id] || []).push({ d: s.date, me: false, t: q.t, unread: true }); if (q.rel) GAME.applyFx(s, { r: { [q.id]: q.rel } }); mail.push(q); }
    const b = parseD(ch.born); if (p.m === b.m && p.d >= b.d && p.d < b.d + 7) GAME.log(s, `Vous avez ${GAME.age(s)} ans.`);
    ch.sync && ch.sync(s);
    if (ch.weekEnd) ch.weekEnd(s, h);
    s.counters.maxDep = Math.max(s.counters.maxDep || 0, s.stats.departements || 0);
    s.counters.popSum = (s.counters.popSum || 0) + (s.stats.popularite || 0);
    if (GAME.power(s) >= 2) s.counters.powerWeeks = (s.counters.powerWeeks || 0) + 1;
    return { death: GAME.mortality(s, dt), fired, arrived, mail };
  },

  mortality(s, dt){
    const ch = GAME.ch(s); const age = GAME.age(s); const st = s.stats;
    const worst = [...s.conditions].filter(c => c.sev >= .5).sort((a, b) => b.sev - a.sev)[0];
    if (st.sante <= 0) return { type: "maladie", cause: worst ? `Emporté par la maladie (${worst.name.toLowerCase()}), à ${age} ans.` : `Mort d’épuisement, le corps usé, à ${age} ans.` };
    const condLoad = s.conditions.reduce((t, c) => t + c.sev, 0);
    const nat = (.00035 * Math.exp(.088 * (age - 40)) * (1 + Math.max(0, 65 - st.sante) / 14) + condLoad * .0012) * dt * (ch.mortality || 1);
    const plot = (ch.plotHazard ? ch.plotHazard(s) : 0) * dt;
    const acc = .00012 * dt;
    const r = Math.random();
    if (age >= 99 || r < nat) {
      if (age >= 72) return { type: "vieillesse", cause: `Mort de vieillesse, à ${age} ans.` };
      return { type: "maladie", cause: worst ? `Emporté par la maladie (${worst.name.toLowerCase()}), à ${age} ans.` : `${ch.suddenCause || "Foudroyé par une attaque d’apoplexie"}, à ${age} ans.` };
    }
    if (r < nat + plot) return { type: "assassinat", cause: ch.plotCause ? ch.plotCause(s) : "Assassiné." };
    if (r < nat + plot + acc) return { type: "accident", cause: ch.accidentCause || "Mort dans un accident." };
    return null;
  },

  dueHistorical(s){
    const ch = GAME.ch(s);
    for (const e of ch.events) {
      if (s.done[e.id]) continue;
      const until = e.until || addMonths(e.date, 4);
      if (e.date <= s.date && s.date <= until) { let ok = true; try { ok = !e.cond || !!e.cond(s); } catch (err) { ok = false; } if (ok) return e; }
    }
    return null;
  },
  pickFallback(s){
    const ch = GAME.ch(s);
    const pool = ch.randomEvents.filter(e => { if (e.once && s.done[e.id]) return false; if (s.recentRandom.includes(e.id)) return false; try { return !e.cond || e.cond(s); } catch (err) { return false; } });
    return pool.length ? pickW(pool) : null;
  },

  /* Rivaux : progression écrite d’avance, utilisée quand l’IA ne répond pas */
  rivalsScripted(s){
    const ch = GAME.ch(s); const out = [];
    const r = ch.rivals[Math.floor(Math.random() * ch.rivals.length)]; const v = s.rivals[r.id]; const plan = r.plans[v.i % r.plans.length];
    v.prog = clamp(v.prog + 18 + Math.round(Math.random() * 22), 0, 100);
    if (v.prog >= 100) {
      GAME.applyFx(s, plan.done); out.push({ src: ch.newsSources(s)[1], title: plan.title, text: `${r.name} est parvenu à ses fins : ${plan.plan.toLowerCase()}.`, tone: "bad", kind: "rival" });
      if (plan.war && s.pays[r.id] && s.pays[r.id].statut === "paix" && s.pays[r.id].rel <= plan.war) { GAME.applyFx(s, { pays: { [r.id]: { statut: "guerre", rel: -20 } }, s: { coalition: 8 } }); out.push({ src: ch.newsSources(s)[0], title: `${ch.regionName(r.id)} déclare la guerre`, text: "Les ambassadeurs ont demandé leurs passeports. Les armées sont en marche.", tone: "bad", kind: "rival" }); }
      v.i++; v.prog = 0; v.plan = r.plans[v.i % r.plans.length].plan;
    } else out.push({ src: ch.newsSources(s)[Math.min(4, ch.newsSources(s).length - 1)], title: plan.news[Math.floor(Math.random() * plan.news.length)], text: "", kind: "rival" });
    for (const n of out) GAME.news(s, n);
    return out;
  }
};

/* =====================================================================
   STOCKAGE — try/catch partout, format versionné et migration
   ===================================================================== */
const STORE = {
  key: n => `legacy.slot.${n}`,
  read(n){ try { const raw = localStorage.getItem(STORE.key(n)); return raw ? STORE.migrate(JSON.parse(raw)) : null; } catch (e) { return null; } },
  write(n, s){ try { s.savedAt = new Date().toISOString(); localStorage.setItem(STORE.key(n), JSON.stringify(s)); return true; } catch (e) { return false; } },
  remove(n){ try { localStorage.removeItem(STORE.key(n)); return true; } catch (e) { return false; } },
  getSetting(k, def){ try { const v = localStorage.getItem("legacy.set." + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  setSetting(k, v){ try { localStorage.setItem("legacy.set." + k, JSON.stringify(v)); } catch (e) {} },
  valid(s){ return !!s && typeof s === "object" && s.v === SAVE_VERSION && !!CHARACTERS[s.char] && typeof s.date === "string" && !!s.stats && !!s.rel && !!s.family && Array.isArray(s.feed); },
  /* Migre une sauvegarde d’un format antérieur vers le format courant. Renvoie null si elle est illisible. */
  migrate(s){
    try {
      if (!s || typeof s !== "object") return null;
      if (s.state && !s.char) s = s.state;
      if (!CHARACTERS[s.char] || !s.stats || !s.rel || !s.family) return null;
      if (!s.v || s.v < 2) {
        // v1 : tour mensuel, actions à délai, journal simple
        const ch = CHARACTERS[s.char];
        s.week = Math.round((s.counters?.months || 0) * 4.35);
        s.counters = { battlesWon: 0, battlesLost: 0, reforms: 0, treaties: 0, ...(s.counters || {}) };
        s.counters.weeks = s.week; s.counters.powerWeeks = Math.round((s.counters.powerMonths || 0) * 4.35); s.counters.popSum = (s.counters.popSum || 0) * 4.35;
        s.feed = (s.log || []).map(l => ({ d: l.d, src: "Carnet", title: "", text: l.t, tone: l.tone || "", kind: "" }));
        delete s.log; delete s.cooldowns;
        s.journal = []; s.deferred = []; s.actionWeek = -1; s.nextRandomIn = 6; s.nextRivalIn = 8; s.recentRandom = s.recentRandom || []; s.pending = null;
        s.history = s.history || []; s.done = s.done || {}; s.deadRel = s.deadRel || {}; s.conditions = s.conditions || []; s.flags = s.flags || {};
        for (const d of ch.stats) if (typeof s.stats[d.id] !== "number") s.stats[d.id] = 50;
        for (const r of ch.relations) if (typeof s.rel[r.id] !== "number") s.rel[r.id] = r.start || 0;
        if (ch.setup) ch.setup(s, null, true);
        s.v = 2;
        GAME.news(s, { src: "Carnet", title: "Partie reprise", text: "Cette partie vient d’une version précédente du jeu. Elle a été convertie : le temps avance désormais à la semaine.", tone: "key" });
      }
      if (s.v < 3) {
        // v2 : interface à panneaux ; v3 ajoute la correspondance, le relevé des finances et les ordres aux corps
        const ch = CHARACTERS[s.char];
        for (const r of ch.relations) if (typeof s.rel[r.id] !== "number") s.rel[r.id] = r.start || 0;
        for (const r of ch.relations) if (r.dies && r.dies.date <= s.date && !s.deadRel[r.id] && (!r.dies.cond || r.dies.cond(s))) s.deadRel[r.id] = r.dies.date;
        s.corr = s.corr || {}; s.corrQueue = s.corrQueue || []; s.fin = s.fin || []; s.where = s.where || null; s.nextMailIn = s.nextMailIn || 3; s.feedN = s.feed.length;
        if (ch.defaultPol) s.pol = { ...ch.defaultPol, ...(s.pol || {}) };
        for (const c of (s.corps || [])) c.stance = c.stance || "marche";
        for (const n of s.feed) { n.cat = n.cat || (ch.newsCat ? ch.newsCat(n.src) : "sys"); n.ton = n.ton || (n.cat === "sys" ? "" : "neu"); }
        s.v = 3;
      }
      return s;
    } catch (e) { return null; }
  }
};
</script>
<script>
"use strict";
/* =====================================================================
   IA — Claude évalue les actions libres, conseille, écrit les dépêches,
   fait avancer les rivaux et raconte les batailles. JSON strict, validé.
   ===================================================================== */
const AI = {
  sample: null, downloads: null, available: false, status: "init", note: "Connexion à Claude…",
  ready: null, pending: null, failures: 0, tok: 0, ctls: new Set(),
  enabled: STORE.getSetting("ai", true),
  tier: STORE.getSetting("tier", "default"),

  async init(){
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const [smp, dl] = await Promise.all([window.claude.use("sample").catch(() => null), window.claude.use("downloads").catch(() => null)]);
        AI.sample = smp; AI.downloads = dl;
      }
    } catch (e) { AI.sample = null; }
    AI.available = !!AI.sample;
    AI.setStatus(AI.available ? "ok" : "off", AI.available ? "Claude est prêt" : "Claude indisponible dans cette vue");
  },
  setStatus(st, note){ AI.status = st; AI.note = note; UI.updateAIStatus && UI.updateAIStatus(); },
  usable(){ return AI.available && AI.enabled; },

  /* Appel générique : JSON attendu, délai maximal, annulation propre */
  async call(prompt, { tier = AI.tier, timeout = 90000, json = true } = {}){
    if (!AI.usable()) throw { code: "unavailable" };
    const ctl = new AbortController(); AI.ctls.add(ctl);
    const timer = setTimeout(() => ctl.abort(), timeout);
    try {
      if (json) return await AI.sample.json(prompt, { modelTier: tier, signal: ctl.signal, cache: false });
      const r = await AI.sample(prompt, { modelTier: tier, signal: ctl.signal, cache: false }); return r.text;
    } catch (e) {
      const code = e && e.code;
      if (["not_granted", "sampling_disabled", "capability_disabled", "not_declared", "session_expired"].includes(code)) { AI.available = false; AI.setStatus("off", "Claude n’est pas autorisé dans cette vue"); }
      throw e;
    } finally { clearTimeout(timer); AI.ctls.delete(ctl); }
  },

  /* ---------- Contexte commun envoyé à chaque appel ---------- */
  context(s){
    const ch = GAME.ch(s); const y = parseD(s.date).y;
    const stats = ch.stats.map(d => `- ${d.id} (${d.label}) = ${Math.round(s.stats[d.id])}${d.fmt ? ` [${d.fmt(s.stats[d.id])}]` : " /100"}${d.bad === "high" ? " ; une hausse est mauvaise" : ""} ; variation max ±${d.aiMax}`).join("\n");
    const rels = ch.relations.filter(r => GAME.relAlive(s, r.id)).map(r => `- ${r.id} : ${r.name}, ${r.role} — ${Math.round(s.rel[r.id])} (${GAME.relStatusLabel[GAME.relStatus(s.rel[r.id])]})`).join("\n");
    const pays = s.pays ? Object.entries(s.pays).map(([k, c]) => `- ${k} : ${ch.regionName(k)} — ${ch.map.statusLabel[c.statut]}, relation ${Math.round(c.rel)}, armée ≈ ${Math.round(c.armee)} 000`).join("\n") : "";
    const corps = s.corps && s.corps.length ? s.corps.map(c => `- ${c.name} (${ch.marshalName(c.marshal)}) : ${Math.round(c.men)} 000 h., moral ${Math.round(c.moral)}, ravitaillement ${Math.round(c.supply)}, ${ch.regionName(c.loc)}`).join("\n") : "- aucun";
    const fam = [s.family.spouse ? `conjoint : ${GAME.relDef(s, s.family.spouse).name}` : s.family.spouseName ? `conjoint : ${s.family.spouseName}` : "pas de conjoint", s.family.children.length ? `enfants : ${s.family.children.map(c => c.name).join(", ")}` : "pas d’enfant", s.family.heir ? `héritier : ${s.family.heir}` : ""].filter(Boolean).join(" ; ");
    const diverg = s.history.filter(h => h.kind === "hist" && h.hist === false).map(h => `- ${frMonth(h.date)}, ${h.title} : « ${h.choice} » au lieu de ce qui s’est réellement passé`).join("\n") || "- aucune : l’Histoire suit son cours réel";
    const next = ch.events.find(e => !s.done[e.id] && e.date > s.date && e.choices.some(c => c.hist));
    const lois = s.laws ? Object.keys(s.laws).join(", ") : "";
    return `PERSONNAGE : ${ch.aiBrief}
DATE : ${frDate(s.date)} — ${GAME.age(s)} ans — ${GAME.rankLabel(s)} — lieu : ${s.place}
CONTEXTE RÉEL : ${y} : ${ch.eraNotes[y] || "—"} / ${y + 1} : ${ch.eraNotes[y + 1] || "—"}
${next ? `PROCHAIN GRAND MOMENT HISTORIQUE (géré à part) : ${next.title}, ${frMonth(next.date)}.` : ""}
BIFURCATIONS DÉJÀ PROVOQUÉES PAR LE JOUEUR :
${diverg}

JAUGES :
${stats}
${s.dette !== undefined ? `Dette : ${Math.round(s.dette)} M F. Lois en vigueur : ${lois || "aucune"}.` : ""}

RELATIONS VIVANTES (-100 ennemi … +100 allié) :
${rels}
${pays ? `\nPUISSANCES :\n${pays}` : ""}
${s.corps ? `\nCORPS D’ARMÉE :\n${corps}\nDépôts : ${Math.round(s.depot)} 000 h.` : ""}
${ch.aiState ? ch.aiState(s) + "\n" : ""}FAMILLE : ${fam}
SANTÉ : ${s.conditions.length ? s.conditions.map(c => c.name).join(", ") : "pas de maladie déclarée"}`;
  },

  /* Mémoire : actions récentes en détail, anciennes en résumé compact (rien n’est supprimé du journal) */
  memory(s){
    const j = s.journal; if (!j.length) return "- (aucune action libre pour l’instant)";
    const recent = j.slice(-8), old = j.slice(0, -8);
    const line = x => `- ${frDate(x.d)} [${x.typeLabel}] ${x.resume}${x.suites && x.suites.length ? ` (suites : ${x.suites.map(q => q.t).join(" ; ")})` : ""}`;
    let oldTxt = "";
    if (old.length) {
      const keep = old.length > 110 ? [...old].sort((a, b) => (b.importance || 1) - (a.importance || 1)).slice(0, 110).sort((a, b) => a.d.localeCompare(b.d)) : old;
      oldTxt = `ACTIONS PLUS ANCIENNES (résumé${old.length > keep.length ? `, ${old.length - keep.length} actions mineures omises` : ""}) :\n` + keep.map(x => `- ${frMonth(x.d)} : ${String(x.resume).slice(0, 90)}`).join("\n") + "\n";
    }
    return oldTxt + "ACTIONS RÉCENTES (détail) :\n" + recent.map(x => `${line(x)}\n  Texte du joueur : « ${String(x.text).slice(0, 320)} »`).join("\n") + (s.deferred.length ? "\nCONSÉQUENCES EN ATTENTE :\n" + s.deferred.map(d => `- vers ${frMonth(d.date)} : ${d.title}`).join("\n") : "");
  },
  rules(s){ return GAME.ch(s).aiRules.map(r => "- " + r).join("\n"); },

  /* Convertit un bloc d’effets renvoyé par l’IA en effets du jeu, bornés */
  normFx(o, s, scale = 1){
    const ch = GAME.ch(s); const fx = { s: {}, r: {}, pays: {} }; if (!o || typeof o !== "object") return fx;
    const j = o.jauges && typeof o.jauges === "object" ? o.jauges : o;
    for (const [k, v] of Object.entries(j)) { const d = ch.stats.find(x => x.id === k); const n = Number(v); if (d && isFinite(n) && n) fx.s[k] = clamp(Math.round(n), -d.aiMax * scale, d.aiMax * scale); }
    const relIds = ch.relations.map(r => r.id);
    for (const [k, v] of Object.entries(o.relations || {})) { const id = AI.findRel(s, k); const n = Number(v); if (id && isFinite(n) && n && GAME.relAlive(s, id)) fx.r[id] = clamp(Math.round(n), -25, 25); }
    if (s.pays) for (const [k, v] of Object.entries(o.pays || {})) { const n = Number(typeof v === "object" && v ? v.relation ?? v.rel : v); if (s.pays[k] && isFinite(n) && n) fx.pays[k] = { rel: clamp(Math.round(n), -25, 25) }; }
    return fx;
  },
  findRel(s, k){ const ch = GAME.ch(s); const key = String(k || "").toLowerCase().trim(); if (!key) return null; return (ch.relations.find(r => r.id === key) || ch.relations.find(r => r.name.toLowerCase().includes(key) || key.includes(r.id) || key.includes(r.name.toLowerCase().split(" ").pop())))?.id || null; },

  /* ---------- 1. Action libre : validité et répercussions ---------- */
  actionPrompt(s, a){
    const ch = GAME.ch(s); const tp = ch.speech.find(x => x.id === a.type);
    return `Tu es le moteur de simulation de « Legacy », un simulateur de vie historique sérieux, en français. Le joueur incarne le personnage et vient d’écrire UNE action libre. Tu dois juger si elle est possible, puis calculer ses répercussions de façon réaliste.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}

ACTION DU JOUEUR — type : ${tp.label} (${tp.hint})${a.target ? ` — destinataire : ${a.target}` : ""}
« ${a.text} »

RÈGLES :
- "valide" = false si l’action est impossible ou anachronique pour ce personnage à cette date (technologie inexistante, pouvoir qu’il n’a pas avec son titre actuel, personne morte ou pas encore née, moyens qu’il n’a pas). Donne alors une "raison" courte et concrète, et laisse le reste vide. Une action maladroite, risquée ou impopulaire reste valide : elle a simplement des conséquences.
- Difficulté équilibrée : réaliste, mais une erreur doit rester rattrapable. La plupart des effets valent entre 1 et 8 points ; réserve les grands effets aux actes majeurs. Une action médiocre a des effets faibles, pas nuls.
- Tiens compte de la mémoire : une action ancienne peut ressurgir (un journal ressort une promesse, une loi passée produit encore des effets, un personnage se souvient).
- "effets_differes" : de 0 à 3 conséquences futures plausibles, avec un délai en semaines (de 2 à 520).
- "fil_actualite" : 2 à 4 articles de sources d’époque crédibles pour ce personnage (${ch.newsSources(s).join(", ")}…), y compris des sources étrangères ou hostiles quand c’est logique. Titre, une ou deux phrases, et le ton de l’article envers le personnage (favorable, neutre ou hostile).
- "reactions_personnages" : 1 à 4 personnes réelles concernées, parmi les relations listées (utilise leur identifiant), avec une réaction paraphrasée et le changement de relation (-20 à +20).
- "commentaires_public" : 3 à 6 réactions courtes et variées (${ch.publicLabel}), chacune attribuée à un type de personne (« un grenadier », « une marchande des Halles »…).
${AI.rules(s)}
- "resume" : une phrase neutre qui résume l’action et son effet, pour la mémoire. "importance" : 1 (anecdotique) à 5 (tournant de la partie).

RÉPONDS UNIQUEMENT par un objet JSON de cette forme exacte :
{"valide":true,"raison":"","resume":"…","importance":2,"effets_immediats":{"jauges":{"popularite":3},"relations":{"talleyrand":-4},"pays":{"autriche":-5}},"effets_differes":[{"dans_semaines":12,"titre":"…","texte":"…","jauges":{"tresor":-20},"relations":{},"pays":{}}],"fil_actualite":[{"source":"…","titre":"…","texte":"…","ton":"favorable|neutre|hostile"}],"reactions_personnages":[{"id":"talleyrand","nom":"Talleyrand","reaction":"…","relation":-4}],"commentaires_public":[{"qui":"un grenadier de la Garde","texte":"…"}]}`;
  },
  normAction(o, s){
    if (!o || typeof o !== "object" || typeof o.valide !== "boolean") throw new Error("forme");
    if (!o.valide) return { valide: false, raison: String(o.raison || "Cette action n’est pas possible à cette date.").slice(0, 400) };
    const ch = GAME.ch(s);
    const fx = AI.normFx(o.effets_immediats, s, 1.5);
    const reactions = (Array.isArray(o.reactions_personnages) ? o.reactions_personnages : []).slice(0, 5).map(r => { const id = AI.findRel(s, r.id) || AI.findRel(s, r.nom); const n = clamp(Math.round(Number(r.relation) || 0), -20, 20); return { id: id && GAME.relAlive(s, id) ? id : null, nom: String(r.nom || (id ? GAME.relDef(s, id).name : "")).slice(0, 60), reaction: String(r.reaction || "").slice(0, 300), relation: n }; }).filter(r => r.nom && r.reaction);
    for (const r of reactions) if (r.id && r.relation) fx.r[r.id] = r.relation;
    const differes = (Array.isArray(o.effets_differes) ? o.effets_differes : []).slice(0, 4).map(d => ({ weeks: clamp(Math.round(Number(d.dans_semaines) || 8), 1, 520), title: String(d.titre || "Conséquence").slice(0, 100), text: String(d.texte || "").slice(0, 400), fx: AI.normFx(d, s, 1.5) })).filter(d => d.title);
    const news = (Array.isArray(o.fil_actualite) ? o.fil_actualite : []).slice(0, 4).map(n => ({ src: String(n.source || ch.newsSources(s)[0]).slice(0, 60), title: String(n.titre || "").slice(0, 140), text: String(n.texte || "").slice(0, 400), ton: String(n.ton || "neutre") })).filter(n => n.title);
    const comments = (Array.isArray(o.commentaires_public) ? o.commentaires_public : []).slice(0, 6).map(c => typeof c === "string" ? { qui: "", texte: c.slice(0, 220) } : { qui: String(c.qui || "").slice(0, 60), texte: String(c.texte || "").slice(0, 220) }).filter(c => c.texte);
    if (news.length < 1) throw new Error("fil manquant");
    return { valide: true, resume: String(o.resume || "").slice(0, 240) || "Action libre.", importance: clamp(Math.round(Number(o.importance) || 2), 1, 5), fx, differes, news, reactions, comments };
  },
  /* Un essai, puis un second si la réponse est absente ou invalide */
  async evaluateAction(s, a){
    const prompt = AI.actionPrompt(s, a); let last = null;
    for (let i = 0; i < 2; i++) {
      try { return AI.normAction(await AI.call(prompt, { timeout: 110000 }), s); }
      catch (e) { last = e; if (e && ["unavailable", "not_granted", "sampling_disabled", "capability_disabled", "not_declared", "rate_limited", "refused"].includes(e.code)) break; }
    }
    throw last || new Error("échec");
  },

  /* ---------- Interview : le journaliste pose ses questions ---------- */
  async interview(s){
    const ch = GAME.ch(s);
    const o = await AI.call(`Dans « Legacy », simulateur de vie sérieux en français, un journaliste interviewe le personnage. Choisis un média réel et crédible à cette date pour ce personnage, puis pose 2 ou 3 questions courtes, précises et un peu délicates, liées à sa situation actuelle et à ses actions récentes. Pas de question sur sa vie intime, sa santé privée ou des affaires judiciaires.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}
${AI.rules(s)}
RÉPONDS UNIQUEMENT par un objet JSON : {"media":"…","questions":["…","…"]}`, { timeout: 70000 });
    const qs = (o && Array.isArray(o.questions) ? o.questions : []).slice(0, 3).map(q => String(q).slice(0, 240)).filter(Boolean);
    if (qs.length < 2) throw new Error("forme");
    return { media: String(o.media || "un grand média").slice(0, 60), questions: qs };
  },

  /* ---------- 2. Conseiller : avis avant l’envoi, sans consommer l’action ---------- */
  async advise(s, a){
    const ch = GAME.ch(s); const adv = ch.advisor(s); const tp = ch.speech.find(x => x.id === a.type);
    const o = await AI.call(`Tu joues ${adv.name}, ${adv.role}, conseiller du personnage dans « Legacy », simulateur historique sérieux en français. Ton caractère : ${adv.style}. Tu donnes ton avis AVANT que l’action soit lancée. C’est une reconstitution : ne cite aucune phrase réelle de ${adv.name}, parle à la première personne en le paraphrasant, en vouvoyant le personnage.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}

ACTION ENVISAGÉE — type : ${tp.label}${a.target ? ` — destinataire : ${a.target}` : ""}
« ${a.text} »

Dis franchement si l’action est possible à cette date, ce qu’elle risque de produire, et propose mieux si tu vois mieux. Reste bref et concret.
RÉPONDS UNIQUEMENT par un objet JSON : {"avis":"2 à 4 phrases","risques":["…","…"],"effets_probables":["…","…"],"alternatives":["…","…"]}`, { timeout: 80000 });
    if (!o || typeof o.avis !== "string") throw new Error("forme");
    const arr = x => (Array.isArray(x) ? x : []).slice(0, 4).map(t => String(t).slice(0, 220)).filter(Boolean);
    return { name: adv.name, role: adv.role, avis: o.avis.slice(0, 700), risques: arr(o.risques), effets: arr(o.effets_probables), alternatives: arr(o.alternatives) };
  },

  /* ---------- 3. Dépêches à choix (3 à 4 par an) ---------- */
  eventPrompt(s){
    const ch = GAME.ch(s);
    return `Tu es le moteur narratif de « Legacy », un simulateur de vie historique sérieux et réaliste, entièrement en français.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}
DERNIÈRES DÉCISIONS À CHOIX :
${s.history.slice(-6).map(h => `- ${frMonth(h.date)} — ${h.title} : ${h.choice}`).join("\n") || "- (début de partie)"}

CONSIGNES :
- Écris UN événement qui s’impose au personnage, plausible à cette date et dans cette situation précise : politique, militaire, diplomatique, économique, familial, santé. Il peut découler d’une action libre passée du joueur. Varie les thèmes.
- Appuie-toi sur des faits, des lieux, des institutions et des personnes réels de l’époque. Si les choix du joueur ont changé l’Histoire, fais réagir le monde de façon crédible. Ne raconte pas le prochain grand moment historique.
- Texte de 3 à 5 phrases, au présent, en vouvoyant le personnage. Ton sobre de récit historique.
${AI.rules(s)}
- Entre 2 et 4 choix, avec de vrais compromis. Effets proportionnés : la plupart entre 2 et 8 points, dans les bornes indiquées.
- « danger » facultatif : seulement si le choix expose physiquement le personnage (probabilité 0.01 à 0.08, cause de mort courte).

RÉPONDS UNIQUEMENT par un objet JSON de cette forme exacte :
{"titre":"…","lieu":"…","texte":"…","personnages":["id_relation_ou_nom"],"choix":[{"texte":"…","effets":{"popularite":-4,"tresor":30},"relations":{"talleyrand":6},"pays":{"autriche":-5},"danger":null,"resume":"…"}]}`;
  },
  normEvent(o, s){
    if (!o || typeof o !== "object") throw new Error("pas un objet");
    const title = String(o.titre || "").trim(), text = String(o.texte || "").trim();
    if (title.length < 3 || text.length < 60) throw new Error("texte manquant");
    if (!Array.isArray(o.choix) || o.choix.length < 2) throw new Error("choix manquants");
    const choices = o.choix.slice(0, 4).map(c => {
      const t = String(c.texte || "").trim(); if (!t) throw new Error("choix vide");
      const fx = AI.normFx({ jauges: c.effets, relations: c.relations, pays: c.pays }, s, 1);
      if (c.danger && typeof c.danger === "object" && Number(c.danger.p ?? c.danger.proba) > 0) fx.danger = { p: clamp(Number(c.danger.p ?? c.danger.proba), 0, .08), type: String(c.danger.type || "accident"), cause: String(c.danger.cause || "Mort brutale.").slice(0, 160) };
      return { t: t.slice(0, 200), res: String(c.resume || "").slice(0, 260), fx };
    });
    const people = (Array.isArray(o.personnages) ? o.personnages : []).slice(0, 6).map(p => AI.findRel(s, p) || String(p).slice(0, 40));
    return { id: "ai-" + Date.now().toString(36), title: title.slice(0, 90), place: String(o.lieu || s.place).slice(0, 80), text: text.slice(0, 1100), people, choices, scene: s.scene, forDate: s.date, rank: s.rank };
  },
  prefetch(s){
    if (!AI.usable() || AI.pending || AI.ready || AI.failures >= 4) return;
    const snap = JSON.parse(JSON.stringify(s)); const tok = AI.tok;
    AI.setStatus("busy", "Claude prépare la prochaine dépêche…");
    const p = AI.call(AI.eventPrompt(snap), { timeout: 90000 }).then(o => { const ev = AI.normEvent(o, snap); if (tok === AI.tok) { AI.ready = ev; AI.failures = 0; AI.setStatus("ok", "Dépêche prête"); return ev; } return null; })
      .catch(() => { AI.failures++; if (AI.available) AI.setStatus("ok", "Claude est prêt"); return null; }).finally(() => { if (AI.pending === p) AI.pending = null; });
    AI.pending = p;
  },
  take(s){ const e = AI.ready; AI.ready = null; if (!e) return null; if (e.rank !== s.rank || addDays(e.forDate, 240) < s.date) return null; return e; },
  reset(){ AI.tok++; AI.ready = null; for (const c of AI.ctls) c.abort(); AI.pending = null; },

  /* ---------- 4. Rivaux : leurs plans avancent tous les quelques mois ---------- */
  async rivals(s){
    const ch = GAME.ch(s);
    const list = ch.rivals.map(r => `- ${r.id} : ${r.name} — plan actuel : ${s.rivals[r.id].plan} — avancement ${s.rivals[r.id].prog} %`).join("\n");
    const o = await AI.call(`Tu fais vivre les rivaux du personnage dans « Legacy », simulateur historique sérieux en français. Chaque rival poursuit son propre plan, indépendamment du joueur, et réagit à la situation.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}

RIVAUX :
${list}

Fais avancer UN ou DEUX de ces plans de façon crédible pour l’époque (les autres ne bougent pas). Pour chacun : le plan (tu peux le faire évoluer ou le remplacer s’il est achevé ou devenu absurde), le nouvel avancement (0 à 100, en général +10 à +35), une annonce pour le fil d’actualité (source d’époque, titre, une ou deux phrases) et de petits effets (jauges entre -6 et +6, relations des pays entre -10 et +10). Si un plan atteint 100, décris son aboutissement dans l’annonce et donne des effets un peu plus forts.
${AI.rules(s)}
Ajoute aussi une courte revue de presse : 2 articles (un français, un étranger) qui commentent la situation actuelle ou une action récente du joueur, avec leur ton envers le personnage.\nRÉPONDS UNIQUEMENT par un objet JSON : {"rivaux":[{"id":"…","plan":"…","progression":45,"annonce":{"source":"…","titre":"…","texte":"…"},"effets":{"jauges":{"coalition":3},"pays":{"autriche":-4}}}],"presse":[{"source":"…","titre":"…","texte":"…","ton":"favorable|neutre|hostile"}]}`, { timeout: 90000 });
    if (!o || !Array.isArray(o.rivaux)) throw new Error("forme");
    const out = [];
    for (const r of o.rivaux.slice(0, 2)) {
      const def = ch.rivals.find(x => x.id === r.id); if (!def) continue; const v = s.rivals[def.id];
      const prog = clamp(Math.round(Number(r.progression) || v.prog), 0, 100); const done = prog >= 100;
      if (r.plan) v.plan = String(r.plan).slice(0, 160); v.prog = done ? 0 : prog;
      const fx = AI.normFx(r.effets, s, done ? 1 : .5); for (const k of Object.keys(fx.pays)) fx.pays[k].rel = clamp(fx.pays[k].rel, -12, 12);
      GAME.applyFx(s, fx);
      const n = { src: String(r.annonce?.source || ch.newsSources(s)[0]).slice(0, 60), title: String(r.annonce?.titre || def.name).slice(0, 140), text: String(r.annonce?.texte || "").slice(0, 400), tone: done ? "bad" : "", kind: "rival", ton: "hos" };
      GAME.news(s, n); out.push(n);
    }
    if (!out.length) throw new Error("vide");
    for (const a of (Array.isArray(o.presse) ? o.presse : []).slice(0, 2)) if (a && a.titre) GAME.news(s, { src: String(a.source || ch.newsSources(s)[1]).slice(0, 60), title: String(a.titre).slice(0, 140), text: String(a.texte || "").slice(0, 400), ton: a.ton });
    return out;
  },

  /* ---------- Correspondance : un contact répond, ou écrit de lui-même ---------- */
  thread(s, id){ const th = s.corr[id] || []; const last = th.slice(-12); return (th.length > last.length ? `(${th.length - last.length} lettres plus anciennes non reproduites)\n` : "") + (last.map(m => `- ${frDate(m.d)} — ${m.me ? "LE PERSONNAGE écrit" : "LE CONTACT écrit"} : « ${String(m.t).slice(0, 500)} »`).join("\n") || "- (aucun échange jusqu’ici)"); },
  async reply(s, id){
    const ch = GAME.ch(s); const r = GAME.relDef(s, id);
    const o = await AI.call(`Tu écris la réponse de ${r.name} (${r.role}) à une lettre du personnage, dans « Legacy », simulateur historique sérieux en français. C’est une reconstitution : écris dans sa personnalité, avec ses connaissances et ses intérêts réels à cette date, sans reprendre de phrases authentiques. Caractère : ${ch.persona[id] || r.bio}. ${r.bio}
Lieu du contact : ${ch.regionName(ch.contactLoc(s, id))}. Relation actuelle avec le personnage : ${Math.round(s.rel[id])} sur une échelle de -100 à +100 (${GAME.relStatusLabel[GAME.relStatus(s.rel[id])]}).

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}

CORRESPONDANCE AVEC CE CONTACT (la dernière lettre du personnage est celle à laquelle tu réponds) :
${AI.thread(s, id)}

Écris une lettre de 2 à 5 phrases, à la première personne, dans le ton et les formules de l’époque et de ce lien (une épouse ne s’adresse pas comme un ministre ou un souverain ennemi). Le contact ne sait que ce qu’il peut savoir là où il est. Il peut accepter, refuser, marchander, flatter, se plaindre ou donner une information utile. Si la lettre reçue est anachronique ou incompréhensible pour lui, il s’en étonne.
${AI.rules(s)}
"relation" : l’effet de cet échange sur la relation, entre -8 et +8.
RÉPONDS UNIQUEMENT par un objet JSON : {"reponse":"…","relation":2}`, { timeout: 80000 });
    if (!o || typeof o.reponse !== "string" || o.reponse.trim().length < 5) throw new Error("forme");
    return { t: o.reponse.trim().slice(0, 900), rel: clamp(Math.round(Number(o.relation) || 0), -8, 8) };
  },
  async mail(s){
    const ch = GAME.ch(s); const ids = ch.contactGroups.flatMap(g => g[1]).filter(id => GAME.relAlive(s, id));
    const o = await AI.call(`Dans « Legacy », simulateur historique sérieux en français, un proche ou un correspondant du personnage lui écrit de lui-même. Choisis UN contact qui a une vraie raison d’écrire maintenant (demande, conseil, plainte, nouvelle, mise en garde) et rédige sa lettre, dans sa personnalité et avec ce qu’il peut savoir. C’est une reconstitution : aucune phrase authentique.

${AI.context(s)}

MÉMOIRE DE LA PARTIE :
${AI.memory(s)}

CONTACTS POSSIBLES (identifiant : caractère) :
${ids.map(id => `- ${id} : ${GAME.relDef(s, id).name} — ${ch.persona[id] || ""}${(s.corr[id] || []).length ? ` — dernier échange le ${frDate(s.corr[id][s.corr[id].length - 1].d)}` : ""}`).join("\n")}

Lettre de 2 à 4 phrases, à la première personne, dans le ton de l’époque. Varie les correspondants : évite ceux qui ont écrit récemment.
${AI.rules(s)}
RÉPONDS UNIQUEMENT par un objet JSON : {"id":"…","message":"…"}`, { timeout: 80000 });
    const id = o && AI.findRel(s, o.id); if (!id || !GAME.relAlive(s, id) || typeof o.message !== "string" || o.message.trim().length < 5) throw new Error("forme");
    return { id, t: o.message.trim().slice(0, 800) };
  },

  /* ---------- 5. Récit court d’une phase de bataille ---------- */
  async narrate(s, info){
    return String(await AI.call(`Tu racontes une phase de bataille dans « Legacy », simulateur historique sérieux en français. Écris 2 phrases, au présent, sobres et précises, sans citation inventée, à partir de ces faits calculés par le jeu (ne change aucun chiffre) :
${info}
Réponds par le texte seul.`, { tier: "quick", timeout: 20000, json: false })).trim().slice(0, 420);
  }
};
</script>
<script>
"use strict";
/* =====================================================================
   BATAILLE TACTIQUE — grille de 5 secteurs, 3 phases, un ordre par unité.
   Générique : le personnage fournit ses unités (battleSetup) et récupère
   les pertes (battleApply). Servira aussi aux duels.
   ===================================================================== */
const BATTLE = {
  B: null,
  ORDERS: { attaquer: { label: "Attaquer", hint: "Frappe fort, s’expose davantage." }, tenir: { label: "Tenir", hint: "Défend sa position ; profite du terrain." }, contourner: { label: "Contourner", hint: "Manœuvre cette phase, frappe de flanc à la suivante." }, reserve: { label: "Réserve", hint: "Hors du feu, reprend du moral ; entre fraîche plus tard." } },
  TERR: { plaine: { label: "Plaine", def: 0 }, colline: { label: "Hauteur", def: .25 }, village: { label: "Village", def: .3 }, bois: { label: "Bois", def: .15 }, riviere: { label: "Ruisseau", def: .1, river: true } },

  start(s, b, title, cb){
    const ch = GAME.ch(s); const set = ch.battleSetup ? ch.battleSetup(s, b) : null;
    if (!set || !set.mine.length || !b.need) { cb(GAME.quickBattle(s, b)); return; }
    const terrKeys = ["plaine", "plaine", "plaine", "colline", "village", "bois", "riviere"];
    const terr = Array.from({ length: 5 }, () => ({ mine: terrKeys[Math.floor(Math.random() * terrKeys.length)], foe: terrKeys[Math.floor(Math.random() * terrKeys.length)] }));
    const cols = n => n >= 5 ? [2, 1, 3, 0, 4] : n === 4 ? [1, 2, 3, 0] : n === 3 ? [2, 1, 3] : n === 2 ? [1, 3] : [2];
    const place = (arr, side) => arr.map((u, i) => ({ ...u, side, id: side + i, col: cols(Math.min(arr.length, 5))[i % 5], row: i >= 5 ? "back" : "front", order: "tenir", men0: u.men, routed: false, fresh: false, flankNext: false, flanking: false }));
    BATTLE.B = { s, b, title, cb, phase: 0, terr, mine: place(set.mine, "m"), foes: place(set.foes, "f"), sel: null, texts: [], changeLeft: 99, over: null, unitLabel: set.unitLabel || "hommes" };
    BATTLE.render();
  },
  quick(){ const B = BATTLE.B; BATTLE.close(); B.cb(GAME.quickBattle(B.s, B.b)); },
  close(){ overlay().innerHTML = ""; UI.modalOpen = false; BATTLE.B = null; },

  q: u => (.6 + u.moral / 125) * (.75 + (u.supply ?? 60) / 400) * (u.skill || 1),
  alive: arr => arr.filter(u => !u.routed),
  total: arr => arr.reduce((t, u) => t + (u.routed ? u.men * .5 : u.men), 0),

  foeOrders(B){
    for (const u of BATTLE.alive(B.foes)) {
      const facing = BATTLE.alive(B.mine).filter(m => m.col === u.col).reduce((t, m) => t + m.men, 0);
      const r = Math.random(); const agg = (B.b.base < .45 ? .6 : .42) + (u.men > facing * 1.3 ? .2 : 0) - (u.moral < 40 ? .25 : 0);
      u.order = r < agg ? "attaquer" : r < agg + .08 && B.phase < 2 ? "contourner" : "tenir";
    }
  },

  resolve(){
    const B = BATTLE.B; if (!B || B.over) return;
    BATTLE.foeOrders(B);
    const all = [...B.mine, ...B.foes];
    // Manœuvres de flanc lancées à la phase précédente
    for (const u of BATTLE.alive(all)) { u.flanking = false; if (u.flankNext) { const foe = BATTLE.alive(u.side === "m" ? B.foes : B.mine); const near = foe.filter(f => Math.abs(f.col - u.col) === 1).sort((a, b) => Math.abs(a.col - 2) - Math.abs(b.col - 2))[0] || foe.sort((a, b) => Math.abs(a.col - u.col) - Math.abs(b.col - u.col))[0]; if (near) u.col = near.col; u.row = "front"; u.flanking = true; u.flankNext = false; u.order = "attaquer"; } }
    for (const u of BATTLE.alive(all)) if (u.order === "attaquer" && u.row === "back") u.row = "front";
    const atk = (u, river) => { let m = u.flanking ? 1.7 : u.order === "attaquer" ? 1.25 : u.order === "tenir" ? .8 : u.order === "contourner" ? .3 : 0; if (u.fresh && u.order === "attaquer") m *= 1.3; if (u.row === "back") m *= .45; if (river && (u.order === "attaquer" || u.flanking)) m *= .8; return u.men * BATTLE.q(u) * m; };
    const taken = (u, t) => { let m = u.flanking ? .6 : u.order === "attaquer" ? 1.15 : u.order === "tenir" ? .75 * (1 - BATTLE.TERR[t].def) : u.order === "contourner" ? .5 : .15; if (u.row === "back") m *= .45; return m; };
    const K = .085; const facts = []; const before = { m: BATTLE.total(B.mine), f: BATTLE.total(B.foes) };
    const spill = { m: 0, f: 0 };
    for (let c = 0; c < 5; c++) {
      const M = BATTLE.alive(B.mine).filter(u => u.col === c), F = BATTLE.alive(B.foes).filter(u => u.col === c);
      const river = BATTLE.TERR[B.terr[c].mine].river || BATTLE.TERR[B.terr[c].foe].river;
      const aM = M.reduce((t, u) => t + atk(u, river), 0), aF = F.reduce((t, u) => t + atk(u, river), 0);
      const hit = (units, dmg, t) => { const tot = units.reduce((x, u) => x + u.men, 0); for (const u of units) { const loss = Math.min(u.men * .6, dmg * (u.men / tot) * taken(u, t)); u.men -= loss; u.moral -= loss / Math.max(1, u.men + loss) * 110; u._loss = (u._loss || 0) + loss; } };
      if (M.length && F.length) { hit(F, aM * K, B.terr[c].foe); hit(M, aF * K, B.terr[c].mine); for (const u of M) if (aM > aF) u.moral += 4; for (const u of F) if (aF > aM) u.moral += 4; }
      else if (M.length && !F.length && aM > 0 && M.some(u => u.order === "attaquer" || u.flanking)) { spill.f += aM * .5; facts.push(`Secteur ${c + 1} : percée de ${M[0].name}, personne en face.`); for (const u of BATTLE.alive(B.foes)) u.moral -= 5; }
      else if (F.length && !M.length && aF > 0 && F.some(u => u.order === "attaquer" || u.flanking)) { spill.m += aF * .5; facts.push(`Secteur ${c + 1} : l’ennemi perce, aucun de vos corps ne tient ce secteur.`); for (const u of BATTLE.alive(B.mine)) u.moral -= 5; }
    }
    for (const side of ["m", "f"]) if (spill[side] > 0) { const units = BATTLE.alive(side === "m" ? B.mine : B.foes); const tot = units.reduce((x, u) => x + u.men, 0); for (const u of units) { const loss = Math.min(u.men * .3, spill[side] * K * (u.men / tot)); u.men -= loss; u.moral -= loss / Math.max(1, u.men + loss) * 110; } }
    for (const u of BATTLE.alive(all)) {
      if (u.order === "reserve") { u.moral = Math.min(100, u.moral + 8); u.fresh = true; } else u.fresh = false;
      if (u.order === "contourner" && !u.flanking) u.flankNext = true;
      u.moral = clamp(u.moral, 0, 100);
      if (u.moral <= 15 || u.men <= u.men0 * .12) { u.routed = true; u.men *= .8; facts.push(`${u.name} ${u.side === "m" ? "(à vous)" : "(ennemi)"} se débande.`); }
    }
    B.phase++;
    const lostM = before.m - BATTLE.total(B.mine), lostF = before.f - BATTLE.total(B.foes);
    for (const u of BATTLE.alive(B.mine)) if (u.flanking) facts.push(`${u.name} tombe sur le flanc ennemi dans le secteur ${u.col + 1}.`);
    const txt = `Phase ${B.phase} : vous perdez environ ${BATTLE.fmt(lostM, B)} ; l’ennemi en perd ${BATTLE.fmt(lostF, B)}. ${facts.join(" ")}`;
    B.texts.push({ phase: B.phase, txt, ai: null });
    B.changeLeft = 1;
    const mAlive = BATTLE.alive(B.mine).length, fAlive = BATTLE.alive(B.foes).length;
    if (B.phase >= 3 || !mAlive || !fAlive) {
      const m0 = B.mine.reduce((t, u) => t + u.men0, 0), f0 = B.foes.reduce((t, u) => t + u.men0, 0);
      const lm = 1 - BATTLE.total(B.mine) / m0, lf = 1 - BATTLE.total(B.foes) / f0;
      const win = !fAlive ? true : !mAlive ? false : lf > lm * 1.05;
      B.over = { win, lossPct: lm, mineLost: m0 - BATTLE.total(B.mine), foeLost: f0 - BATTLE.total(B.foes) };
    }
    AUDIO.sfx("cannon");
    const entry = B.texts[B.texts.length - 1];
    if (AI.usable()) AI.narrate(B.s, `Bataille : ${B.b.name}. ${txt}\nVos unités : ${B.mine.map(u => `${u.name} (${u.chief || ""}) ordre ${u.order}${u.routed ? ", en déroute" : ""}`).join(" ; ")}.${B.over ? ` Issue : ${B.over.win ? "victoire" : "défaite"} du joueur.` : ""}`).then(t => { if (t && BATTLE.B === B) { entry.ai = t; BATTLE.render(); } }).catch(() => {});
    BATTLE.render();
  },
  fmt: (k, B) => B.unitLabel === "hommes" ? `${Math.max(0, Math.round(k * 1000)).toLocaleString("fr-FR")} hommes` : `${Math.max(0, Math.round(k))} ${B.unitLabel}`,

  render(){
    const B = BATTLE.B; if (!B) return; UI.modalOpen = true;
    const cell = (side, row, c) => {
      const arr = side === "m" ? B.mine : B.foes; const u = arr.find(x => x.col === c && x.row === row && !x.routed);
      const t = row === "front" ? BATTLE.TERR[B.terr[c][side === "m" ? "mine" : "foe"]] : null;
      const unit = u ? `<button class="bt-unit ${side} ${B.sel === u.id ? "sel" : ""}" data-unit="${u.id}" ${side === "f" ? "disabled" : ""}>
          <b>${esc(u.name)}</b><span>${esc(u.chief || "")}</span><span class="num">${Math.round(u.men * (B.unitLabel === "hommes" ? 1000 : 1)).toLocaleString("fr-FR")}</span>
          <span class="bar"><i class="lvl-${u.moral < 30 ? "bad" : u.moral < 50 ? "warn" : "good"}" style="width:${u.moral}%"></i></span>
          ${side === "m" ? `<em>${BATTLE.ORDERS[u.order].label}${u.flankNext ? " →" : ""}</em>` : ""}</button>` : "";
      return `<div class="bt-cell ${side} ${row} ${t ? "t-" + B.terr[c][side === "m" ? "mine" : "foe"] : ""}" data-cell="${side}|${row}|${c}">${t ? `<small>${t.label}</small>` : ""}${unit}</div>`;
    };
    const rows = [["f", "back"], ["f", "front"], ["m", "front"], ["m", "back"]].map(([sd, rw]) => Array.from({ length: 5 }, (_, c) => cell(sd, rw, c)).join("")).join("");
    const sel = B.mine.find(u => u.id === B.sel);
    const canOrder = !B.over && sel && !sel.routed && !sel.flankNext && (B.phase === 0 || B.changeLeft > 0);
    const last = B.texts[B.texts.length - 1];
    const routedM = B.mine.filter(u => u.routed), routedF = B.foes.filter(u => u.routed);
    overlay().innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Bataille"><div class="modal wide"><div class="modal-body bt">
      <div class="ev-kind"><span class="k hist">Bataille</span><span class="label">${B.over ? "Terminée" : B.phase === 0 ? "Déploiement" : `Phase ${B.phase} sur 3 jouée`}</span></div>
      <h2>${esc(B.title || B.b.name)}</h2>
      <div class="bt-forces"><span>Vous : <b class="num">${BATTLE.fmt(BATTLE.alive(B.mine).reduce((t, u) => t + u.men, 0), B)}</b></span><span>Ennemi : <b class="num">${BATTLE.fmt(BATTLE.alive(B.foes).reduce((t, u) => t + u.men, 0), B)}</b></span></div>
      <div class="bt-grid">${rows}</div>
      ${routedM.length || routedF.length ? `<p class="muted ui" style="margin:0;font-size:.85rem">En déroute : ${[...routedM.map(u => u.name + " (à vous)"), ...routedF.map(u => u.name + " (ennemi)")].map(esc).join(", ")}</p>` : ""}
      ${last ? `<div class="realbox"><b>${esc(last.ai || last.txt)}</b>${last.ai ? `<br><span class="ui" style="font-size:.82rem">${esc(last.txt)}</span>` : ""}</div>` : `<p class="muted" style="margin:0">Touchez une de vos unités, puis une case de vos deux lignes pour la placer. Donnez un ordre à chacune. Une unité seule dans un secteur face au vide peut percer ; un secteur laissé vide peut être percé.</p>`}
      ${!B.over ? `<div class="bt-orders">${sel ? `<span class="label">${esc(sel.name)}${B.phase > 0 ? ` · ${B.changeLeft > 0 ? "vous pouvez changer un ordre" : "ordre déjà changé pour cette phase"}` : ""}</span>` : `<span class="label">${B.phase > 0 && B.changeLeft > 0 ? "Vous pouvez changer un ordre : touchez une unité" : "Touchez une unité pour lui donner un ordre"}</span>`}
        <div class="bt-ord">${Object.entries(BATTLE.ORDERS).map(([k, o]) => `<button class="btn ${sel && sel.order === k ? "primary" : ""}" data-order="${k}" ${canOrder ? "" : "disabled"} title="${esc(o.hint)}">${o.label}</button>`).join("")}</div>
        ${sel ? `<span class="muted ui" style="font-size:.85rem">${esc(BATTLE.ORDERS[sel.order].hint)}</span>` : ""}</div>` : ""}
      <div class="row">${B.over ? `<span class="verdict ${B.over.win ? "win" : "loss"}" style="margin-right:auto">${B.over.win ? "Victoire" : "Défaite"}</span><button class="btn primary" id="bt-end">Continuer</button>`
        : `${B.phase === 0 ? `<button class="btn ghost" id="bt-quick">Déléguer à l’état-major</button>` : ""}<button class="btn primary" id="bt-go">${B.phase === 0 ? "Engager la bataille" : `Lancer la phase ${B.phase + 1}`}</button>`}</div>
    </div></div></div>`;
    const ov = $(".overlay");
    $$("[data-unit]", ov).forEach(b => b.onclick = e => { e.stopPropagation(); B.sel = b.dataset.unit; AUDIO.sfx("click"); BATTLE.render(); });
    $$("[data-cell]", ov).forEach(c => c.onclick = () => { const [sd, rw, col] = c.dataset.cell.split("|"); if (sd !== "m" || B.phase !== 0 || !B.sel) return; const u = B.mine.find(x => x.id === B.sel); const other = B.mine.find(x => x.col === +col && x.row === rw && x !== u); if (other) { other.col = u.col; other.row = u.row; } u.col = +col; u.row = rw; BATTLE.render(); });
    $$("[data-order]", ov).forEach(b => b.onclick = () => { const u = B.mine.find(x => x.id === B.sel); if (!u || u.order === b.dataset.order) return; u.order = b.dataset.order; if (B.phase > 0) B.changeLeft--; AUDIO.sfx("click"); BATTLE.render(); });

    const qk = $("#bt-quick", ov); if (qk) qk.onclick = () => BATTLE.quick();

  }

/* Napoléon : ses corps deviennent les unités de la bataille */
(function(){
  const N = CHARACTERS.napoleon;
  N.battleSetup = (s, b) => {
    const reg = b.region; const R = id => N.map.regions.find(r => r.id === id);
    let cs = s.corps.filter(c => c.men >= 1 && (reg ? (c.loc === reg || (R(reg) && R(reg).adj.includes(c.loc))) : c.loc !== "espagne"));
    if (!cs.length) cs = s.corps.filter(c => c.men >= 1);
    cs = [...cs].sort((a, b2) => b2.men - a.men).slice(0, 5);
    if (!cs.length) return null;
    const cap = b.need * 1.15 / cs.length;
    const mine = cs.map(c => ({ ref: c.id, name: c.name.replace("Division ", "Div. ").replace("Réserve de cavalerie", "Cavalerie").replace("Armée d", "A. d"), chief: N.marshalName(c.marshal), men: Math.min(c.men, cap), moral: c.moral, supply: c.supply, skill: N.marshal(c.marshal).skill * (1 + (s.stats.fatigue > 70 ? -.05 : .05)) }));
    const E = b.need * clamp(.6 / b.base, .8, 1.9); const n = clamp(Math.round(E / 22), 3, 5);
    const names = { autriche: "Autrichiens", russie: "Russes", prusse: "Prussiens", angleterre: "Britanniques", espagne: "Espagnols", italie: "Piémontais", ottoman: "Ottomans", allemagne: "Impériaux", naples: "Napolitains", suede: "Suédois" };
    const who = names[b.foe] || names[reg] || "Coalisés"; const wings = ["Centre", "Aile gauche", "Aile droite", "Avant-garde", "Réserve"];
    const foes = Array.from({ length: n }, (_, i) => ({ name: wings[i], chief: who, men: E / n * (i === 0 ? 1.2 : .95), moral: b.base < .45 ? 68 : 58, supply: 65, skill: b.base < .4 ? 1.08 : 1 }));
    return { mine, foes, unitLabel: "hommes" };
  };
  N.battleApply = (s, B) => { for (const u of B.mine) { const c = s.corps.find(x => x.id === u.ref); if (!c) continue; c.men = Math.max(.5, c.men - (u.men0 - u.men) - (u.routed ? u.men * .15 : 0)); c.moral = clamp(u.moral + (B.over.win ? 12 : -4), 5, 100); } N.sync(s); };
})();

<script>
"use strict";
/* =====================================================================
   MATCH EN DIRECT — un résumé qui défile, avec 2 à 3 actions clés où le
   joueur décide. Générique : le personnage fournit les situations
   (moments), ses qualités (matchSkill) et la force des équipes (xg).
   ===================================================================== */
const MATCH = {
  M: null,
  FLAVOR: ["Le match démarre sur un rythme élevé.", "Longue séquence de possession au milieu de terrain.", "Corner, repoussé par la défense.", "Le public pousse, les duels se durcissent.", "Faute au milieu de terrain, carton jaune.", "Frappe lointaine, largement au-dessus.", "Le gardien sort loin de sa ligne pour dégager.", "Changement tactique : le bloc recule de dix mètres.", "Hors-jeu signalé de justesse.", "Les deux équipes se neutralisent."],

  start(s, m, cb){
    const ch = GAME.ch(s);
    if (m.final) { m.ko = true; if (m.comp === "cl") m.stage = "f"; }
    if (!ch.plays(s, m)) { cb(ch.simulate(s, m)); return; }
    const x = ch.xg(s, m, true); const pois = l => { let L = Math.exp(-Math.max(0, l)), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
    const ev = []; const mins = new Set(); const minute = () => { let t; do { t = 3 + Math.floor(Math.random() * 86); } while (mins.has(t)); mins.add(t); return t; };
    for (let i = 0, n = pois(x.mine * (1 - x.share) * .9); i < n; i++) ev.push({ min: minute(), type: "for" });
    for (let i = 0, n = pois(x.opp); i < n; i++) ev.push({ min: minute(), type: "against" });
    for (let i = 0, n = pois(x.mine * x.share * .3); i < n; i++) ev.push({ min: minute(), type: "mine" });
    const K = m.final ? 3 : 2 + (Math.random() < .5 ? 1 : 0); const pool = [...ch.moments].sort(() => Math.random() - .5).filter((mo, i, arr) => !mo.pen || Math.random() < .35).slice(0, K);
    for (const mo of pool) ev.push({ min: minute(), type: "moment", mo });
    for (let i = 0; i < 4; i++) ev.push({ min: minute(), type: "flavor", txt: MATCH.FLAVOR[Math.floor(Math.random() * MATCH.FLAVOR.length)] });
    ev.sort((a, b) => a.min - b.min);
    const me = m.comp === "nat" || m.comp === "tour" ? "Portugal" : ch.rankLabel(s).split(" · ")[0];
    MATCH.M = { s, m, cb, ev, i: 0, gf: 0, ga: 0, goals: 0, assists: 0, bonus: 0, miss: 0, lines: [], wait: null, done: false, me, timer: null, tab: undefined, min: 0 };
    UI.modalOpen = true; AUDIO.sfx("whistle"); MATCH.push(0, `Coup d’envoi. ${m.title}.`, "");
    MATCH.render(); MATCH.run();
  },
  push(min, txt, cls){ MATCH.M.lines.push({ min, txt, cls }); },
  run(){ const M = MATCH.M; if (!M) return; clearTimeout(M.timer); M.timer = setTimeout(MATCH.step, M.fast ? 140 : 950); },
  step(){
    const M = MATCH.M; if (!M || M.wait || M.done) return;
    if (M.i >= M.ev.length) return MATCH.end();
    const e = M.ev[M.i++]; M.min = e.min;
    if (e.type === "for") { M.gf++; MATCH.push(e.min, `But pour ${M.me} ! Un coéquipier conclut une belle action collective.`, "goal"); AUDIO.sfx("goal"); }
    else if (e.type === "against") { M.ga++; MATCH.push(e.min, `But pour ${M.m.opp}. La défense est prise à défaut.`, "bad"); AUDIO.sfx("error"); }
    else if (e.type === "mine") { M.gf++; M.goals++; MATCH.push(e.min, `But ! Vous surgissez au premier poteau et trompez le gardien.`, "goal"); AUDIO.sfx("goal"); }
    else if (e.type === "flavor") MATCH.push(e.min, e.txt, "");
    else { M.wait = e; M.fast = false; MATCH.push(e.min, e.mo.txt, "key"); AUDIO.sfx("event"); }
    MATCH.render(); if (!M.wait) MATCH.run();
  },
  choose(k){
    const M = MATCH.M; if (!M || !M.wait) return; const e = M.wait, o = e.mo.opts[k], s = M.s, ch = GAME.ch(s); M.wait = null;
    const p = clamp(o.base + (ch.matchSkill(s, o.sk) - 78) / 110 + (s.stats.forme - 60) / 260 - (M.m.O - 80) / 190 - Math.max(0, s.stats.fatigue - 50) / 350, .04, .95);
    const ok = Math.random() < p;
    if (ok && o.goal) { M.gf++; M.goals++; M.bonus += o.bonus || 0; MATCH.push(e.min, `${o.label} : but ! Le stade explose.`, "goal"); AUDIO.sfx("goal"); }
    else if (ok && o.assist) { if (Math.random() < .72) { M.gf++; M.assists++; MATCH.push(e.min, `${o.label} : votre coéquipier n’a plus qu’à pousser le ballon au fond. Passe décisive.`, "goal"); AUDIO.sfx("goal"); } else MATCH.push(e.min, `${o.label} : l’offrande est parfaite, mais votre coéquipier manque le cadre.`, ""); }
    else if (ok) MATCH.push(e.min, `${o.label} : le ballon est conservé, l’action se poursuit.`, "");
    else { M.miss++; MATCH.push(e.min, e.mo.pen ? `${o.label} : le gardien a plongé du bon côté. Penalty manqué.` : o.goal ? `${o.label} : ${["le gardien détourne du bout des gants.", "le ballon frôle le poteau.", "le défenseur revient et contre."][Math.floor(Math.random() * 3)]}` : `${o.label} : la passe est interceptée.`, "bad"); if (o.goal && !e.mo.pen && e.mo.opts.some(z => z.assist)) M.selfish = (M.selfish || 0) + 1; }
    MATCH.render(); MATCH.run();
  },
  end(){
    const M = MATCH.M; const m = M.m; M.done = true; AUDIO.sfx("whistle");
    MATCH.push(90, `Coup de sifflet final : ${M.me} ${M.gf}-${M.ga} ${m.opp}.`, "");
    if (M.gf === M.ga && m.ko && (m.final || m.comp === "tour" || m.comp === "cup")) { const mine = Math.random() < .78; M.tab = Math.random() < .5 + (m.T - m.O) / 200 + (mine ? .1 : -.14); MATCH.push(120, `Prolongation sans but, puis tirs au but. Vous ${mine ? "transformez" : "manquez"} le vôtre. ${M.tab ? "Victoire au bout de la séance !" : "La séance tourne en faveur de l’adversaire."}`, M.tab ? "goal" : "bad"); }
    const win = M.tab !== undefined ? M.tab : M.gf > M.ga; AUDIO.sfx(win ? "crowd" : M.gf === M.ga ? "click" : "defeat");
    MATCH.render();
  },
  finish(){ const M = MATCH.M; if (!M) return; clearTimeout(M.timer); const res = { gf: M.gf, ga: M.ga, goals: M.goals, assists: M.assists, played: true, bonus: M.bonus - M.miss * .15, selfish: (M.selfish || 0) >= 2, tab: M.tab }; const cb = M.cb; MATCH.M = null; overlay().innerHTML = ""; UI.modalOpen = false; cb(res); },

  render(){
    const M = MATCH.M; if (!M) return; const m = M.m; const w = M.wait;
    overlay().innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Match"><div class="modal wide"><div class="scene">${ART.scene("stade")}</div><div class="modal-body mt">
      <div class="ev-kind"><span class="k hist">${m.big || m.final ? "Grand match" : "Match"}</span><span class="label">${esc(m.title)}</span></div>
      <div class="mt-score"><span class="team">${esc(M.me)}</span><b class="num">${M.gf} – ${M.ga}</b><span class="team">${esc(m.opp)}</span></div>
      <div class="mt-clock"><span class="num">${M.done ? "Terminé" : M.min + "’"}</span><span>Vous : ${M.goals} but${M.goals > 1 ? "s" : ""}, ${M.assists} passe${M.assists > 1 ? "s" : ""} décisive${M.assists > 1 ? "s" : ""}</span></div>
      <div class="mt-feed" id="mt-feed">${M.lines.map(l => `<div class="mt-line ${l.cls}"><span class="num">${l.min}’</span><span>${esc(l.txt)}</span></div>`).join("")}</div>
      ${w ? `<div class="mt-choice"><span class="label">À vous de jouer</span><div class="mt-opts">${w.mo.opts.map((o, i) => `<button class="btn ${i === 0 ? "primary" : ""}" data-mo="${i}">${esc(o.label)}</button>`).join("")}</div></div>` : ""}
      <div class="row">${M.done ? `<button class="btn primary" id="mt-end">Continuer</button>` : w ? "" : `<button class="btn ghost" id="mt-fast">${M.fast ? "Vitesse normale" : "Accélérer jusqu’à la prochaine action"}</button>`}</div>
    </div></div></div>`;
    const f = $("#mt-feed"); if (f) f.scrollTop = f.scrollHeight;
    $$("[data-mo]").forEach(b => b.onclick = () => MATCH.choose(+b.dataset.mo));
    const e = $("#mt-end"); if (e) e.onclick = () => MATCH.finish();
    const fb = $("#mt-fast"); if (fb) fb.onclick = () => { M.fast = !M.fast; MATCH.render(); MATCH.run(); };
  }
};
</script>
<script>
"use strict";
/* =====================================================================
   SON — musique d’ambiance et bruitages entièrement synthétisés (Web Audio).
   Aucune musique existante : chaque thème est engendré à partir d’une gamme,
   d’un tempo et d’un style décrits dans les données du personnage.
   ===================================================================== */
const AUDIO = {
  ctx: null, music: null, fx: null, timer: null, step: 0, next: 0, spec: null, phrase: null,
  musicOn: STORE.getSetting("music", true), sfxOn: STORE.getSetting("sfx", true),

  ensure(){
    if (AUDIO.ctx) { if (AUDIO.ctx.state === "suspended") AUDIO.ctx.resume().catch(() => {}); return true; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      AUDIO.ctx = new AC();
      AUDIO.music = AUDIO.ctx.createGain(); AUDIO.music.gain.value = AUDIO.musicOn ? .5 : 0; AUDIO.music.connect(AUDIO.ctx.destination);
      AUDIO.fx = AUDIO.ctx.createGain(); AUDIO.fx.gain.value = AUDIO.sfxOn ? .6 : 0; AUDIO.fx.connect(AUDIO.ctx.destination);
      return true;
    } catch (e) { return false; }
  },
  setMusic(on){ AUDIO.musicOn = on; STORE.setSetting("music", on); if (AUDIO.ctx) AUDIO.music.gain.setTargetAtTime(on ? .5 : 0, AUDIO.ctx.currentTime, .2); if (on) AUDIO.theme(AUDIO.spec); },
  setSfx(on){ AUDIO.sfxOn = on; STORE.setSetting("sfx", on); if (AUDIO.ctx) AUDIO.fx.gain.setTargetAtTime(on ? .6 : 0, AUDIO.ctx.currentTime, .05); },

  tone(dest, { f = 440, f2 = null, t = 0, d = .2, type = "sine", g = .2, a = .005 }){
    const c = AUDIO.ctx, o = c.createOscillator(), v = c.createGain(); const t0 = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(g, t0 + a); v.gain.exponentialRampToValueAtTime(.0008, t0 + d);
    o.connect(v); v.connect(dest); o.start(t0); o.stop(t0 + d + .05);
  },
  noise(dest, { t = 0, d = .2, g = .2, freq = 1000, q = .7, type = "lowpass", a = .003 }){
    const c = AUDIO.ctx; const len = Math.max(1, Math.floor(c.sampleRate * d)); const buf = c.createBuffer(1, len, c.sampleRate); const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    v.gain.setValueAtTime(0, t0); v.gain.linearRampToValueAtTime(g, t0 + a); v.gain.exponentialRampToValueAtTime(.0008, t0 + d);
    src.connect(fl); fl.connect(v); v.connect(dest); src.start(t0);
  },

  /* Bruitages */
  sfx(name){
    if (!AUDIO.sfxOn || !AUDIO.ensure()) return; const d = AUDIO.fx, T = o => AUDIO.tone(d, o), Nz = o => AUDIO.noise(d, o);
    try {
      switch (name) {
        case "click": T({ f: 720, f2: 520, d: .05, g: .12, type: "triangle" }); break;
        case "paper": Nz({ d: .18, g: .12, freq: 3200, type: "highpass" }); Nz({ t: .09, d: .12, g: .08, freq: 2400, type: "bandpass" }); break;
        case "notify": T({ f: 660, d: .16, g: .14 }); T({ f: 990, t: .12, d: .26, g: .12 }); break;
        case "event": T({ f: 392, d: .5, g: .12, type: "triangle" }); T({ f: 587, t: .18, d: .6, g: .1, type: "triangle" }); Nz({ d: .25, g: .05, freq: 1800, type: "bandpass" }); break;
        case "cannon": Nz({ d: .9, g: .5, freq: 320 }); T({ f: 90, f2: 32, d: .7, g: .5 }); Nz({ t: .28, d: .7, g: .22, freq: 220 }); T({ f: 70, f2: 30, t: .28, d: .6, g: .25 }); break;
        case "crowd": for (let i = 0; i < 6; i++) Nz({ t: i * .12, d: 1.1, g: .07, freq: 700 + Math.random() * 900, q: 1.4, type: "bandpass", a: .25 }); break;
        case "drum": [0, .11, .22, .4].forEach((t, i) => Nz({ t, d: .09, g: i === 3 ? .28 : .16, freq: 1900, q: 1.2, type: "bandpass" })); break;
        case "victory": [0, 4, 7, 12].forEach((n, i) => T({ f: 293.66 * Math.pow(2, n / 12), t: i * .14, d: .5, g: .16, type: "triangle" })); break;
        case "defeat": [7, 3, 0, -5].forEach((n, i) => T({ f: 220 * Math.pow(2, n / 12), t: i * .22, d: .7, g: .14, type: "triangle" })); break;
        case "error": T({ f: 150, d: .16, g: .14, type: "square" }); break;
        case "whistle": T({ f: 2300, d: .22, g: .1, type: "square" }); T({ f: 2500, t: .02, d: .22, g: .06, type: "square" }); T({ f: 2300, t: .34, d: .5, g: .1, type: "square" }); break;
        case "goal": for (let i = 0; i < 8; i++) Nz({ t: i * .08, d: 1.6, g: .09, freq: 600 + Math.random() * 1200, q: 1.2, type: "bandpass", a: .12 }); T({ f: 392, d: .25, g: .1, type: "triangle" }); T({ f: 523, t: .12, d: .25, g: .1, type: "triangle" }); T({ f: 659, t: .24, d: .5, g: .12, type: "triangle" }); break;
        case "death": T({ f: 110, d: 2.4, g: .2, type: "triangle" }); T({ f: 130.8, t: .05, d: 2.4, g: .12 }); Nz({ d: 1.6, g: .05, freq: 300 }); break;
      }
