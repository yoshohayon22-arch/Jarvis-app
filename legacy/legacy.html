<title>Legacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout : une "salle de commandement" en trois colonnes (vie privée · tableau de bord · relations),
   qui se replie en onglets sur téléphone. Chaque personnage repeint les jetons via une classe de thème. */
:root{
  --bg:#0f1316; --bg2:#151b1f; --panel:#1a2125; --panel2:#222b30;
  --ink:#eee6d4; --muted:#a9a292; --faint:#746e61; --line:rgba(238,230,212,.13);
  --accent:#c9a24a; --accent-ink:#1b1507; --accent2:#9b2f35;
  --good:#86b06f; --warn:#d8aa46; --bad:#d0583f;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:6px;
  color-scheme:dark;
}
/* Thème Empire : vert impérial, or des abeilles, cramoisi des tentures */
.theme-empire{
  --bg:#0c1611; --bg2:#112017; --panel:#15261d; --panel2:#1b3025;
  --ink:#f0e8d5; --muted:#b0a88f; --faint:#7a7461; --line:rgba(207,165,73,.2);
  --accent:#d2a74b; --accent-ink:#1c1505; --accent2:#9a2633;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:.04em;text-wrap:balance;margin:0}
.ui{font-family:var(--f-ui)}
.label{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px}
.btn{font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.86rem;
  border:1px solid var(--line);background:var(--panel2);padding:.6em 1em;border-radius:var(--r);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{font-size:.74rem;padding:.45em .7em}

/* ---------- Écran titre ---------- */
.title-hero{display:grid;gap:10px;padding-block:28px 18px;text-align:left}
.logo{font-family:var(--f-display);font-size:clamp(3rem,9vw,6.4rem);line-height:.9;letter-spacing:.18em;font-weight:700;
  background:linear-gradient(180deg,#f3e3b0,#b88d36 70%,#7d5a1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:1.15rem;max-width:60ch;color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.mode{font-family:var(--f-ui);border:1px solid var(--line);border-radius:99px;padding:.4em 1em;background:transparent;font-size:.9rem}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode .soon{font-size:.72rem;opacity:.7;margin-left:.4em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card-char{position:relative;text-align:left;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);padding:0;display:grid;grid-template-rows:auto 1fr}
.card-char .art{height:170px;display:grid;place-items:center;background:var(--art,#223)}
.card-char .art svg{height:150px;width:auto}
.card-char .body{padding:12px 14px 14px;display:grid;gap:4px}
.card-char h3{font-size:1.1rem}
.card-char .role{font-size:.92rem;color:var(--muted)}
.card-char.locked{opacity:.55;cursor:default}
.card-char:not(.locked):hover{border-color:var(--accent);transform:translateY(-2px)}
.card-char{transition:transform .2s,border-color .2s}
.badge{position:absolute;top:10px;right:10px;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:.25em .6em;border-radius:99px}
.title-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.disclaimer{margin-top:26px;font-size:.88rem;color:var(--faint);max-width:75ch}

/* ---------- Écran de départ ---------- */
.setup{display:grid;gap:22px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start;padding-block:12px}
.setup .portrait-lg svg{width:100%;height:auto;max-width:320px}
.starts{display:grid;gap:12px}
.start{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;text-align:left;display:grid;gap:6px}
.start:hover,.start[aria-pressed="true"]{border-color:var(--accent)}
.start[aria-pressed="true"]{background:var(--panel2)}
.start .yr{font-family:var(--f-display);font-size:1.5rem;color:var(--accent)}
.start h3{font-size:1.05rem}
.slot-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-pick select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.45em .6em;color:var(--ink);font-family:var(--f-ui)}
@media (max-width:760px){.setup{grid-template-columns:1fr}.setup .portrait-lg{max-width:220px}}

/* ---------- Jeu ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who h1{font-size:1.15rem;white-space:nowrap}
.who .short,.menu-btns .short{display:none}
.who .rank{font-family:var(--f-ui);font-size:.86rem;color:var(--muted)}
.clock{display:flex;align-items:baseline;gap:10px;margin-left:auto}
.clock .date{font-family:var(--f-display);font-size:1.2rem;color:var(--accent);white-space:nowrap}
.clock .age{font-family:var(--f-ui);color:var(--muted);font-size:.9rem;white-space:nowrap}
.speed{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.speed button{background:transparent;border:0;border-right:1px solid var(--line);font-family:var(--f-ui);font-weight:600;padding:.45em .75em;min-width:44px}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.menu-btns{display:flex;gap:6px}
.tick-bar{height:2px;background:var(--line);margin-top:8px;max-width:1320px;margin-inline:auto}
.tick-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}

.game{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:16px;padding-block:16px 40px;max-width:1320px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.scene{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1200/330;max-width:100%;background:#000}
.scene svg{display:block;width:100%;height:100%}
.scene .cap{position:absolute;left:14px;bottom:10px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.scene .cap .place{font-family:var(--f-display);font-size:1.05rem}
.scene .cap .status{font-family:var(--f-ui);font-size:.84rem;background:rgba(0,0,0,.45);padding:.2em .6em;border-radius:99px}

.portrait{display:grid;place-items:center}
.portrait svg{width:100%;max-width:230px;height:auto}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.gauge{display:grid;gap:4px;min-width:0}
.gauge .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gauge .name{font-family:var(--f-ui);font-size:.92rem;font-weight:500}
.gauge .val{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.gauge .trend{font-size:.78rem;margin-left:4px}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)}
.bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .35s ease,background .35s}
.bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(0,0,0,.35) calc(25% - 1px) 25%)}
.gauge .hint{font-size:.78rem;color:var(--faint);font-family:var(--f-ui)}
.lvl-good{background:var(--good)} .lvl-warn{background:var(--warn)} .lvl-bad{background:var(--bad)}
.vie .gauges{grid-template-columns:1fr}
.facts{display:grid;gap:6px;font-family:var(--f-ui);font-size:.92rem;margin-top:12px}
.facts div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.facts dt{color:var(--muted)}
.cond-chip{display:inline-block;font-family:var(--f-ui);font-size:.78rem;padding:.15em .55em;border-radius:99px;background:rgba(208,88,63,.18);color:#f0a390;margin:2px 4px 0 0}

.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.act{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;display:grid;gap:2px}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-family:var(--f-ui);font-weight:600;font-size:.95rem}
.act span{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.act em{font-style:normal;font-family:var(--f-ui);font-size:.76rem;color:var(--warn)}

.rels{display:grid;gap:8px}
.rel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.rel:first-child{border-top:0}
.rel .n{font-weight:600;font-size:.96rem;min-width:0;overflow-wrap:anywhere}
.rel .ro{grid-column:1/-1;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.rel .bar2{grid-column:1/-1;position:relative;height:6px;background:rgba(255,255,255,.07);border-radius:99px}
.rel .bar2::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.rel .bar2 i{position:absolute;top:0;bottom:0;border-radius:99px;transition:all .35s}
.rel.dead{opacity:.45}
.chip{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.15em .55em;border-radius:99px;white-space:nowrap;align-self:center}
.chip.allie{background:rgba(134,176,111,.2);color:#b6d9a3}
.chip.neutre{background:rgba(238,230,212,.1);color:var(--muted)}
.chip.rival{background:rgba(216,170,70,.18);color:#ecc977}
.chip.ennemi{background:rgba(208,88,63,.22);color:#f0a390}
.chip.mort{background:rgba(0,0,0,.3);color:var(--faint)}
.rel-detail{font-size:.9rem;color:var(--muted);grid-column:1/-1;padding-top:4px}

.log{display:grid;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.log-item{display:grid;gap:1px;font-size:.92rem;border-left:2px solid var(--line);padding-left:10px}
.log-item .d{font-family:var(--f-ui);font-size:.76rem;color:var(--faint);letter-spacing:.05em}
.log-item.good{border-left-color:var(--good)} .log-item.bad{border-left-color:var(--bad)} .log-item.key{border-left-color:var(--accent)}

.ai-status{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn);animation:pulse 1.2s infinite} .dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

.tabs{display:none}
@media (max-width:1100px){
  .game{grid-template-columns:260px minmax(0,1fr)}
  .col-right{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .game{grid-template-columns:minmax(0,1fr);padding-bottom:90px}
  .col-right{grid-template-columns:1fr}
  .gauges{grid-template-columns:1fr}
  .game[data-tab] .col{display:none}
  .game[data-tab="empire"] .col-mid,.game[data-tab="vie"] .col-left,.game[data-tab="monde"] .col-right{display:grid}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);
    padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:6px}
  .tabs button{flex:1;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:.55em .3em;font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
  .tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .topbar{padding-top:8px;padding-bottom:8px}
  .topbar-in{gap:8px 10px}
  .who .full,.who .rank,.menu-btns .full{display:none} .who .short,.menu-btns .short{display:inline}
  .menu-btns{gap:4px}
  .who h1{font-size:1.05rem}
  .clock{margin-left:auto}
  .clock .date{font-size:1.05rem}
  .menu-btns{margin-left:auto}
  .menu-btns .btn{padding:.45em .6em;font-size:.7rem}
  .speed button{min-width:40px;padding:.4em .55em}
  .scene{aspect-ratio:1200/420}
}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,6,6,.78);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .35s ease}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.modal .scene{border-radius:0;border:0;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px 20px;display:grid;gap:12px}
.ev-kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-kind .k{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:.2em .6em;border-radius:99px;border:1px solid var(--line)}
.ev-kind .k.hist{border-color:var(--accent);color:var(--accent)}
.modal h2{font-size:1.45rem;color:var(--ink)}
.ev-text{font-size:1.06rem;max-width:68ch}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{font-family:var(--f-ui);font-size:.82rem;background:var(--panel2);border:1px solid var(--line);padding:.2em .6em;border-radius:99px}
.choices{display:grid;gap:8px;margin-top:4px}
.choice{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px 14px;font-size:1rem;display:grid;gap:2px}
.choice:hover{border-color:var(--accent);background:color-mix(in srgb,var(--panel2) 80%,var(--accent))}
.choice small{font-family:var(--f-ui);color:var(--muted);font-size:.8rem}
.outcome{display:grid;gap:10px}
.verdict{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.1em}
.verdict.win{color:var(--good)} .verdict.loss{color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.deltas span{font-family:var(--f-ui);font-size:.86rem;padding:.2em .6em;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.deltas .p{color:#b6d9a3} .deltas .m{color:#f0a390}
.realbox{border-left:2px solid var(--accent);padding:6px 0 6px 12px;font-size:.95rem;color:var(--muted)}
.realbox b{color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.loading{display:grid;gap:10px;justify-items:start}
.quill{width:42px;height:42px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
textarea.json{width:100%;min-height:180px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);font-family:ui-monospace,Menlo,monospace;font-size:.8rem;padding:8px}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.slot .meta{min-width:0}
.slot .meta b{font-family:var(--f-ui);font-weight:600}
.slot .meta div{font-size:.86rem;color:var(--muted);font-family:var(--f-ui)}
.slot .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);font-family:var(--f-ui);font-weight:600;padding:.6em 1.1em;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--f-ui);border-top:1px solid var(--line);padding-top:10px}
.setting select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:.4em .5em;font-family:var(--f-ui)}

/* ---------- Fin de partie ---------- */
.end-hero{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px;align-items:center;padding-block:24px 10px}
.end-hero .portrait svg{max-width:240px;filter:grayscale(.35)}
.legend-title{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.6rem);line-height:1;color:var(--accent);letter-spacing:.06em}
.epitaph{font-size:1.12rem;max-width:62ch}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.vs b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink)}
.vs small{font-family:var(--f-ui);color:var(--muted)}
.frise{display:grid;gap:0;margin-top:10px}
.frise-h{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.frise-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.frise-row .when{font-family:var(--f-ui);color:var(--accent);font-weight:600}
.frise-row h3{font-size:1rem;margin-bottom:4px}
.frise-row .you,.frise-row .real{font-size:.95rem;min-width:0}
.frise-row .tag{display:inline-block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.15em .5em;border-radius:99px;margin-bottom:4px}
.tag.same{background:rgba(134,176,111,.18);color:#b6d9a3}
.tag.diff{background:rgba(208,88,63,.2);color:#f0a390}
.tag.none{background:rgba(238,230,212,.08);color:var(--muted)}
.anec{font-size:.88rem;color:var(--faint);font-style:italic;margin-top:4px}
@media (max-width:760px){
  .end-hero{grid-template-columns:1fr}
  .end-hero .portrait svg{max-width:170px}
  .frise-h{display:none}
  .frise-row{grid-template-columns:1fr;gap:6px}

  /* Repères réels par année : donnés à Claude pour que les événements restent cohérents avec l’époque */
  eraNotes: {
    1796: "Directoire. Première coalition (Autriche, Grande-Bretagne, Piémont). Campagne d’Italie : Lodi, Arcole. Mariage avec Joséphine.",
    1797: "Rivoli, traité de Campoformio avec l’Autriche. Bonaparte rentre à Paris auréolé de gloire ; coup d’État du 18 fructidor.",
    1798: "Expédition d’Égypte, bataille des Pyramides, destruction de la flotte à Aboukir par Nelson. Loi Jourdan sur la conscription.",
    1799: "Siège d’Acre manqué, peste à Jaffa. Retour en France, coup d’État du 18 Brumaire, Consulat. Deuxième coalition.",
    1800: "Création de la Banque de France et des préfets. Marengo. Attentat de la rue Saint-Nicaise. Hohenlinden (Moreau).",
    1801: "Paix de Lunéville avec l’Autriche. Concordat avec Pie VII. Assassinat du tsar Paul Ier, avènement d’Alexandre Ier.",
    1802: "Paix d’Amiens avec l’Angleterre. Légion d’honneur. Consulat à vie. Création des lycées. Expédition de Saint-Domingue.",
    1803: "Rupture de la paix d’Amiens. Vente de la Louisiane aux États-Unis. Camp de Boulogne. Exil de Madame de Staël.",
    1804: "Complot de Cadoudal. Exécution du duc d’Enghien. Code civil. Proclamation de l’Empire, maréchalat, Sacre.",
    1805: "Troisième coalition. Ulm, Trafalgar, Austerlitz, traité de Presbourg.",
    1806: "Confédération du Rhin, fin du Saint-Empire. Iéna et Auerstaedt. Blocus continental (décret de Berlin).",
    1807: "Eylau, Friedland, traités de Tilsit avec Alexandre. Création du duché de Varsovie.",
    1808: "Soulèvement de Madrid (Dos de Mayo), Joseph roi d’Espagne, capitulation de Bailén. Entrevue d’Erfurt.",
    1809: "Disgrâce de Talleyrand. Aspern-Essling (mort de Lannes), Wagram. Annexion des États pontificaux, Pie VII arrêté. Divorce.",
    1810: "Mariage avec Marie-Louise. Annexion de la Hollande. Masséna arrêté devant Torres Vedras par Wellington.",
    1811: "Naissance du roi de Rome. Crise économique et disette. L’Empire atteint 130 départements.",
    1812: "Campagne de Russie : la Moskova, incendie de Moscou, retraite, Bérézina. Conspiration Malet à Paris.",
    1813: "Sixième coalition. Lützen, Bautzen, Dresde, puis défaite de Leipzig. Wellington victorieux à Vitoria.",
    1814: "Campagne de France. Paris capitule. Abdication à Fontainebleau, exil à l’île d’Elbe. Restauration de Louis XVIII. Congrès de Vienne.",
    1815: "Cent-Jours. Waterloo. Seconde abdication, reddition aux Anglais, départ pour Sainte-Hélène.",
    1816: "Sainte-Hélène : Longwood, conflit avec le gouverneur Hudson Lowe, Las Cases recueille le Mémorial.",
    1817: "Sainte-Hélène : premiers troubles hépatiques et digestifs signalés.",
    1818: "Sainte-Hélène : isolement croissant, départ du médecin O’Meara.",
    1819: "Sainte-Hélène : arrivée du médecin Antommarchi ; Napoléon jardine à Longwood.",
    1820: "Sainte-Hélène : santé déclinante.",
    1821: "Mort à Longwood le 5 mai."
  },

  events: [
    { id: "italie", date: "1796-04-10", until: "1796-07-01", title: "Franchir les Alpes ligures", place: "Savone, Riviera ligure", scene: "italie", people: ["berthier", "murat"],
      text: "L’armée d’Italie piétine depuis des mois sur la côte. Face à vous, deux armées alliées : les Piémontais de Colli et les Autrichiens de Beaulieu. Vos soldats n’ont ni souliers ni solde, mais ils sont aguerris. Le Directoire vous demande surtout de nourrir l’armée sur le pays… et d’envoyer de l’argent à Paris.",
      real: "Bonaparte frappe à la jonction des deux armées : Montenotte (12 avril), Millesimo, Mondovi. Le Piémont signe l’armistice de Cherasco le 28 avril 1796.",
      anecdote: "Sa proclamation à l’armée promettait « les plaines les plus fertiles du monde » ; son authenticité exacte est discutée, elle fut probablement réécrite plus tard à Sainte-Hélène.",
      choices: [
        { t: "Frapper vite à la jonction des Piémontais et des Autrichiens", hist: true, res: "Vous séparez les deux armées et battez les Piémontais coup sur coup.",
          battle: { name: "Montenotte", base: .8, need: 25, win: { s: { moral: 25, popularite: 18, tresor: 35, loyaute: 10 }, r: { berthier: 8 }, txt: "Le Piémont demande l’armistice. Les contributions de guerre remplissent enfin la caisse." }, loss: { s: { moral: -20, popularite: -10, armee: -8 }, txt: "Les deux armées alliées se rejoignent. Vous reculez vers Savone." } } },
        { t: "Attendre les renforts promis par le Directoire", res: "Les renforts n’arrivent qu’au compte-gouttes. L’armée s’impatiente.", fx: { s: { moral: -12, popularite: -6, coalition: 5, armee: 6 } } },
        { t: "Laisser les soldats se nourrir sur le pays sans attaquer", res: "Le pillage nourrit l’armée mais soulève les villages.", fx: { s: { moral: 8, tresor: 10, popularite: -4, loyaute: -6 } } }
      ] },
    { id: "arcole", date: "1796-11-15", until: "1797-02-01", cond: s => !s.flags.noItaly, title: "Le pont d’Arcole", place: "Marais de l’Adige, près de Vérone", scene: "bataille", people: ["murat", "berthier"],
      text: "Les Autrichiens d’Alvinczy marchent pour délivrer Mantoue. Pour les prendre à revers, il faut franchir l’Alpone sur un étroit pont de bois balayé par la mitraille. Deux assauts ont échoué. Les grenadiers hésitent ; vos officiers vous regardent.",
      real: "Bonaparte saisit un drapeau et s’élance sur le pont. L’assaut échoue, il tombe dans un fossé marécageux et manque d’être pris. La bataille est gagnée le troisième jour par la manœuvre.",
      anecdote: "Son aide de camp Jean-Baptiste Muiron meurt en le couvrant de son corps. Bonaparte rentrera d’Égypte trois ans plus tard à bord d’une frégate baptisée La Muiron.",
      choices: [
        { t: "Saisir le drapeau et mener soi-même l’assaut sur le pont", hist: true, res: "Vous vous jetez en avant sous la mitraille, drapeau en main.",

          battle: { name: "Arcole", base: .66, need: 20, win: { s: { moral: 10, popularite: 10, loyaute: 8 }, txt: "Au troisième jour, la manœuvre par Albaredo fait céder Alvinczy. La légende du pont est née." }, loss: { s: { moral: -15, armee: -6 }, txt: "Alvinczy tient l’Alpone. Il faudra tout recommencer devant Rivoli." } } },
        { t: "Contourner par le gué d’Albaredo, sans risquer votre vie", res: "Plus lente, la manœuvre évite le massacre sur le pont.",
          battle: { name: "Arcole", base: .58, need: 20, win: { s: { moral: 6, popularite: 5 }, txt: "Les Autrichiens se retirent. Une victoire sans légende." }, loss: { s: { moral: -12, armee: -6 }, txt: "La manœuvre traîne ; Alvinczy se retire en bon ordre." } } },
        { t: "Lever le siège de Mantoue et se replier", res: "Prudence jugée timorée à Paris.", fx: { s: { moral: -15, popularite: -12, coalition: 10 }, f: { noItaly: true } } }
      ] },
    { id: "campoformio", date: "1797-10-01", until: "1798-02-01", cond: s => s.rank === "general" && !s.flags.noItaly, title: "Campoformio", place: "Villa de Passariano, Frioul", scene: "italie", people: ["berthier", "talleyrand"],
      text: "Après Rivoli et la chute de Mantoue, vous êtes à moins de cent kilomètres de Vienne. Vous négociez seul avec le comte Cobenzl, sans attendre les instructions du Directoire. L’Autriche accepterait de céder la Belgique et la rive gauche du Rhin, à condition de recevoir Venise, que vous venez d’occuper.",
      real: "Le traité de Campoformio est signé le 18 octobre 1797 : l’Autriche reconnaît la République cisalpine et cède la Belgique ; la République de Venise, millénaire, est livrée à l’Autriche. Bonaparte rentre à Paris en pacificateur.",
      anecdote: "Lors des négociations, il aurait brisé un service à thé offert par Catherine II pour impressionner Cobenzl ; l’épisode, rapporté plus tard, est peut-être embelli.",
      choices: [
        { t: "Signer la paix en livrant Venise à l’Autriche", hist: true, res: "La paix est signée. Paris vous acclame ; les patriotes vénitiens se sentent trahis.", fx: { s: { popularite: 15, coalition: -20, departements: 4, tresor: 15 }, r: { talleyrand: 10 }, f: { atWar: false }, c: { treaties: 1 } } },
        { t: "Marcher sur Vienne pour imposer une paix totale", res: "L’armée reprend la route du Semmering.",
          battle: { name: "Marche sur Vienne", base: .5, need: 45, win: { s: { popularite: 20, coalition: -25, departements: 6, tresor: 40 }, c: { treaties: 1 }, f: { atWar: false }, txt: "Vienne capitule. L’Autriche signe une paix bien plus dure." }, loss: { s: { armee: -12, moral: -15, popularite: -10, coalition: 8 }, txt: "L’armée s’épuise dans les Alpes styriennes ; il faut traiter en position de faiblesse." } } },
        { t: "Refuser de sacrifier Venise et attendre Paris", res: "Les négociations traînent ; le Directoire impose ses propres conditions.", fx: { s: { popularite: -4, coalition: -8 }, r: { talleyrand: -4 } } }
      ] },
    { id: "egypte", date: "1798-04-01", until: "1798-08-01", cond: s => s.rank === "general" || s.rank === "general2", title: "L’Angleterre ou l’Orient ?", place: "Paris, rue de la Victoire", scene: "paris", people: ["talleyrand", "josephine"],
      text: "Rentré d’Italie couvert de gloire après Campoformio, vous inquiétez le Directoire. On vous a confié l’« armée d’Angleterre », mais votre inspection des côtes de la Manche vous a convaincu qu’un débarquement est irréalisable sans maîtrise des mers. Talleyrand défend un autre projet : frapper la route des Indes en Égypte.",
      real: "Bonaparte part de Toulon le 19 mai 1798 avec environ 35 000 hommes et une commission de 167 savants. Il prend Malte, débarque à Alexandrie et bat les Mamelouks aux Pyramides le 21 juillet.",
      anecdote: "La pierre de Rosette est découverte en 1799 par un officier de l’expédition. Champollion s’en servira pour déchiffrer les hiéroglyphes en 1822.",

        { t: "Tenter malgré tout le débarquement en Angleterre", res: "Vous rassemblez les péniches à Boulogne et dans l’estuaire de l’Escaut.",
          battle: { name: "Débarquement en Angleterre", base: .18, need: 40, risk: .04, win: { s: { popularite: 30, coalition: -30, departements: 0, tresor: 80 }, f: { englandInvaded: true }, txt: "Une brume providentielle, une flotte anglaise dispersée : vos troupes prennent pied dans le Kent. Londres négocie." }, loss: { s: { armee: -25, moral: -25, popularite: -15 }, f: { englandFailed: true }, txt: "La Royal Navy coule la moitié des transports. Le désastre ruine votre crédit." } } },
        { t: "Rester à Paris pour peser sur la politique", res: "Vous fréquentez les salons et l’Institut, en attendant votre heure.",
          fx: { s: { popularite: -4, complot: 8, stress: 6 }, r: { josephine: 6, talleyrand: 4 }, f: { stayedParis: true } } }
      ] },
    { id: "acre", date: "1799-03-20", until: "1799-06-01", cond: s => s.flags.egypt && !s.flags.leftEgypt, title: "Le siège de Saint-Jean-d’Acre", place: "Saint-Jean-d’Acre, Syrie ottomane", scene: "desert", people: ["berthier"],
      text: "Après la destruction de votre flotte par Nelson à Aboukir, vous êtes enfermé en Orient. Vous avez marché vers la Syrie pour devancer l’offensive ottomane. Jaffa est prise, mais la peste s’est déclarée dans l’armée. Devant Acre, le pacha Djezzar tient bon, ravitaillé par les navires anglais de Sidney Smith.",
      real: "Après deux mois de siège et plusieurs assauts sanglants, Bonaparte lève le siège le 20 mai 1799 et ramène une armée décimée par la peste en Égypte.",

          battle: { name: "Assaut sur Acre", base: .25, need: 12, win: { s: { moral: 20, popularite: 15, coalition: -5 }, f: { acreTaken: true }, txt: "La brèche cède enfin. La route de Damas, peut-être de Constantinople, est ouverte." }, loss: { s: { moral: -8, armee: -3 }, txt: "Vous levez le siège et ramenez l’armée en Égypte à travers le désert." } } },
        { t: "Lever le siège tout de suite pour sauver l’armée", res: "Vous repartez vers l’Égypte avant que la peste n’achève le corps expéditionnaire.", fx: { s: { moral: -6, armee: -2, popularite: -4, fatigue: 6 } } }
      ] },
    { id: "retour", date: "1799-08-20", until: "1800-06-01", cond: s => s.flags.egypt && !s.flags.leftEgypt, title: "Quitter l’Égypte ?", place: "Alexandrie", scene: "mer", people: ["berthier"],
      text: "Des journaux européens, transmis par les Anglais eux-mêmes, vous apprennent que l’Italie est perdue et que le Directoire vacille face à la deuxième coalition. Deux frégates sont prêtes. Partir, c’est laisser l’armée à Kléber ; rester, c’est peut-être manquer le moment où la France cherche un homme.",
      real: "Bonaparte s’embarque en secret le 23 août 1799 avec quelques fidèles, échappe aux croisières anglaises et débarque à Fréjus le 9 octobre. Kléber, furieux, hérite d’une armée sans flotte.",
      anecdote: "Kléber est assassiné au Caire en juin 1800 ; ses successeurs capitulent en 1801.",
      choices: [
