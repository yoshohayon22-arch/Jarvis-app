<script>
"use strict";
/* =====================================================================
   NAPOLÉON — organisation en cinq fenêtres : Vue générale, Armée, Presse,
   Finances, Correspondance. Ordres aux corps, curseurs à effet direct,
   presse d’époque, contacts et courriers. Toujours en données.
   ===================================================================== */
(function(){
const N = CHARACTERS.napoleon;
const P = s => GAME.power(s);
const M = v => `${Math.round(v)} M F`;
const sg = (v, d = 1) => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(d).replace(".", ",")}`;
const REG = id => N.map.regions.find(r => r.id === id);
const once = (s, id) => s.wk[id] === s.week ? "Déjà fait cette semaine" : false;
const pay = (s, n) => s.stats.tresor < n ? `Il faut ${M(n)}` : false;

Object.assign(N.defaultPol, { recrut: 0, marine: 1, cour: 1 });

/* ---------------- Jauges composées et alertes ---------------- */
N.stability = s => clamp(Math.round(100 - s.stats.complot * .6 - Math.max(0, 50 - s.stats.popularite) * .5 - Math.max(0, 50 - s.stats.loyaute) * .35 - (s.stats.tresor < 0 ? 10 : 0)), 0, 100);
N.opinionAbroad = s => { const ks = ["angleterre", "autriche", "russie", "prusse", "espagne", "allemagne", "italie"]; const avg = ks.reduce((t, k) => t + s.pays[k].rel, 0) / ks.length; return clamp(Math.round(50 + avg * .45 - (s.stats.coalition - 50) * .25), 0, 100); };
N.mainGauges = s => [
  { label: "Popularité en France", v: s.stats.popularite }, { label: "Stabilité de l’Empire", v: N.stability(s) },
  { label: `Santé · ${GAME.age(s)} ans`, v: s.stats.sante }, { label: "Loyauté des maréchaux", v: s.stats.loyaute },
  { label: "Menace de coalition", v: s.stats.coalition, bad: "high" }
];
N.sideFacts = s => [["Territoire", `${Math.round(s.stats.departements)} dép.`], ["Risque de complot", Math.round(s.stats.complot)], ["Fatigue", Math.round(s.stats.fatigue)], ["Stress", Math.round(s.stats.stress)]];
N.corpsAlerts = (s, c) => { const a = []; if (c.supply < 35) a.push("Manque de vivres"); if (c.moral < 40) a.push("Moral bas"); const r = REG(c.loc); const near = [c.loc, ...(r ? r.adj : [])].find(k => s.pays[k] && s.pays[k].statut === "guerre" && s.pays[k].armee >= 30 && k !== "angleterre"); if (near && !c.dest) a.push(`Ennemi proche : ${N.regionName(near)}`); return a; };
N.alerts = s => {
  const b = N.budget(s); const out = { armee: [], finances: [], general: [] };
  for (const c of s.corps) for (const a of N.corpsAlerts(s, c)) out.armee.push(`${c.name} : ${a}`);
  if (P(s) >= 1) { if (s.stats.tresor < 0) out.finances.push("Le Trésor est vide : la faillite menace."); else if (b.solde < 0 && s.stats.tresor / -b.solde < 6) out.finances.push(`À ce rythme, le Trésor sera vide dans ${Math.max(1, Math.round(s.stats.tresor / -b.solde))} mois.`); if (s.dette > 400) out.finances.push("La dette dépasse 400 millions : les banquiers s’inquiètent."); }
  if (s.stats.complot >= 65) out.general.push("La police signale des conjurations sérieuses."); if (s.stats.sante < 35) out.general.push("Votre santé décline dangereusement.");
  return out;
};
/* « À venir » : ce que l’on sait déjà de l’avenir */
N.upcoming = s => {
  const out = [];
  for (const d of s.deferred) out.push({ d: d.date, t: d.title, k: "Conséquence attendue" });
  for (const c of s.corps) if (c.dest) out.push({ d: c.eta, t: `${c.name} arrive : ${N.regionName(c.dest)}${c.stance === "attaque" ? " (attaque à l’arrivée)" : ""}`, k: "Mouvement" });
  for (const w of N.works) { const pr = s.projects[w.id]; if (pr && pr.left > 0) out.push({ d: addDays(s.date, Math.round(pr.left / [.5, 1, 1.6][s.pol.travaux] * 7)), t: `Fin du chantier : ${w.label}`, k: "Grands travaux" }); }
  for (const q of (s.corrQueue || [])) out.push({ d: q.at, t: `Réponse attendue : ${GAME.relDef(s, q.id).name}`, k: "Courrier" });
  for (const [id, th] of Object.entries(s.corr || {})) for (const m of th) if (m.me && m.arrive && m.arrive > s.date) out.push({ d: m.arrive, t: `Votre lettre parvient à ${GAME.relDef(s, id).name}`, k: "Courrier" });
  if (s.flags.remarried && !s.flags.sonBorn && (s.family.spouse || s.family.spouseName)) out.push({ d: addDays(s.date, 120), t: "Une naissance est espérée à la cour", k: "Famille", approx: true });
  if (s.pol.espions) for (const r of N.rivals) { const v = s.rivals[r.id]; if (v.prog >= 60) out.push({ d: addDays(s.date, Math.round((100 - v.prog) * 1.2) + 7), t: `${r.name} : ${v.plan.charAt(0).toLowerCase() + v.plan.slice(1)}`, k: "Renseignement", approx: true }); }
  if (s.dette > 0) out.push({ d: addDays(s.date, 30), t: `Intérêts de la dette : ${(s.dette * .005).toFixed(1).replace(".", ",")} M F par mois`, k: "Finances", approx: true });
  return out.sort((a, b) => a.d.localeCompare(b.d)).slice(0, 12);
};

/* ---------------- Budget mensuel détaillé ---------------- */
N.budget = s => {
  const st = s.stats, p = s.pol, r = N.ranks[s.rank] || { income: 0 }, pw = P(s), L = s.laws;
  const rec = [], dep = [];
  if (pw === 0) { rec.push(["Pension et revenus de l’exil", s.rank === "prisonnier" ? .2 : .6]); dep.push(["Maison et domestiques", s.rank === "prisonnier" ? .2 : .5]); }
  else {
    const mult = (1 + (L.prefets ? .03 : 0) + (L.cadastre ? .04 : 0) + (L.banque ? .02 : 0)) * (s.eco / 100) * (pw >= 2 ? N.minister(s, "tresor") : 1);
    const vassaux = Object.values(s.pays).filter(x => x.statut === "vassal" || x.statut === "occupe").length;
    rec.push([pw >= 2 ? "Impôts directs" : "Caisse de l’armée", st.departements * .55 * (.7 + st.popularite / 200) * r.income * (p.impots / 100) * mult]);
    if (pw >= 2) { rec.push(["Droits indirects (droits réunis)", [0, 6, 11][p.droits]]); rec.push(["Douanes" + (p.blocus === 1 ? " et licences" : ""), [2, 5, 8][p.douanes] * (p.blocus === 2 ? .35 : p.blocus === 1 ? 1.4 : 1)]); }
    rec.push(["Tributs des pays vaincus", p.contrib * (pw >= 2 ? vassaux * 1.4 : vassaux * 3)]);
    dep.push(["Armée : solde et entretien", st.armee * (pw >= 2 ? .085 : .02) * (p.solde / 100)]);
    if (s.flags.atWar) dep.push(["Armée : dépenses de campagne", st.armee * (pw >= 2 ? .035 : .01)]);
    dep.push(["Armée : ravitaillement", st.armee * .012 * [.6, 1, 1.5][p.rav] * (pw >= 2 ? 1 : .3)]);
    if (p.recrut && pw >= 2) dep.push(["Contingents étrangers", [0, 3, 7][p.recrut]]);
    if (pw >= 2) {
      dep.push(["Marine", [0, 4, 9, 16][p.marine]]);
      const tr = N.works.filter(w => s.projects[w.id] && s.projects[w.id].left > 0).reduce((t, w) => t + w.cost / w.weeks * 4.35 * [.5, 1, 1.6][p.travaux], 0); if (tr) dep.push(["Grands travaux", tr]);
      dep.push([s.rank === "empereur" ? "Cour impériale" : "Maison du Premier consul", [1, 3, 6][p.cour] * (s.rank === "empereur" ? 1 : .5)]);
      dep.push(["Administration", st.departements * .045]);
      dep.push(["Police" + (p.espions ? " et espions" : ""), [0, 3, 7, 12][p.police] + (p.espions ? 4 : 0)]); dep.push(["Presse et propagande", [0, 2, 5, 9][p.propag]]);
      if (p.pain) dep.push(["Prix du pain", 3]); if (p.industrie) dep.push(["Aides à l’industrie", [0, 4, 8][p.industrie]]);
      if (s.dette > 0) dep.push(["Intérêts de la dette", s.dette * .005]);
    }
  }
  const R = rec.reduce((t, x) => t + x[1], 0), D = dep.reduce((t, x) => t + x[1], 0);
  return { rec, dep, R, D, solde: R - D };
};

/* ---------------- Compléments de simulation ---------------- */
const baseTick = N.tick;
N.tick = function(s, h){
  const out = baseTick.call(this, s, h) || []; const p = s.pol, pw = P(s);
  if (pw >= 2) {
    if (p.recrut) { const vas = Object.entries(s.pays).filter(([k, c]) => c.statut === "vassal" || c.statut === "allie"); if (vas.length) { s.depot += [0, 3, 6][p.recrut] * h.dt; for (const [k, c] of vas) c.rel = clamp(c.rel - [0, .25, .6][p.recrut] * h.dt, -100, 100); } }
    const a = s.pays.angleterre; if (a.statut === "guerre") a.pression = clamp((a.pression || 0) + [-.3, 0, .15, .35][p.marine] * h.dt, 0, 100);
    h.add("loyaute", [-.5, 0, .35][p.cour]); h.add("popularite", [.1, 0, -.15][p.cour]);
  }
  for (const c of s.corps) { if (c.stance === "repos" && !c.dest) { const st = N.map.status(s, c.loc); if (st !== "guerre") { c.moral = clamp(c.moral + 3 * h.dt, 0, 100); c.supply = clamp(c.supply + 4 * h.dt, 0, 100); } } }
  return out;
};
/* Rencontre : un corps qui a l’ordre d’attaquer et se trouve en pays ennemi engage le combat */
N.meet = s => { const c = s.corps.find(x => x.stance === "attaque" && !x.dest && s.pays[x.loc] && s.pays[x.loc].statut === "guerre" && s.pays[x.loc].armee >= 5); if (!c) return null; for (const x of s.corps) if (x.loc === c.loc && x.stance === "attaque") x.stance = "defense"; return N.offensive(s, c.loc); };
const baseEnemy = N.enemyMove;
N.enemyMove = s => { const e = baseEnemy(s); if (!e) return null; const there = s.corps.filter(c => c.loc === e.region && !c.dest); const b = e.choices[0].battle; if (there.some(c => c.stance === "defense")) { b.base = .66; e.text += " Vos corps en défense sur place ont eu le temps de se retrancher."; } else if (there.length && there.every(c => c.stance === "repos")) { b.base = .46; e.text += " Vos troupes au repos sont surprises dans leurs cantonnements."; } return e; };

/* ---------------- Ordres et réglages ---------------- */
N.orders = [
  { id: "marcher", label: "Marcher", hint: "Se rendre sur place et y stationner." }, { id: "attaquer", label: "Attaquer", hint: "Marcher à l’ennemi et livrer bataille à l’arrivée." },
  { id: "defendre", label: "Défendre", hint: "Se retrancher : avantage si l’ennemi attaque." }, { id: "reposer", label: "Se reposer", hint: "Refaire le moral et les vivres, en pays ami." }
];
N.stanceLabel = { marche: "En position", attaque: "Ordre d’attaque", defense: "En défense", repos: "Au repos" };
N.travel = (c, to) => c.loc === to ? 0 : (REG(to).sea || REG(c.loc).sea ? 6 : N.path(c.loc, to) * 2);
const baseAct = N.act;
N.act = (s, act, arg, val) => {
  const st = s.stats; const fx = o => GAME.applyFx(s, o); const corps = () => s.corps.find(c => c.id === arg);
  switch (act) {
    case "order": { const c = corps(); const [kind, to] = String(val).split("|"); if (!c) return {};
      const stance = { marcher: "marche", attaquer: "attaque", defendre: "defense", reposer: "repos" }[kind];
      if (kind === "attaquer" && !(s.pays[to] && s.pays[to].statut === "guerre")) return { msg: `${N.regionName(to)} n’est pas en guerre avec vous : il n’y a personne à attaquer.`, tone: "bad" };
      if (kind === "reposer" && s.pays[to] && s.pays[to].statut === "guerre") return { msg: "On ne se repose pas en pays ennemi.", tone: "bad" };
      if (to !== c.loc) { const why = N.canEnter(s, to); if (why) return { msg: why, tone: "bad" }; c.dest = to; c.eta = addDays(s.date, N.travel(c, to) * 7); } else { c.dest = null; c.eta = null; }
      c.stance = stance;
      if (kind === "attaquer" && to === c.loc) return { battle: N.offensive(s, to), sfx: "drum" };
      return { msg: `${c.name} : ${N.orders.find(o => o.id === kind).label.toLowerCase()}, ${N.regionName(to)}${c.dest ? ` (arrivée vers le ${frDate(c.eta)})` : ""}.`, sfx: "drum" }; }

  eraNotes: {
    2003: "Arrivée à Manchester United pour environ 19 M€ ; il hérite du numéro 7. Premier League dominée par Arsenal, Manchester United et Chelsea.", 2004: "Vainqueur de la Coupe d’Angleterre. Euro au Portugal : finale perdue 0-1 contre la Grèce. Arrivée de Rooney à Manchester.",
    2005: "Chelsea de Mourinho champion d’Angleterre. Messi émerge à Barcelone.", 2006: "Coupe du monde en Allemagne : Portugal quatrième ; polémique après l’expulsion de Rooney en quart de finale.",
    2007: "Champion d’Angleterre avec Manchester United, meilleur joueur de Premier League.", 2008: "Doublé championnat et Ligue des champions (finale à Moscou contre Chelsea), 42 buts sur la saison, premier Ballon d’or.",
    2009: "Finale de Ligue des champions perdue contre le Barça de Guardiola. Transfert record au Real Madrid pour 94 M€.", 2010: "Mourinho arrive au Real. Coupe du monde en Afrique du Sud : Portugal éliminé en huitièmes par l’Espagne. Twitter et Facebook explosent.",
    2011: "Coupe du Roi gagnée contre le Barça. 40 buts en Liga, record de l’époque.", 2012: "Real champion d’Espagne avec 100 points. Euro : Portugal demi-finaliste. Messi marque 91 buts dans l’année civile.",
    2013: "Ancelotti arrive au Real, Gareth Bale aussi. Deuxième Ballon d’or.", 2014: "La « Décima » à Lisbonne contre l’Atlético ; 17 buts en une Ligue des champions. Coupe du monde au Brésil : élimination au premier tour. Troisième Ballon d’or.",
    2015: "Meilleur buteur de l’histoire du Real Madrid. Le Barça de Messi, Suárez et Neymar gagne tout.", 2016: "Ligue des champions avec Zidane, puis l’Euro en France avec le Portugal. Quatrième Ballon d’or.",
    2017: "Doublé Liga et Ligue des champions. Cinquième Ballon d’or.", 2018: "Troisième Ligue des champions de suite, puis départ pour la Juventus (100 M€). Coupe du monde en Russie : triplé contre l’Espagne, élimination en huitièmes.",
    2019: "Champion d’Italie. Première Ligue des nations avec le Portugal.", 2020: "Pandémie de Covid-19 : stades vides, saisons interrompues. Deuxième titre de champion d’Italie.",
    2021: "Meilleur buteur de Serie A et de l’Euro. Retour à Manchester United en août. Record mondial de buts en sélection.", 2022: "Saison difficile à Manchester ; interview télévisée et rupture de contrat en novembre. Coupe du monde au Qatar : quart de finale. Signature à Al-Nassr fin décembre.",
    2023: "Première saison complète en Arabie saoudite ; Benzema, Neymar et d’autres stars suivent. Meilleur buteur mondial de l’année civile.", 2024: "Record de buts sur une saison de Saudi Pro League. Lancement de sa chaîne YouTube. 900e but officiel en septembre.",
    2025: "Deuxième Ligue des nations avec le Portugal, contre l’Espagne. Prolongation à Al-Nassr jusqu’en 2027.", 2026: "Coupe du monde en Amérique du Nord, la sixième à laquelle il peut participer."

  /* ---------------- Moments de carrière réels ---------------- */
  events: [
    { id: "numero7", date: "2003-08-14", until: "2003-09-10", cond: s => s.club === "manutd", title: "Le numéro 7", place: "Old Trafford, Manchester", scene: "vestiaire", people: ["ferguson", "mendes"],
      text: "Vous aviez demandé le 28, votre numéro au Sporting. Sir Alex Ferguson vous tend un autre maillot : le 7, celui de George Best, d’Éric Cantona et de David Beckham, parti cet été au Real Madrid. Dans deux jours, Bolton vient à Old Trafford.",
      real: "Il accepte le 7. Entré à l’heure de jeu contre Bolton le 16 août 2003, il enflamme le stade en trente minutes de dribbles et reçoit une ovation debout.", anecdote: "Le numéro deviendra une marque : « CR7 ».",
      choices: [{ t: "Prendre le 7 et sa légende", hist: true, res: "Le maillot pèse lourd, mais il vous va bien.", fx: { s: { popularite: 6, stress: 6, coach: 5 } } },
        { t: "Garder le 28, loin de la pression", res: "Vous commencez dans l’ombre des anciens.", fx: { s: { stress: -5, popularite: -2, coach: -4 }, f: { num28: true } } }] },
    { id: "euro2004", date: "2004-07-04", until: "2004-07-20", cond: s => !s.nat.retired && s.club, title: "Finale de l’Euro 2004", place: "Estádio da Luz, Lisbonne", scene: "stade", people: ["scolari"],
      text: "À 19 ans, vous jouez la finale d’un Euro, chez vous, devant tout un pays. En face, la Grèce, que personne n’attendait là et qui vous a déjà battus en match d’ouverture. Elle défend à dix et attend un coup de pied arrêté.",
      real: "Le Portugal s’incline 0-1 sur une tête de Charisteas à la 57e minute. Les images de ses larmes sur la pelouse font le tour du monde.", anecdote: "Il avait marqué son premier but en sélection lors du match d’ouverture, déjà contre la Grèce.",
      choices: [{ t: "Entrer sur la pelouse", hist: true, res: "Coup d’envoi à Lisbonne.", match: { comp: "tour", title: "Finale de l’Euro 2004", opp: "Grèce", T: 83, O: 82, final: true, trophy: "Euro 2004", win: { s: { popularite: 15 }, txt: "Le Portugal est champion d’Europe à domicile." }, loss: { s: { popularite: 2, stress: 10 }, txt: "Tout un pays pleure avec vous." } } }] },
    { id: "clin2006", date: "2006-07-08", until: "2006-08-10", cond: s => s.club === "manutd", title: "Après le clin d’œil", place: "Lisbonne", scene: "plateau", people: ["ferguson", "rooney", "mendes"],
      text: "En quart de finale de la Coupe du monde, votre coéquipier de club Wayne Rooney a été expulsé contre le Portugal, et les caméras vous ont filmé faisant un clin d’œil vers votre banc. La presse anglaise vous désigne comme le coupable. Le Real Madrid se renseigne ; Ferguson fait le voyage pour vous convaincre de revenir.",
      real: "Il reste à Manchester. La saison suivante, il marque 23 buts, United est champion et il est élu meilleur joueur de Premier League.", anecdote: "Rooney a toujours dit ne lui en avoir jamais voulu.",
      choices: [{ t: "Rentrer à Manchester et répondre sur le terrain", hist: true, res: "Sifflé sur tous les terrains d’Angleterre, vous transformez la colère en buts.", fx: { s: { stress: 10, coach: 8, niveau: 2, popularite: -3 }, r: { ferguson: 10, rooney: 5 } } },
        { t: "Exiger un départ immédiat pour l’Espagne", res: "Mendes ouvre les discussions avec Madrid.", fx: { r: { ferguson: -20 }, call: { fn: "force", club: "real", salary: 7, years: 5, p: .4 } } }] },
    { id: "moscou2008", date: "2008-05-21", until: "2008-06-05", cond: s => s.club === "manutd", title: "Finale de la Ligue des champions", place: "Stade Loujniki, Moscou", scene: "stade", people: ["ferguson", "rooney"],
      text: "Manchester United contre Chelsea : la première finale 100 % anglaise. Il pleut sur Moscou, la pelouse a été posée à la hâte. Vous sortez d’une saison à plus de quarante buts. Le Ballon d’or se joue peut-être ce soir.",
      real: "Il ouvre le score de la tête à la 26e minute ; Lampard égalise. Aux tirs au but, il manque le sien, mais Terry glisse et Van der Sar arrête la tentative d’Anelka : United gagne 6-5.", anecdote: "Il termine la saison avec 42 buts et reçoit son premier Ballon d’or en décembre.",
      choices: [{ t: "Jouer la finale", hist: true, res: "Coup d’envoi sous la pluie.", match: { comp: "cl", title: "Finale de la Ligue des champions 2008", opp: "Chelsea", T: 88, O: 86, final: true, trophy: "Ligue des champions", win: { s: { popularite: 12, valeur: 15 }, txt: "Champion d’Europe." }, loss: { s: { stress: 8 }, txt: "Chelsea soulève la coupe." } } }] },
    { id: "real2009", date: "2009-06-11", until: "2009-07-20", cond: s => s.club === "manutd", title: "94 millions d’euros", place: "Manchester", scene: "plateau", people: ["ferguson", "perez", "mendes"],
      text: "Manchester United vient d’accepter une offre du Real Madrid : 80 millions de livres, 94 millions d’euros, le transfert le plus cher de l’histoire. Florentino Pérez, revenu à la présidence, veut faire de vous le visage de ses nouveaux « Galactiques ». Ferguson vous laisse décider.",
      real: "Il signe au Real Madrid pour six ans. Le 6 juillet 2009, environ 80 000 personnes assistent à sa présentation au Santiago-Bernabéu.", anecdote: "Raúl portant le 7, il joue sa première saison madrilène avec le numéro 9.",
      choices: [{ t: "Signer au Real Madrid", hist: true, res: "Vous devenez le joueur le plus cher du monde.", fx: { s: { popularite: 8, stress: 6 }, r: { perez: 15, ferguson: 2 }, call: { fn: "transfer", club: "real", salary: 13, years: 6 } } },
        { t: "Rester à Manchester et prolonger", res: "Old Trafford garde son numéro 7.", fx: { s: { coach: 10, vestiaire: 6 }, r: { ferguson: 15, perez: -10 }, call: { fn: "extend", salary: 11, years: 5 } } }] },
    { id: "decima2014", date: "2014-05-24", until: "2014-06-08", cond: s => s.club === "real", title: "La Décima", place: "Estádio da Luz, Lisbonne", scene: "stade", people: ["ancelotti", "ramos"],
      text: "Le Real court depuis douze ans après sa dixième Coupe d’Europe. La finale se joue à Lisbonne, dans votre pays, contre l’Atlético de Madrid, tout juste champion d’Espagne. Vous jouez diminué par une blessure à la cuisse.",
      real: "Mené 0-1, le Real égalise par Ramos à la 93e minute et s’impose 4-1 en prolongation. Il marque le quatrième but sur penalty et porte son total à 17 buts dans la compétition, un record.", anecdote: "Il reçoit son troisième Ballon d’or en janvier 2015.",
      choices: [{ t: "Jouer la finale", hist: true, res: "Derby madrilène à Lisbonne.", match: { comp: "cl", title: "Finale de la Ligue des champions 2014", opp: "Atlético de Madrid", T: 90, O: 87, final: true, trophy: "Ligue des champions", win: { s: { popularite: 12 }, r: { ancelotti: 10 }, txt: "La dixième, enfin." }, loss: { s: { stress: 10 }, txt: "L’Atlético crée la surprise." } } }] },
    { id: "euro2016", date: "2016-07-10", until: "2016-07-25", cond: s => !s.nat.retired && s.club, title: "Finale de l’Euro 2016", place: "Stade de France, Saint-Denis", scene: "stade", people: ["santos", "pepe"],
      text: "Finale contre la France, chez elle. À la 8e minute, un choc avec Dimitri Payet vous laisse au sol, le genou gauche touché. Les soigneurs vous bandent la jambe. Vous êtes le capitaine ; le Portugal n’a jamais rien gagné.",
      real: "Il tente de reprendre deux fois, puis sort sur civière à la 25e minute, en larmes. Il finit le match debout dans la zone technique, à encourager ses coéquipiers. Éder marque à la 109e : le Portugal est champion d’Europe.", anecdote: "Un papillon de nuit s’était posé sur son visage pendant qu’il était à terre : l’image est restée.",
      choices: [{ t: "Serrer les dents et rester sur le terrain", hist: true, res: "Vous essayez, deux fois. Le genou ne tient pas ; vous sortez sur civière et poussez l’équipe depuis le banc.", fx: { s: { stress: 12 }, call: { fn: "final2016", stay: true } } },
        { t: "Sortir tout de suite pour ne pas pénaliser l’équipe", res: "Vous cédez votre place dès la 10e minute et vivez la finale au bord du terrain.", fx: { call: { fn: "final2016", stay: false } } }] },
    { id: "juve2018", date: "2018-07-10", until: "2018-08-15", cond: s => s.club === "real", title: "Turin appelle", place: "Madrid", scene: "plateau", people: ["perez", "mendes", "zidane"],
      text: "Trois Ligues des champions de suite, mais Zidane vient de partir et vos relations avec la direction se sont tendues. La Juventus propose 100 millions d’euros au Real et un contrat de quatre ans. Vous avez 33 ans : aucun joueur de cet âge n’a jamais coûté ce prix.",
      real: "Il signe à la Juventus. Il y gagne deux championnats d’Italie et marque 101 buts en trois saisons.", anecdote: "En avril 2018, le public de Turin l’avait applaudi debout après son retourné acrobatique contre la Juventus.",
      choices: [{ t: "Signer à la Juventus", hist: true, res: "Un nouveau championnat à conquérir.", fx: { s: { popularite: 4 }, r: { perez: -10 }, call: { fn: "transfer", club: "juve", salary: 31, years: 4 } } },
        { t: "Rester au Real et négocier une prolongation", res: "Mendes retourne voir Florentino Pérez.", fx: { r: { perez: 10 }, call: { fn: "extend", salary: 26, years: 3 } } }] },
    { id: "retour2021", date: "2021-08-27", until: "2021-09-01", cond: s => s.club === "juve", title: "Le marché ferme dans cinq jours", place: "Turin", scene: "plateau", people: ["mendes", "ferguson"],
      text: "Vous avez dit à la Juventus que vous vouliez partir. Selon la presse, Manchester City a discuté avec Jorge Mendes. Puis Manchester United est entré dans la danse, et d’anciens coéquipiers vous ont appelé.",
      real: "Manchester United annonce son retour le 27 août 2021. Il marque un doublé pour son deuxième premier match, contre Newcastle, et finit la saison avec 24 buts.", anecdote: "Le maillot floqué à son nom bat des records de ventes en quelques heures.",
      choices: [{ t: "Rentrer à Manchester United", hist: true, res: "Douze ans après, Old Trafford vous retrouve.", fx: { s: { popularite: 8 }, r: { ferguson: 10 }, call: { fn: "transfer", club: "manutd", salary: 26, years: 2 } } },
        { t: "Signer à Manchester City", res: "L’autre moitié de Manchester.", fx: { s: { popularite: -6 }, r: { ferguson: -25, rooney: -10 }, call: { fn: "transfer", club: "mancity", salary: 24, years: 2 } } },
        { t: "Rester à la Juventus", res: "Vous honorez la dernière année de contrat.", fx: { s: { coach: -4 }, r: { allegri: 4 } } }] },
    { id: "interview2022", date: "2022-11-10", until: "2022-11-20", cond: s => s.club === "manutd", title: "Sur le banc", place: "Manchester", scene: "plateau", people: ["tenhag", "mendes"],
      text: "Vous ne débutez plus les matchs. En octobre, vous avez quitté le banc avant la fin d’une rencontre et vous avez été écarté du groupe. La Coupe du monde commence dans dix jours. Un journaliste britannique vous propose une longue interview télévisée, sans filtre.",
      real: "L’interview est diffusée à la mi-novembre 2022 ; il y critique le club et son entraîneur. Le 22 novembre, Manchester United et lui annoncent la fin de son contrat d’un commun accord.", anecdote: "Il devient quelques jours plus tard le premier joueur à marquer dans cinq Coupes du monde.",
      choices: [{ t: "Donner l’interview et tout dire", hist: true, res: "L’entretien fait le tour du monde. Le club et vous vous séparez.", fx: { s: { popularite: -6, stress: 12, vestiaire: -15 }, r: { tenhag: -40 }, call: { fn: "release" } } },
        { t: "Se taire et regagner sa place", res: "Vous travaillez en silence.", fx: { s: { coach: 8, stress: 6 }, r: { tenhag: 12 } } },
        { t: "Demander à Mendes un départ discret en janvier", res: "L’agent sonde le marché sans bruit.", fx: { r: { mendes: 5 }, call: { fn: "scout" } } }] },
    { id: "nassr2022", date: "2022-12-27", until: "2023-01-20", cond: s => !s.club && s.rank !== "retraite", title: "L’offre de Riyad", place: "Madrid", scene: "plateau", people: ["mendes"],
      text: "Libre de tout contrat après la Coupe du monde, vous vous entraînez seul. Les grands clubs européens ne se bousculent pas. Al-Nassr, à Riyad, propose un contrat de deux ans et demi que la presse chiffre autour de 200 millions d’euros par saison, en comptant les accords commerciaux.",
      real: "Il signe à Al-Nassr le 30 décembre 2022. Son arrivée ouvre la voie à des dizaines de joueurs de premier plan vers le championnat saoudien.", anecdote: "Le compte Instagram du club passe de moins d’un million à plus de dix millions d’abonnés en quelques jours.",
      choices: [{ t: "Signer à Al-Nassr", hist: true, res: "Le football saoudien change d’échelle.", fx: { s: { popularite: -2 }, call: { fn: "transfer", club: "alnassr", salary: 200, years: 3 } } },
        { t: "Revenir au Sporting, pour un salaire symbolique", res: "Lisbonne retrouve l’enfant du centre de formation.", fx: { s: { popularite: 8 }, r: { dolores: 10 }, call: { fn: "transfer", club: "sporting", salary: 4, years: 2 } } },
        { t: "Tenter l’aventure américaine", res: "La MLS déroule le tapis rouge.", fx: { s: { popularite: 3 }, call: { fn: "transfer", club: "intermiami", salary: 30, years: 2 } } }] },
    { id: "youtube2024", date: "2024-08-21", until: "2024-10-01", cond: s => !s.biz.youtube, title: "Une chaîne à soi", place: "Riyad", scene: "plateau", people: ["georgina"],
      text: "Votre équipe a préparé une chaîne YouTube : entraînements, famille, entretiens avec d’anciens coéquipiers. Vous avez déjà plus d’abonnés que quiconque sur les autres réseaux. Reste à savoir si vous voulez ouvrir cette porte de plus.",
      real: "La chaîne « UR · Cristiano » est lancée le 21 août 2024. Elle dépasse le million d’abonnés en moins de deux heures, un record pour la plateforme.", anecdote: "Il reçoit ses trophées YouTube en direct avec ses enfants.",
      choices: [{ t: "Lancer la chaîne", hist: true, res: "Les compteurs s’affolent.", fx: { s: { abonnes: 40, popularite: 4, stress: 3 }, call: { fn: "biz", id: "youtube" } } },
        { t: "Rester concentré sur le terrain", res: "Les caméras resteront à la porte.", fx: { s: { stress: -3 } } }] },
    { id: "nations2025", date: "2025-06-08", until: "2025-06-20", cond: s => !s.nat.retired && s.club, title: "Finale de la Ligue des nations", place: "Allianz Arena, Munich", scene: "stade", people: ["martinez", "bruno"],

/* ---------------- Contrats et transferts ---------------- */
R.fair = s => { const y = parseD(s.date).y, age = GAME.age(s); const era = clamp((y - 1994) / 22, .3, 1.25); const ageM = age <= 31 ? 1 : age <= 34 ? .85 : age <= 37 ? .6 : .4; return Math.round(Math.pow(Math.max(2, s.stats.niveau - 55), 1.62) * .115 * era * ageM * (.85 + s.stats.popularite / 300) * 10) / 10; };

R.budget = s => {
  const p = s.pol, st = s.stats, y = parseD(s.date).y; const rec = [], dep = [];
  const sal = s.contract && s.club ? s.contract.salary / 12 : 0; if (sal) rec.push([`Salaire (${CLUBS[s.club].n})`, sal]);
  const era = clamp((y - 1998) / 18, .2, 1.3); const pop = st.popularite / 100; const active = s.rank !== "retraite" ? 1 : .55;
  const equip = y >= 2003 ? (y >= 2016 ? 1.7 : y >= 2010 ? .9 : .25) * active : 0; rec.push(["Équipementier", equip]);
  if (p.sponsors) rec.push(["Contrats publicitaires", [0, .35, .85, 1.5][p.sponsors] * pop * 2.2 * era * active]);
  if (st.abonnes > 20 && p.social) rec.push(["Publications sponsorisées", st.abonnes / 1000 * [0, 1.2, 2.6, 4][p.social]]);
  for (const b of R.biz) if (s.biz[b.id]) rec.push([b.label.split(" (")[0], b.inc * (.6 + pop * .8) * (b.id === "youtube" ? st.abonnes / 600 : 1)]);
  const taxable = sal + rec.filter(r => /publicit|Équipementier|sponsoris/.test(r[0])).reduce((t, r) => t + r[1], 0); const rate = s.club && CLUBS[s.club].lg === "sa" ? 0 : .43; if (taxable * rate > .001) dep.push(["Impôts", taxable * rate]);
  if (sal) dep.push(["Commission de l’agent", sal * .07]);
  dep.push(["Train de vie", [.04, .12, .45][p.train] * (1 + st.fortune / 900)]);
  dep.push(["Staff personnel (kiné, cuisinier, préparateur)", [0, .015, .05][p.recup] + [0, .008, .02][p.nutrition]]);
  if (p.dons) dep.push(["Dons et œuvres caritatives", [0, .05, .2, .6][p.dons]]);
  const R_ = rec.reduce((t, x) => t + x[1], 0), D = dep.reduce((t, x) => t + x[1], 0); return { rec, dep, R: R_, D, solde: R_ - D };
};
R.fin = { stat: "fortune", unit: "M €", chartTitle: "Fortune sur les douze derniers mois, en millions d’euros",
  kpis: (s, b, f) => [["Fortune", f(s.stats.fortune)], ["Revenus par mois", "+" + b.R.toFixed(2).replace(".", ",")], ["Dépenses par mois", "−" + b.D.toFixed(2).replace(".", ",")], ["Solde par mois", sg(b.solde, 2)], ["Salaire annuel", s.contract ? ME(s.contract.salary) : "—"], ["Abonnés", `${Math.round(s.stats.abonnes)} M`]] };

/* ---------------- Simulation hebdomadaire ---------------- */
const CURVE = [[16, 58], [18, 68], [20, 77], [22, 85], [24, 90], [26, 93], [28, 95], [31, 95], [33, 93], [35, 90], [37, 86], [39, 82], [41, 78], [43, 72], [45, 64], [50, 45]];
const curve = age => { for (let i = 1; i < CURVE.length; i++) if (age <= CURVE[i][0]) { const [a0, v0] = CURVE[i - 1], [a1, v1] = CURVE[i]; return v0 + (v1 - v0) * (age - a0) / (a1 - a0); } return 40; };
R.tick = function(s, h){
  const st = s.stats, p = s.pol, age = h.age + (parseD(s.date).m - 2) / 12, out = []; const b = R.budget(s); h.add("fortune", b.solde);
  const playing = s.rank !== "retraite";
  if (playing) {
    const pot = curve(age) + [-5, -1, 1.5, 3][p.intensite] + (age > 29 ? p.nutrition * 1.2 + p.recup * 1.2 - 1.5 : 0) - (s.injury ? 2 : 0) - (!s.club ? 3 : 0);
    h.drift("niveau", pot, .09);
    if (p.focus !== "physique" && p.focus !== "recup" && s.skills[p.focus] !== undefined) s.skills[p.focus] = clamp(s.skills[p.focus] + [.0, .25, .5, .7][p.intensite] * (age < 30 ? 1 : .55) * h.dt, 30, 99);
    for (const k of Object.keys(s.skills)) if (k !== p.focus) s.skills[k] = clamp(s.skills[k] - (k === "vitesse" && age > 30 ? .22 : age > 33 ? .08 : 0) * h.dt, 30, 99);
    h.add("fatigue", [-9, -3, 3, 9][p.intensite] - p.recup * 5 - (p.focus === "recup" ? 8 : 0) + p.sponsors * 1.4 + (age > 34 ? 2 : 0)); h.drift("fatigue", 15, .3);
    h.drift("forme", 52 + p.intensite * 9 + p.nutrition * 4 + (p.focus === "physique" ? 6 : 0) - Math.max(0, st.fatigue - 55) * .7 - (s.injury ? 30 : 0), .3);
    h.drift("coach", 55, .03); h.drift("vestiaire", 55 + [-6, 0, 4][p.attitude === 0 ? 2 : p.attitude === 2 ? 0 : 1], .03);
    const ageV = age <= 29 ? 1 : age <= 31 ? .85 : age <= 33 ? .6 : age <= 35 ? .35 : age <= 37 ? .18 : .08; h.drift("valeur", Math.pow(Math.max(0, st.niveau - 60), 2) * .1 * ageV * (.8 + st.popularite / 400), .12);
    if (s.wk.scoutAt && s.week >= s.wk.scoutAt) { delete s.wk.scoutAt; if (!R.genOffers(s, 2 + Math.floor(Math.random() * 2))) out.push({ t: "Jorge Mendes a fait le tour du marché : aucune offre sérieuse pour l’instant." }); }
    s.offers = (s.offers || []).filter(o => { if (o.exp > s.date) return true; out.push({ t: `${CLUBS[o.club].n} retire son offre.` }); return false; });
    if (R.window(s.date) && s.club && st.niveau >= 80 && h.chance(.25)) R.genOffers(s, 1);
  } else { st.niveau = clamp(st.niveau - .25 * h.dt, 30, 99); h.drift("forme", 50, .1); h.add("fatigue", -6); h.drift("valeur", 0, .3); }
  h.drift("popularite", 28 + st.niveau * .45 + [0, 3, 6, 8][p.social] + [-0, 2, 5, 8][p.dons] + [2, 0, -3][p.ton] + (playing ? 0 : -8), .03);
  const y = parseD(s.date).y; if (y >= 2009) { const g = Math.max(0, (y - 2008)) * [0, .25, .6, 1][p.social] * (st.popularite / 100) * (y >= 2015 ? 1.6 : 1) * [.9, 1, 1.25][p.ton]; h.add("abonnes", g); }
  h.add("stress", p.sponsors * .7 + p.social * .5 + (st.coach < 40 ? 1.5 : 0) + (st.popularite < 40 ? 1 : 0) + (s.injury ? 1 : 0) - 2.6 - (s.wk.famW && s.week - s.wk.famW < 5 ? 1 : 0));
  h.drift("sante", 96 - Math.max(0, age - 34) * (playing ? .9 : 1.2) - Math.max(0, st.fatigue - 75) * .4 - Math.max(0, st.stress - 75) * .3 + p.nutrition * 1.5, .06);
  return out;
};

R.upcoming = s => {
  const out = []; let d = s.date, off = 0; for (let i = 0; i < 6 && out.length < 7; i++) { d = addDays(d, 7); const fs = R.fixtures(s, d, off); if (fs.some(f => f.comp === "lg")) off++; for (const f of fs) out.push({ d, t: `${f.title}${f.comp === "lg" ? "" : ""} : ${f.opp}`, k: f.big || f.final ? "Grand match" : "Match" }); }

  const y = parseD(s.date).y; const win = [`${y}-07-01`, `${y + 1}-01-01`, `${y + 1}-07-01`].find(x => x > s.date); if (s.rank !== "retraite") out.push({ d: win, t: "Ouverture du marché des transferts", k: "Mercato" });
  const tn = TOURS(y) || TOURS(y + 1); const ty = TOURS(y) ? y : y + 1; const td = `${ty}-${ty === 2022 ? "11-20" : "06-10"}`; if (tn && td > s.date && !s.nat.retired) out.push({ d: td, t: `Début : ${tn}`, k: "Sélection" });

    { k: "btn", act: "madere", label: "Retourner quelques jours à Madère", cost: "Stress −10, forme −2", dis: once(s, "madere") || (s.wk.madW && s.week - s.wk.madW < 10 && "Trop récent") }] },
  { id: "image", label: "Image et médias", cond: s => true, blocks: s => [

];
R.windows = { general: ["contrats", "vestiaire", "selection", "famille"], saison: "entrainement", medias: "image", business: "business" };
R.views = [{ id: "general", label: "Vue générale", icon: "general", kind: "general" }, { id: "saison", label: "Saison", icon: "ballon", kind: "board" }, { id: "medias", label: "Médias", icon: "presse", kind: "presse" }, { id: "business", label: "Business", icon: "finances", kind: "finances" }, { id: "messages", label: "Messages", icon: "corr", kind: "corr" }];

R.act = (s, act, arg, val) => {
  const fx = o => GAME.applyFx(s, o); const use = id => { s.wk[id] = s.week; };
  switch (act) {
    case "pol": s.pol[arg] = isNaN(+val) ? val : +val; return {};

    case "prolonger": { use("prol"); s.wk.prolY = parseD(s.date).y; const fair = R.fair(s); const ok = s.stats.coach >= 50 && fair > s.contract.salary * 1.05; if (ok) { const sal = Math.round((s.contract.salary + (fair - s.contract.salary) * .8) * 10) / 10; const out = { deltas: {}, rels: {}, notes: [] }; R.fxCall(s, { fn: "extend", salary: sal, years: 3 }, out); return { msg: out.notes[0], tone: "good", src: "Rumeur de transfert" }; } fx({ s: { coach: -3 } }); return { msg: fair <= s.contract.salary * 1.05 ? "Le club estime que votre salaire reflète déjà votre niveau." : "Le club refuse de discuter tant que la confiance du coach n’est pas rétablie.", tone: "bad" }; }
    case "sonder": use("sonder"); s.wk.scoutAt = s.week + 3; fx({ r: { mendes: 2 } }); return { msg: "Jorge Mendes commence sa tournée des clubs." };
    case "offer_no": s.offers = s.offers.filter(o => o.club !== arg); return { msg: `Offre de ${CLUBS[arg].n} déclinée.` };
    case "offer_yes": { const o = s.offers.find(x => x.club === arg); if (!o) return {}; if (s.club && s.contract && parseD(s.contract.until).y - parseD(s.date).y >= 2 && s.stats.niveau >= 88 && Math.random() < .45) { s.offers = s.offers.filter(x => x !== o); fx({ s: { coach: -6, vestiaire: -4 } }); return { msg: `${CLUBS[s.club].n} vous déclare intransférable : l’offre de ${CLUBS[o.club].n} est repoussée.`, tone: "bad", src: "Rumeur de transfert" }; } const out = { deltas: {}, rels: {}, notes: [] }; R.fxCall(s, { fn: "transfer", club: o.club, salary: o.salary, years: o.years }, out); s.history.push({ date: s.date, id: "tr-" + s.week, kind: "transfert", title: "Transfert", choice: `Signature à ${CLUBS[o.club].n}`, hist: null, histExists: false, outcome: out.notes[0] }); return { msg: out.notes[0], tone: "good", sfx: "crowd" }; }
    case "retraite": { const out = { deltas: {}, rels: {}, notes: [] }; R.fxCall(s, { fn: "retire" }, out); s.history.push({ date: s.date, id: "ret", kind: "transfert", title: "Fin de carrière", choice: "Retraite annoncée", hist: null, histExists: false, outcome: out.notes[0] }); return { msg: out.notes[0], sfx: "crowd" }; }
    case "retraitenat": s.nat.retired = true; fx({ s: { popularite: -2, fatigue: -5 } }); R.press(s, "retraitenat"); return { msg: `Retraite internationale : ${s.career.caps} sélections, ${s.career.natGoals} buts avec le Portugal.` };
    case "diner": use("diner"); s.wk.dinerW = s.week; fx({ s: { fortune: -.05, vestiaire: 5 } }); return { msg: "Dîner d’équipe : l’ambiance se détend." };
    case "coachtalk": { use("coachtalk"); s.wk.talkW = s.week; const good = s.stats.forme + s.stats.niveau > 135 + Math.random() * 30; fx({ s: { coach: good ? 7 : -5 } }); return { msg: good ? "Le coach apprécie votre franchise et vous confirme son plan." : "La discussion tourne court : le coach vous demande d’abord de le prouver sur le terrain.", tone: good ? "good" : "bad" }; }
    case "mentor": use("mentor"); fx({ s: { vestiaire: 3, fatigue: 3 } }); return { msg: "Séance supplémentaire avec les jeunes." };

    case "madere": use("madere"); s.wk.madW = s.week; fx({ s: { stress: -10, forme: -2 }, r: { dolores: 4 } }); return { msg: "Quelques jours à Funchal." };
    case "biz": { const b = R.biz.find(x => x.id === arg); s.stats.fortune -= b.cost; s.biz[b.id] = parseD(s.date).y; fx(b.fx); s.history.push({ date: s.date, id: "biz-" + b.id, kind: "business", title: "Business", choice: `Lancement : ${b.label}`, hist: null, histExists: false, outcome: "" }); return { msg: `Lancement : ${b.label}.`, tone: "good", src: "Carnet" }; }
  }

};

R.press = (s, kind, d) => {
  const A = (src, ton, title, text) => ({ src, ton, title, text }); let arts = []; const papers = ["A Bola", "Marca", "L’Équipe", "La Gazzetta dello Sport", "BBC Sport", "Record"]; const pp = () => papers[Math.floor(Math.random() * papers.length)]; const soc = parseD(s.date).y >= 2010 ? "Réseaux sociaux" : "Forum de supporters";
  if (kind === "match") { const g = d.res.goals; if (d.res.played && g >= 3) arts = [A(pp(), "fav", `Triplé de Ronaldo : ${d.f.opp} balayé`, d.line + "."), A(soc, "fav", "Les supporters s’enflamment", "Les images de ses buts tournent en boucle.")];
    else if (d.win && d.res.played && g >= 1) arts = [A(pp(), "fav", `Ronaldo décisif : ${d.f.title}`, d.line + ".")];

    else arts = [A(pp(), "neu", d.f.title, d.line + ".")]; }
  else if (kind === "transfert") arts = [A("Marca", "neu", `Officiel : Ronaldo signe à ${CLUBS[d.club].n}`, `Contrat estimé à ${ME(d.salary)} par an.`), A(soc, "fav", "Les ventes de maillots s’envolent", "Le numéro 7 est déjà en rupture dans les boutiques du club.")];

  else if (kind === "retraitenat") arts = [A("Record", "neu", "Ronaldo quitte la sélection", "Le capitaine laisse sa place.")];
  else if (kind === "evenement") arts = [A(pp(), "neu", d.title, d.res || "")];
  for (const a of arts.reverse()) GAME.news(s, a); return arts;
};

/* ---------------- Cartes : États-Unis (popularité par État) et monde (diplomatie) ---------------- */
T.swing = s => (s.stats.approbation - 43.5) * .55 + (s.stats.economie - 55) * .1 + (s.stats.base - 75) * .06 - (s.stats.justice > 60 ? 1 : 0);
T.margin = (s, k) => ST[k][3] + T.swing(s) + ((s.bonus || {})[k] || 0);
const usMap = { id: "usa", label: "États-Unis", title: "États-Unis : popularité par État", viewBox: "150 50 700 510",
  regions: Object.entries(ST).map(([k, v]) => ({ id: k, name: v[0], short: k, pts: tile(v[4], v[5]), c: [160 + v[4] * 62 + 28, 60 + v[5] * 62 + 26], adj: [] })),
  statusLabel: { s5: "Très favorable", s4: "Favorable", s3: "Disputé", s2: "Défavorable", s1: "Très défavorable" },
  status(s, id){ const m = T.margin(s, id); return m >= 12 ? "s5" : m >= 3 ? "s4" : m > -3 ? "s3" : m > -12 ? "s2" : "s1"; }, markers: s => [] };
const W = (id, name, pts, c) => ({ id, name, pts, c, adj: [] });
const worldMap = { id: "monde", label: "Monde", title: "Monde : diplomatie et déploiements", viewBox: "120 40 820 480",
  regions: [W("canada", "Canada", "140,70 330,70 320,145 150,145", [235, 108]), W("usa", "États-Unis", "150,150 310,150 318,228 210,250 150,222", [232, 195]), W("mexique", "Mexique", "172,255 255,252 275,312 222,322", [228, 285]), W("amlat", "Amérique latine", "262,322 345,330 352,470 302,500 268,420", [308, 400]),
    W("royaumeuni", "Royaume-Uni", "425,108 468,104 470,160 428,165", [447, 135]), W("europe", "Union européenne", "474,128 566,122 574,205 480,210", [524, 166]), W("ukraine", "Ukraine", "578,165 640,160 642,196 580,198", [610, 180]), W("russie", "Russie", "580,60 905,60 905,150 650,156 578,158", [745, 108]),
    W("israel", "Israël", "548,216 600,216 600,258 548,258", [574, 238]), W("arabie", "Arabie saoudite", "604,262 672,262 668,318 608,308", [638, 288]), W("iran", "Iran", "646,202 712,202 712,256 646,256", [679, 229]), W("inde", "Inde", "684,262 748,265 738,345 698,338", [716, 300]),
    W("chine", "Chine", "720,160 852,158 862,262 754,262 720,200", [790, 212]), W("coree", "Corée du Nord", "856,150 900,150 900,184 858,186", [878, 168]), W("japon", "Japon", "872,190 925,186 928,246 880,250", [900, 218]), W("afrique", "Afrique", "440,225 540,222 596,330 556,442 500,432 462,330", [512, 330])],
  statusLabel: { home: "États-Unis", allie: "Allié proche", paix: "Partenaire", tendu: "Relations tendues", guerre: "Adversaire" },
  status(s, id){ if (id === "usa") return "home"; const v = s.pays[id].rel; return v >= 45 ? "allie" : v >= 0 ? "paix" : v >= -40 ? "tendu" : "guerre"; },
  markers(s){ return Object.entries(s.pays).filter(([k, c]) => c.troupes > 0).map(([k, c]) => ({ id: "t-" + k, region: k, moving: false, label: c.troupes > 1 ? "★★" : "★", title: `${T.regionName(k)} : présence militaire ${c.troupes > 1 ? "renforcée" : "américaine"}` })); } };
T.maps = [usMap, worldMap]; T.map = worldMap;
T.regionName = id => (worldMap.regions.find(r => r.id === id) || usMap.regions.find(r => r.id === id) || { name: id }).name;
T.ev = (s, k) => ST[k][parseD(s.date).y >= 2024 ? 2 : 1];
T.mapInfo = (s, id) => {
  if (ST[id]) { const m = T.margin(s, id); const st = usMap.status(s, id); return `<div class="map-info"><button class="x" data-do="mapclose" aria-label="Fermer">×</button><h3>${esc(ST[id][0])} <span class="chip ${st === "s3" ? "rival" : m > 0 ? "allie" : "ennemi"}">${esc(usMap.statusLabel[st])}</span></h3>
    <span class="note">${T.ev(s, id)} grands électeurs · avance estimée : ${m >= 0 ? "républicains" : "démocrates"} ${sg(Math.abs(m)).slice(1)} point${Math.abs(m) >= 2 ? "s" : ""}${(s.bonus || {})[id] ? ` · effet de vos meetings ${sg(s.bonus[id])}` : ""}</span>
    ${s.running ? `<div class="ops"><button class="btn small primary" data-do="act|meeting|${id}">Tenir un meeting ici</button></div>` : `<span class="note">Les meetings par État s’ouvrent pendant une campagne.</span>`}</div>`; }
  if (id === "usa") return `<div class="map-info"><button class="x" data-do="mapclose" aria-label="Fermer">×</button><h3>États-Unis</h3><span class="note">Basculez sur la carte des États pour la popularité État par État.</span></div>`;
  const c = s.pays[id]; const st = worldMap.status(s, id);
  return `<div class="map-info"><button class="x" data-do="mapclose" aria-label="Fermer">×</button><h3>${esc(T.regionName(id))} <span class="chip ${st === "allie" ? "allie" : st === "guerre" ? "ennemi" : st === "tendu" ? "rival" : "neutre"}">${esc(worldMap.statusLabel[st])}</span></h3>
    <span class="note">Relation ${Math.round(c.rel)} · droits de douane ${["aucun", "faibles", "élevés", "très élevés"][c.tarif || 0]} · présence militaire ${["aucune", "permanente", "renforcée"][c.troupes || 0]}</span>
    ${P(s) >= 3 ? `<div class="ops"><button class="btn small" data-do="goto|diplomatie">Diplomatie et armée</button></div>` : `<span class="note">La diplomatie appartient au président en exercice.</span>`}</div>`;
};

T.setup = (s, startId) => {
  const st = T.starts.find(x => x.id === startId) || T.starts[0];
  s.terms = st.terms; s.running = st.running; s.house = st.house; s.senate = st.senate; s.pol = { ...T.defaultPol }; s.wk = {}; s.bonus = {}; s.decrets = {}; s.dette = startId === "2025" ? 36.2 : startId === "2017" ? 19.9 : 18.2; s.juges = startId === "2025" ? 3 : 0;
  s.pays = {}; for (const [k, v] of Object.entries(PAYS0)) s.pays[k] = { rel: v, statut: "paix", tarif: 0, troupes: ["europe", "japon", "arabie"].includes(k) ? 1 : 0 };
  if (startId === "2025") { s.pays.russie.rel = -45; s.pays.ukraine.rel = 30; s.pays.chine.rel = -30; s.pays.coree.rel = -55; s.flags.lostOnce = true; s.flags.contested = true; s.flags.vp = "vance"; } if (startId === "2017") s.flags.vp = "pence";
  s.cabinet = {}; for (const [k, p] of Object.entries(T.posts)) { const o = p.list.filter(x => x[4] <= s.date); s.cabinet[k] = (startId === "2025" ? o[o.length - 1] : o[0] || p.list[0])[0]; }
  s.rivals = {}; for (const r of T.rivals) s.rivals[r.id] = { plan: r.plans[0].plan, prog: Math.round(Math.random() * 30), i: 0 };

T.sync = s => { for (const c of Object.values(s.pays)) c.statut = c.rel >= 45 ? "allie" : c.rel >= 0 ? "paix" : c.rel >= -40 ? "tendu" : "guerre"; };

/* ---------------- Cabinet ---------------- */
T.posts = {
  chef: { label: "Chef de cabinet", list: [["priebus", "Reince Priebus", 55, 60, "2015"], ["kelly", "John Kelly", 50, 80, "2017-07"], ["mulvaney", "Mick Mulvaney", 75, 60, "2019-01"], ["meadows", "Mark Meadows", 90, 55, "2020-03"], ["wiles", "Susie Wiles", 85, 85, "2024-11"]] },
  etat: { label: "Secrétaire d’État", list: [["tillerson", "Rex Tillerson", 40, 65, "2015"], ["pompeo", "Mike Pompeo", 85, 75, "2018-03"], ["rubio", "Marco Rubio", 75, 80, "2024-11"]] },
  defense: { label: "Secrétaire à la Défense", list: [["mattis", "James Mattis", 40, 90, "2015"], ["esper", "Mark Esper", 55, 70, "2019-07"], ["hegseth", "Pete Hegseth", 95, 50, "2024-11"]] },
  tresor: { label: "Secrétaire au Trésor", list: [["mnuchin", "Steven Mnuchin", 80, 72, "2015"], ["bessent", "Scott Bessent", 80, 80, "2024-11"]] },

};
T.cab = (s, post, i) => { const o = T.posts[post].list.find(x => x[0] === s.cabinet[post]); return o ? o[i] : 60; };

/* ---------------- Économie : budget fédéral mensuel, en milliards de dollars ---------------- */
T.budget = s => {
  const p = s.pol, y = parseD(s.date).y; const base = 270 + (y - 2015) * 14; const eco = .8 + s.stats.economie / 250;
  const rec = [["Impôt sur le revenu", base * .5 * eco * (1 + p.impots * .06)], ["Cotisations sociales", base * .35 * eco], ["Impôt sur les sociétés", base * .1 * eco * (1 + p.impots * .12) * (s.flags.taxcut ? .75 : 1)], ["Droits de douane", 3 + p.douanes * 9 * (y >= 2025 ? 1.6 : 1)]];
  const sp = 320 + (y - 2015) * 24;
  const dep = [["Retraites et santé", sp * .52 * (1 + (p.social - 1) * .05)], ["Défense", sp * .15 * (1 + (p.defense - 1) * .1)], ["Frontière et sécurité intérieure", sp * .02 * (1 + (p.frontiere - 1) * .4)], ["Autres dépenses", sp * .22], ["Intérêts de la dette", s.dette * (y >= 2023 ? 2.4 : 1.6)]];
  const R = rec.reduce((t, x) => t + x[1], 0), D = dep.reduce((t, x) => t + x[1], 0); return { rec, dep, R, D, solde: R - D };
};
T.fin = { stat: "bourse", unit: "pts", chartTitle: "Bourse sur les douze derniers mois, en points d’indice",
  kpis: (s, b, f) => [["Bourse", f(s.stats.bourse)], ["Recettes fédérales par mois", Math.round(b.R) + " Md $"], ["Dépenses fédérales par mois", Math.round(b.D) + " Md $"], ["Déficit par mois", Math.round(-b.solde) + " Md $"], ["Dette fédérale", s.dette.toFixed(1).replace(".", ",") + " billions $"], ["Économie", Math.round(s.stats.economie)]] };

/* ---------------- Simulation hebdomadaire ---------------- */
T.tick = function(s, h){
  const st = s.stats, p = s.pol, pw = P(s), out = []; const b = T.budget(s);
  if (pw >= 3) s.dette += -b.solde / 1000 * h.dt;
  const ecoT = 56 + p.impots * -2.5 - p.douanes * 3 + (s.flags.taxcut ? 2 : 0) + (p.energie - 1) * 1.5 - (s.flags.covid && s.date < "2021-06-01" ? 8 : 0);
  h.drift("economie", pw >= 3 ? ecoT : 56, .06);
  st.bourse = clamp(st.bourse * (1 + ((st.economie - 46) * .0011 - p.douanes * .0012 + (Math.random() - .5) * .02) * h.dt * 4.3 / 4.3), 500, 20000);
  h.drift("approbation", 41 + (st.economie - 50) * .3 - (st.medias - 60) * .08 + (p.ton === 0 ? 2 : p.ton === 2 ? -2 : 0) + (pw >= 3 ? (T.cab(s, "chef", 3) - 65) * .04 : 2), .05);
  h.drift("base", 78 + (p.ton === 2 ? 5 : p.ton === 0 ? -4 : 0) + p.frontiere * 2 + p.douanes, .04);
  const maj = (s.house === "R" ? 1 : 0) + (s.senate === "R" ? 1 : 0); h.drift("congres", pw >= 3 ? 30 + maj * 16 + (st.approbation - 45) * .4 : 35, .05);
  h.drift("medias", 58 + (p.ton === 2 ? 10 : p.ton === 0 ? -6 : 0) + p.reseaux * 2, .05);
  h.drift("justice", s.flags.contested && pw < 3 ? 45 : pw >= 3 ? 14 : 8, .02);
  h.drift("international", 50 + (pw >= 3 ? (T.cab(s, "etat", 3) - 65) * .15 - p.douanes * 3 : 0), .03);
  h.add("fortune", .012 * (st.bourse > 3000 ? 1.4 : 1) - (s.running ? .01 * p.pub : 0) - (st.justice > 50 ? .012 : 0));
  h.add("fatigue", (pw >= 3 ? 2.5 : s.running ? 3.5 : -3) + p.reseaux * .6 - 2.2); h.add("stress", (st.medias + st.justice) / 60 - 2.4 + (s.running ? 1 : 0));
  const age = h.age; h.drift("sante", 92 - Math.max(0, age - 68) * 1.25 - Math.max(0, st.fatigue - 70) * .3 - Math.max(0, st.stress - 70) * .3, .05);
  for (const [k, c] of Object.entries(s.pays)) { c.rel = clamp(c.rel + ((PAYS0[k] - c.rel) * .01 - (c.tarif || 0) * .35) * h.dt * 4.3 / 4.3, -100, 100); }
  for (const k of Object.keys(s.bonus)) { s.bonus[k] *= 1 - .03 * h.dt; }
  return out;
};

/* ---------------- Élections ---------------- */
T.elect = s => { const y = parseD(s.date).y; let ev = 0; const won = [], lost = []; const adv = s.pol.pub * .4 + (s.pol.theme === "economie" ? (s.stats.economie > 55 ? 1 : -1) : s.pol.theme === "immigration" ? .6 : .2);
  for (const k of Object.keys(ST)) { const m = T.margin(s, k) + adv + (Math.random() - .5) * 4; if (m > 0) { ev += T.ev(s, k); if (SWING.includes(k)) won.push(ST[k][0]); } else if (SWING.includes(k)) lost.push(ST[k][0]); } return { ev, win: ev >= 270, won, lost, y }; };
T.fxCall = (s, c, out) => {
  if (c.fn === "run") { s.running = c.y; s.bonus = {}; out.notes.push(`Candidature déclarée pour ${c.y}.`); }
  else if (c.fn === "bonus") for (const k of c.st) s.bonus[k] = (s.bonus[k] || 0) + c.v;
};
T.week = (s, cont) => {
  if (s.dead || cont) return null; const p = parseD(s.date), y = p.y; const info = (id, title, text, fx, scene) => ({ event: { id, title, text, place: s.place, scene: scene || "tribune", people: [], choices: [{ t: "Continuer", fx: fx || {} }] } });
  const past = (m, d) => s.date >= fmtD(y, m, d) && s.date < addDays(fmtD(y, m, d), 7);
  if (s.rank === "president" && s.terms === 1 && !s.running && y % 4 === 3 && p.m >= 6 && s.wk.autorun !== y) { s.wk.autorun = y; s.running = y + 1; s.bonus = {}; GAME.news(s, { src: "Dépêche d’agence", title: `Le président est candidat à sa réélection en ${y + 1}`, text: "La campagne s’ouvre : l’onglet Campagne est disponible.", ton: "neu" }); }
  // Présidentielle : premier mardi de novembre, tous les quatre ans
  if (y % 4 === 0 && past(11, y === 2016 ? 8 : y === 2020 ? 3 : y === 2024 ? 5 : 7) && s.running === y) {
    const r = T.elect(s); s.running = 0; s.lastVote = r; const real = { 2016: "Dans la réalité, il l’emporte avec 304 grands électeurs contre 227.", 2020: "Dans la réalité, Joe Biden l’emporte avec 306 grands électeurs contre 232.", 2024: "Dans la réalité, il l’emporte avec 312 grands électeurs contre 226." }[y] || "";
    s.history.push({ date: s.date, id: "elec" + y, kind: "saison", title: `Élection présidentielle de ${y}`, choice: r.win ? "Victoire" : "Défaite", hist: null, histExists: false, outcome: `${r.ev} grands électeurs` });
    if (r.win) { if (s.rank !== "president") s.rank = "elu"; s.flags["won" + y] = true; return info("elec" + y, `Nuit électorale ${y} : victoire`, `Vous obtenez ${r.ev} grands électeurs sur 538 ; il en fallait 270. États disputés gagnés : ${r.won.join(", ") || "aucun"}. Perdus : ${r.lost.join(", ") || "aucun"}. ${real}`, { s: { base: 6, stress: -8, medias: 4 } }); }
    s.flags.lostOnce = true; s.flags["lost" + y] = true; return info("elec" + y, `Nuit électorale ${y} : défaite`, `Vous obtenez ${r.ev} grands électeurs sur 538 ; il en fallait 270. États disputés gagnés : ${r.won.join(", ") || "aucun"}. Perdus : ${r.lost.join(", ") || "aucun"}. ${real}`, { s: { base: -4, stress: 10 } }); }
  // Mi-mandat et renouvellement du Congrès
  if (y % 2 === 0 && past(11, 3) && s.wk.mid !== y) { s.wk.mid = y; const inPower = s.rank === "president" || s.rank === "elu"; const score = (inPower ? s.stats.approbation - 47 : 47 - 44) + (y % 4 === 0 ? (s.lastVote && s.lastVote.y === y && s.lastVote.win ? 4 : -2) : -4) + (Math.random() - .5) * 6; const oldH = s.house, oldS = s.senate;
    if (inPower || y % 4 === 0) { s.house = score > -1 ? "R" : "D"; s.senate = score > -4 ? "R" : "D"; } else { s.house = Math.random() < .6 ? "R" : "D"; }
    if (y % 4 !== 0) return info("mid" + y, `Élections de mi-mandat ${y}`, `Chambre des représentants : majorité ${s.house === "R" ? "républicaine" : "démocrate"}${oldH !== s.house ? " (bascule)" : ""}. Sénat : majorité ${s.senate === "R" ? "républicaine" : "démocrate"}${oldS !== s.senate ? " (bascule)" : ""}.`, { s: { congres: s.house === "R" ? 4 : -12 } }, "bureau"); }
  // Investiture ou fin de mandat : 20 janvier
  if (past(1, 20) && y % 4 === 1 && s.wk.inaug !== y) { s.wk.inaug = y;
    if (s.rank === "elu" || (s.rank === "president" && s.flags["won" + (y - 1)])) { const was = s.rank; s.rank = "president"; s.terms++; s.place = "Maison-Blanche, Washington"; s.decrets = {}; s.scene = "bureau"; return info("inaug" + y, `Investiture du 20 janvier ${y}`, `Vous prêtez serment sur les marches du Capitole pour ${was === "president" ? "un second mandat consécutif" : s.terms === 1 ? "votre premier mandat" : "un nouveau mandat"}. Les panneaux du pouvoir exécutif sont ${was === "president" ? "toujours" : "désormais"} entre vos mains.`, { s: { approbation: 3, stress: 5 } }, "bureau"); }
    if (s.rank === "president") { s.rank = s.terms >= 2 ? "prive" : "ancien"; s.place = "Mar-a-Lago, Floride"; s.scene = "tribune"; return info("fin" + y, "Fin du mandat", s.terms >= 2 ? "La Constitution limite la présidence à deux mandats. Vous quittez la Maison-Blanche et retrouvez la Floride." : "Votre successeur prête serment. Vous quittez Washington pour la Floride ; rien ne vous interdit de vous représenter dans quatre ans.", { s: { stress: -10, fatigue: -15 } }); } }
  if (s.rank === "candidat" && !s.running) { s.rank = "prive"; }
  return null;
};

/* ---------------- Jauges, alertes, À venir ---------------- */
T.mainGauges = s => [{ label: "Popularité", v: s.stats.approbation }, { label: "Soutien de la base", v: s.stats.base }, { label: "Soutien au Congrès", v: s.stats.congres }, { label: "Économie", v: s.stats.economie }, { label: `Santé · ${GAME.age(s)} ans`, v: s.stats.sante }];
T.sideFacts = s => [["Bourse", `${Math.round(s.stats.bourse).toLocaleString("fr-FR")} pts`], ["Relations internationales", Math.round(s.stats.international)], ["Hostilité des médias", Math.round(s.stats.medias)], ["Pression judiciaire", Math.round(s.stats.justice)], ["Chambre · Sénat", `${s.house} · ${s.senate}`], ["Fortune", MD(s.stats.fortune)]];
T.alerts = s => { const o = { general: [], pouvoir: [], economie: [] }; if (s.stats.approbation < 36) o.general.push("Popularité au plus bas : vos alliés au Congrès prennent leurs distances."); if (s.stats.justice >= 65) o.pouvoir.push("La pression judiciaire devient très forte."); if (P(s) >= 3 && s.house === "D") o.pouvoir.push("La Chambre est démocrate : vos lois seront bloquées, les enquêtes parlementaires s’ouvrent."); if (s.stats.economie < 40) o.economie.push("L’économie ralentit nettement."); if (s.running) o.general.push(`Vous êtes en campagne pour ${s.running}.`); return o; };
T.badges = (s, c) => ({ general: c.view !== "general" && c.flagGeneral, pouvoir: c.view !== "pouvoir" && c.al.pouvoir.length > 0, medias: c.view !== "medias" && c.newsNew, economie: c.view !== "economie" && c.al.economie.length > 0, messages: c.unread > 0 });
T.upcoming = s => { const out = [], y = parseD(s.date).y; for (const x of s.deferred) out.push({ d: x.date, t: x.title, k: "Conséquence attendue" });
  for (const yy of [y, y + 1, y + 2]) { if (yy % 2 === 0) out.push({ d: `${yy}-11-0${yy === 2016 ? 8 : yy === 2020 ? 3 : yy === 2024 ? 5 : 3}`, t: yy % 4 === 0 ? `Élection présidentielle${s.running === yy ? " : vous êtes candidat" : ""}` : "Élections de mi-mandat", k: "Scrutin" }); if (yy % 4 === 1) out.push({ d: `${yy}-01-20`, t: "Investiture présidentielle", k: "Calendrier" }); }
  return out.filter(x => x.d > s.date).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8); };
T.opinions = s => [["Popularité nationale", s.stats.approbation], ["Soutien de la base républicaine", s.stats.base]];
T.newsFx = (s, cat, sign) => { if (cat === "etr") { const v = sign * .4; s.stats.base = clamp(s.stats.base + v, 0, 100); return { k: "de la base", v }; } const v = sign * .3; s.stats.approbation = clamp(s.stats.approbation + v, 0, 100); return { k: "nationale", v }; };

/* ---------------- Tableau « Pouvoir » ---------------- */
T.boards = { pouvoir: s => { const blk = (t, b) => `<div class="panel"><h2>${t}</h2>${b}</div>`; const y = parseD(s.date).y;
  const sw = SWING.map(k => [k, T.margin(s, k)]).sort((a, b) => b[1] - a[1]); let ev = 0; for (const k of Object.keys(ST)) if (T.margin(s, k) > 0) ev += T.ev(s, k);

    + `<div class="two-col">` + blk("États disputés", `<div class="tbl">${sw.map(([k, m]) => `<div><span>${esc(ST[k][0])} (${T.ev(s, k)})</span><span>${m >= 0 ? "R" : "D"} ${sg(Math.abs(m)).slice(1)}</span></div>`).join("")}</div><p class="note" style="margin:6px 0 0">Avance estimée en points. Il faut 270 grands électeurs sur 538.</p>`)
    + blk("Décrets en vigueur", Object.keys(s.decrets).length ? `<div class="tbl">${Object.entries(s.decrets).map(([k, d]) => `<div><span>${esc(T.decrets.find(x => x.id === k).label)}</span><span>${d.bloque ? "suspendu par un juge" : ["modéré", "ferme", "maximal"][d.lvl]}</span></div>`).join("")}</div>` : `<span class="note">${P(s) >= 3 ? "Aucun décret signé pendant ce mandat." : "Les décrets sont réservés au président en exercice."}</span>`) + `</div>`
    + blk("Cabinet", `<div class="tbl">${Object.entries(T.posts).map(([k, p]) => `<div><span>${esc(p.label)}</span><span>${P(s) >= 3 ? esc(p.list.find(x => x[0] === s.cabinet[k])[1]) : "—"}</span></div>`).join("")}<div><span>Vice-président ou colistier</span><span>${esc({ pence: "Mike Pence", vance: "JD Vance", rubio: "Marco Rubio", gingrich: "Newt Gingrich", christie: "Chris Christie", burgum: "Doug Burgum" }[s.flags.vp] || "—")}</span></div></div>`); } };

    ...["chine", "russie", "ukraine", "europe", "royaumeuni", "canada", "mexique", "israel", "arabie", "iran", "coree", "japon", "inde"].map(k => { const c = s.pays[k]; const st = worldMap.status(s, k);

B.rpm = y => y < 2018 ? .0016 : y < 2021 ? .0026 : .0034;   // revenu publicitaire, en M $ par million de vues
B.budget = s => { const p = s.pol, st = s.stats, y = parseD(s.date).y; const rec = [], dep = [];
  rec.push(["Publicité de la plateforme", st.vues * B.rpm(y) * (st.reputation < 40 ? .7 : 1)]);

  dep.push(["Salaires", B.teams[s.team][1] * p.salaires / 100]); dep.push(["Studio et matériel", [.002, .05, .3, .9][s.studio]]);
  const brut = rec.reduce((t, x) => t + x[1], 0); if (p.part) dep.push(["Dons réguliers", brut * [0, .05, .15, .3][p.part]]);
  dep.push(["Train de vie", [.003, .02, .1][p.train]]);
  const R = brut, D = dep.reduce((t, x) => t + x[1], 0); return { rec, dep, R, D, solde: R - D }; };
B.fin = { stat: "tresorerie", unit: "M $", chartTitle: "Trésorerie sur les douze derniers mois, en millions de dollars",
  kpis: (s, b, f) => [["Trésorerie", MS(s.stats.tresorerie)], ["Revenus par mois", "+" + MS(b.R)], ["Dépenses par mois", "−" + MS(b.D)], ["Solde par mois", sg(b.solde, 2) + " M $"], ["Dons cumulés", MS(s.dons)], ["Vidéos publiées", s.videos.length]] };

B.baseViews = (s, v) => { const st = s.stats, t = TYPES[v.type]; const y = parseD(s.date).y; const ref = Math.max(.02, st.abonnes * .09) + .05; const bud = 1 + Math.log10(1 + v.budget / ref) * .55;
  const team = [.75, .9, 1, 1.08, 1.12][s.team] * (.7 + st.equipe / 330); return Math.max(.02, (st.abonnes * 1.3 + .25) * (.45 + st.algo / 90) * t.mult * bud * team * (s.biz.doublage ? 1.2 : 1)); };
B.weeksFor = (s, v) => Math.max(1, Math.round(TYPES[v.type].weeks * [1.5, 1.2, 1, .85, .75][s.team] * [1.3, 1, .75][s.pol.cadence] + (v.lieu !== "amnord" ? 1 : 0)));

B.aiVideo = async (s, v, base) => {
  const o = await AI.call(`Tu es le moteur de « Legacy », simulateur sérieux en français. Le joueur incarne le créateur et sort une vidéo. Juge-la comme le ferait le public de la plateforme à cette date : force du concept, clarté et promesse du titre, efficacité de la miniature, adéquation du budget. Ne juge pas l’orthographe.

${AI.context(s)}

VIDÉO QUI SORT
- Type : ${TYPES[v.type].label}
- Titre : « ${v.title} »
- Concept : ${v.concept}
- Miniature : ${v.thumb || "(non décrite)"}
- Budget : ${v.budget} million(s) de dollars · Lieu : ${B.regionName(v.lieu)}
- Audience attendue pour une vidéo moyenne de ce type avec ce budget : ${base.toFixed(1)} millions de vues le premier mois.
DERNIÈRES VIDÉOS : ${s.videos.slice(-5).map(x => `« ${x.title} » (${x.views.toFixed(0)} M)`).join(" ; ") || "aucune"}

"multiplicateur" : entre 0.3 (ratée, déjà vue, titre flou) et 3 (idée exceptionnelle, jamais faite, titre irrésistible) ; 1 = dans la moyenne. Pénalise la répétition d’un concept récent. "retention" : part moyenne de la vidéo regardée, de 20 à 80. Si le concept est dangereux, humiliant ou trompeur, les effets doivent le refléter (réputation, risque de bad buzz).
${AI.rules(s)}
RÉPONDS UNIQUEMENT par un objet JSON : {"multiplicateur":1.2,"retention":55,"verdict":"2 phrases sur ce qui marche ou non","effets":{"jauges":{"reputation":2,"badbuzz":3,"algo":2}},"presse":[{"source":"…","titre":"…","texte":"…","ton":"favorable|neutre|hostile"}],"commentaires":[{"qui":"…","texte":"…"}]}`, { timeout: 90000 });
  if (!o || !isFinite(Number(o.multiplicateur))) throw new Error("forme");
  return { mult: clamp(Number(o.multiplicateur), .3, 3), ret: clamp(Math.round(Number(o.retention) || 50), 20, 80), verdict: String(o.verdict || "").slice(0, 400), fx: AI.normFx(o.effets, s, 1), news: (Array.isArray(o.presse) ? o.presse : []).slice(0, 3).map(n => ({ src: String(n.source || "Presse spécialisée").slice(0, 60), title: String(n.titre || "").slice(0, 140), text: String(n.texte || "").slice(0, 300), ton: n.ton })).filter(n => n.title), comments: (Array.isArray(o.commentaires) ? o.commentaires : []).slice(0, 5).map(c => ({ qui: String(c.qui || "").slice(0, 50), texte: String(c.texte || c).slice(0, 200) })) };
};
B.release = async s => {
  const v = s.prod; s.prod = null; const base = B.baseViews(s, v); if (s.speed > 0) UI.resumeSpeed = s.speed; LOOP.setSpeed(0);
  const ov = UI.openModal(`<div class="loading"><div class="quill" aria-hidden="true"></div><h2>« ${esc(v.title)} » est en ligne</h2><p class="muted">Les premières heures décident de tout. Les compteurs tournent…</p></div>`, { scene: "studio" });
  let r = null; if (AI.usable()) { try { r = await B.aiVideo(s, v, base); } catch (e) { r = null; } }
  if (GAME.s !== s) return;
  if (!r) { const m = clamp(rnd(.55, 1.6) * (s.videos.slice(-4).filter(x => x.type === v.type).length >= 3 ? .75 : 1), .3, 3); r = { mult: m, ret: Math.round(35 + m * 12), verdict: m > 1.2 ? "Le concept accroche et la vidéo est partagée bien au-delà de vos abonnés." : m < .8 ? "Le public a l’impression d’avoir déjà vu cette vidéo." : "Une sortie solide, dans la moyenne de la chaîne.", fx: { s: {}, r: {}, pays: {} }, news: [], comments: [] }; }
  const views = base * r.mult; const y = parseD(s.date).y; const subs = views * .032 * (s.stats.reputation / 70) * (r.ret / 50) / (1 + s.stats.abonnes / 150); const spons = [0, .25, .6, 1][s.pol.sponsors] * views * .004 * [1.3, 1, .7][s.pol.ethique];
  const out = GAME.applyFx(s, { s: { abonnes: subs, vues: views * .6, tresorerie: views * B.rpm(y) + spons, algo: (r.mult - 1) * 7 + (r.ret - 50) * .12, equipe: -2 - (v.budget > s.stats.abonnes * .05 ? 2 : 0), fatigue: 6, reputation: (TYPES[v.type].rep || 0) - s.pol.sponsors * .5 + (s.pol.ethique === 0 ? -1 : 0), badbuzz: s.pol.ethique === 0 ? 2 : 0 } }); GAME.applyFx(s, r.fx, out);
  (s.lieux[v.lieu] = s.lieux[v.lieu] || {}).tour = true; s.videos.push({ title: v.title, type: v.type, budget: v.budget, lieu: v.lieu, d: s.date, views, mult: r.mult }); if (s.videos.length > 300) s.videos.shift();
  s.history.push({ date: s.date, id: "vid-" + s.week, kind: "video", title: "Vidéo", choice: v.title, hist: null, histExists: false, outcome: `${MM(views)} de vues` });
  GAME.news(s, { src: "Carnet", title: `Sortie : ${v.title}`, text: `${MM(views)} de vues le premier mois, ${sg(subs, 2)} M d’abonnés.`, tone: r.mult >= 1 ? "good" : "bad" }); for (const n of [...r.news].reverse()) GAME.news(s, n);
  AUDIO.sfx(r.mult >= 1.2 ? "crowd" : "notify"); UI.save();
  const o2 = UI.openModal(`<div class="outcome"><div class="ev-kind"><span class="k hist">Sortie de la vidéo</span><span class="label">${esc(TYPES[v.type].label)} · ${esc(B.regionName(v.lieu))}</span></div><h2>${esc(v.title)}</h2>
    <div class="kpi four"><div><small>Vues le premier mois</small><b>${MM(views)}</b></div><div><small>Par rapport à la moyenne</small><b>×${r.mult.toFixed(1).replace(".", ",")}</b></div><div><small>Vidéo regardée à</small><b>${r.ret} %</b></div><div><small>Nouveaux abonnés</small><b>${MM(subs)}</b></div><div><small>Recettes de la vidéo</small><b>${MS(views * B.rpm(y) + spons)}</b></div><div><small>Budget engagé</small><b>${MS(v.budget)}</b></div></div>
    <p class="ev-text">${esc(r.verdict)}</p><div class="deltas">${UI.deltaChips(out)}</div>
    ${r.comments.length ? `<div>${r.comments.map(c => `<div class="comment">${c.qui ? `<small>${esc(c.qui)}</small>` : ""}${esc(c.texte)}</div>`).join("")}</div>` : ""}
    <div class="row"><button class="btn primary" id="cont">Continuer</button></div></div>`, { scene: "studio", wide: true });
  $("#cont", o2).onclick = () => UI.afterEvent();
};
B.week = (s, cont) => { if (s.dead || cont) return null; if (s.prod) { s.prod.w--; if (s.prod.w <= 0) { B.release(s); return { hold: true }; } } return null; };
/* Fenêtre de création d’une vidéo */
B.doView = (s, a, x) => { if (a === "video") B.videoModal(s, x); };
B.videoModal = (s, lieu) => {
  if (s.prod || s.rank === "retire" || UI.modalOpen) return; const was = UI.pause(); const V = B.draft = B.draft || { type: "defi", title: "", concept: "", thumb: "", budget: 0, lieu: "amnord" }; if (lieu) V.lieu = lieu;
  const max = Math.max(.001, s.stats.tresorerie); const close = () => { UI.closeModal(); UI.update(true); if (was) LOOP.setSpeed(was); };
  const render = () => { const t = TYPES[V.type]; const minB = Math.min(max, Math.max(.0005, t.cost * Math.max(.02, s.stats.abonnes) * .02)); if (!V.budget || V.budget > max) V.budget = Math.min(max, Math.max(minB, max * .2)); const base = B.baseViews(s, V);
    const ov = UI.openModal(`<div class="ev-kind"><span class="k hist">Nouvelle vidéo</span><span class="label">Trésorerie : ${MS(s.stats.tresorerie)}</span></div><h2>Que tournez-vous ?</h2>
      <div class="types" role="group" aria-label="Type de vidéo">${Object.entries(TYPES).map(([k, x]) => `<button data-vt="${k}" aria-pressed="${k === V.type}">${esc(x.label)}</button>`).join("")}</div><span class="note">${esc(t.note)}</span>
      <div class="ctl"><div class="ctl-top"><label for="v-title">Titre</label></div><input class="sel" id="v-title" maxlength="100" value="${esc(V.title)}" placeholder="Ex. : Le dernier à quitter le cercle gagne 500 000 $"></div>
      <div class="ctl"><div class="ctl-top"><label for="v-concept">Concept</label></div><textarea class="write" style="min-height:90px" id="v-concept" maxlength="700" placeholder="Décrivez la vidéo : qui participe, quelle est la règle, quel est l’enjeu, comment elle se termine.">${esc(V.concept)}</textarea></div>
      <div class="ctl"><div class="ctl-top"><label for="v-thumb">Miniature</label></div><input class="sel" id="v-thumb" maxlength="200" value="${esc(V.thumb)}" placeholder="Ex. : moi bouche ouverte devant un cercle rouge géant, une valise de billets au centre"></div>
      <div class="ctl"><div class="ctl-top"><label for="v-budget">Budget</label><b id="v-bl">${MS(V.budget)}</b></div><input type="range" id="v-budget" min="0" max="1000" step="1" value="${Math.round(Math.sqrt(V.budget / max) * 1000)}"><span class="note" id="v-note">Tournage : ${B.weeksFor(s, V)} semaine(s) · audience attendue pour une vidéo moyenne : ${MM(base)} de vues</span></div>
      <div class="ctl"><div class="ctl-top"><label for="v-lieu">Lieu de tournage</label></div><select class="sel" id="v-lieu">${B.map.regions.map(r => `<option value="${r.id}" ${r.id === V.lieu ? "selected" : ""}>${esc(r.name)}${r.id === "amnord" ? " (votre studio)" : " (une semaine de plus)"}</option>`).join("")}</select></div>
      <div class="row"><button class="btn ghost" id="v-close">Fermer</button><button class="btn primary" id="v-go" style="font-size:1rem;padding:.6em 1.6em">Lancer le tournage</button></div>`, { wide: true });
    const upd = () => { $("#v-bl", ov).textContent = MS(V.budget); $("#v-note", ov).textContent = `Tournage : ${B.weeksFor(s, V)} semaine(s) · audience attendue pour une vidéo moyenne : ${MM(B.baseViews(s, V))} de vues`; };
    $$("[data-vt]", ov).forEach(b => b.onclick = () => { V.type = b.dataset.vt; render(); });
    $("#v-title", ov).oninput = e => { V.title = e.target.value; }; $("#v-concept", ov).oninput = e => { V.concept = e.target.value; }; $("#v-thumb", ov).oninput = e => { V.thumb = e.target.value; };
    $("#v-budget", ov).oninput = e => { V.budget = Math.max(0, Math.pow(+e.target.value / 1000, 2) * max); upd(); }; $("#v-lieu", ov).onchange = e => { V.lieu = e.target.value; upd(); };
    $("#v-close", ov).onclick = close;
    $("#v-go", ov).onclick = () => { if (V.title.trim().length < 4 || V.concept.trim().length < 10) { UI.toast("Donnez un titre et décrivez le concept."); return; } B.start(s, { type: V.type, title: V.title.trim(), concept: V.concept.trim(), thumb: V.thumb.trim(), budget: Math.round(V.budget * 1000) / 1000, lieu: V.lieu }); B.draft = null; AUDIO.sfx("drum"); UI.save(); close(); }; };
  render();
};
B.fxCall = (s, c, out) => { if (c.fn === "biz") { s.biz[c.id] = parseD(s.date).y; } else if (c.fn === "don") { s.dons += c.v; (s.lieux[c.lieu] = s.lieux[c.lieu] || {}).don = (s.lieux[c.lieu].don || 0) + c.v; } };

/* ---------------- Simulation hebdomadaire ---------------- */
B.tick = function(s, h){ const st = s.stats, p = s.pol, out = []; const b = B.budget(s); h.add("tresorerie", b.solde); const y = parseD(s.date).y;
  const active = s.rank !== "retire"; const recent = s.videos.filter(v => v.d >= addDays(s.date, -70)).length;
  h.drift("vues", st.abonnes * (5.5 + st.algo * .09) * (s.biz.doublage ? 1.15 : 1) * (active ? 1 : .5) + (s.biz.gaming ? st.abonnes * .9 : 0), .18);
  h.add("abonnes", st.vues * .0018 * (st.reputation / 70) * (1 + p.shorts * (y >= 2021 ? .25 : 0)) * (y < 2019 ? 2.2 : 1) / (1 + st.abonnes / 150));
  h.drift("algo", 50 + Math.min(4, recent) * 7 + p.shorts * (y >= 2021 ? 3 : 0) + p.cadence * 2 - (recent === 0 ? 14 : 0), .1);
  h.drift("equipe", 62 + (p.salaires - 100) * .6 - [-6, 0, 10][p.cadence] - (s.prod ? 3 : 0) + (s.flags.audit ? 6 : 0) - Math.max(0, s.team - s.studio - 1) * 5, .1);
  h.drift("reputation", 62 + [0, 3, 7, 11][p.part] + (s.biz.philanthropy ? 4 : 0) - [0, 1, 4, 8][p.sponsors] * [1.6, 1, .4][p.ethique] - st.badbuzz * .15, .05);
  h.add("badbuzz", (s.team >= 3 && !s.flags.audit ? .8 : 0) + [.6, 0, -.4][p.ethique] + [-.3, 0, .9][p.cadence] + (st.equipe < 45 ? 1 : 0) - .9);
  h.drift("fatigue", 20, .25); h.add("fatigue", (s.prod ? 5 : -4) + [-3, 0, 4][p.cadence] + p.reseaux * .5 - [0, 1, 2, 3, 4][s.team] * .6); h.add("stress", st.badbuzz / 25 + (st.tresorerie < 0 ? 2 : 0) + (s.prod ? .6 : 0) - 2.2);
  h.drift("sante", 95 - Math.max(0, h.age - 40) * 1 - Math.max(0, st.fatigue - 75) * .35 - Math.max(0, st.stress - 75) * .3, .06);
  if (st.badbuzz >= 80 && h.chance(.35)) { h.fx({ s: { reputation: -12, abonnes: -st.abonnes * .01, badbuzz: -35, equipe: -6 } }); out.push({ t: "Une polémique éclate : anciens collaborateurs et commentateurs s’expriment toute la semaine.", tone: "bad" }); GAME.news(s, { src: "Presse spécialisée", title: "La machine MrBeast sous le feu des critiques", text: "Rythme de production, promesses des vidéos, partenariats : les reproches s’accumulent.", ton: "hos" }); }
  return out; };

B.mainGauges = s => [{ label: "Faveur de l’algorithme", v: s.stats.algo }, { label: "Moral de l’équipe", v: s.stats.equipe }, { label: "Réputation", v: s.stats.reputation }, { label: "Risque de bad buzz", v: s.stats.badbuzz, bad: "high" }, { label: `Santé · ${GAME.age(s)} ans`, v: s.stats.sante }];
B.sideFacts = s => [["Abonnés", MM(s.stats.abonnes)], ["Vues par mois", MM(s.stats.vues)], ["Trésorerie", MS(s.stats.tresorerie)], ["Vidéos publiées", s.videos.length], ["Fatigue", Math.round(s.stats.fatigue)], ["Stress", Math.round(s.stats.stress)]];
B.alerts = s => { const o = { general: [], studio: [], business: [] }; if (!s.prod && s.rank !== "retire") o.studio.push("Aucune vidéo en tournage : l’algorithme oublie vite."); if (s.stats.equipe < 40) o.studio.push("L’équipe est à bout."); if (s.stats.badbuzz >= 65) o.general.push("Une polémique menace d’éclater."); if (s.stats.tresorerie < 0) o.business.push("La trésorerie est négative."); return o; };
B.badges = (s, c) => ({ general: c.view !== "general" && (c.flagGeneral || c.al.general.length > 0), studio: c.view !== "studio" && c.al.studio.length > 0, medias: c.view !== "medias" && c.newsNew, business: c.view !== "business" && c.al.business.length > 0, messages: c.unread > 0 });
B.upcoming = s => { const out = []; if (s.prod) out.push({ d: addDays(s.date, s.prod.w * 7), t: `Sortie prévue : ${s.prod.title}`, k: "Vidéo" }); for (const x of s.deferred) out.push({ d: x.date, t: x.title, k: "Conséquence attendue" }); const y = parseD(s.date).y; for (const b of B.bizList) if (!s.biz[b.id] && b.year === y + 1) out.push({ d: `${b.year}-01-01`, t: `Devient possible : ${b.label}`, k: "Business", approx: true }); const nx = [1, 10, 50, 100, 200, 300, 500, 1000].find(n => n > s.stats.abonnes); if (nx && s.stats.vues > 0) { const mo = (nx - s.stats.abonnes) / Math.max(.0001, s.stats.vues * .0018 * (s.stats.reputation / 70) / (1 + s.stats.abonnes / 150)) / 2.5; if (mo < 60) out.push({ d: addDays(s.date, Math.round(mo * 30)), t: `Cap des ${nx} million${nx > 1 ? "s" : ""} d’abonnés, au rythme actuel`, k: "Chaîne", approx: true }); } return out.sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8); };
B.opinions = s => [["Réputation auprès du public", s.stats.reputation], ["Faveur de l’algorithme", s.stats.algo]];
B.newsFx = (s, cat, sign) => { const v = sign * (cat === "rum" ? .4 : .7); s.stats.reputation = clamp(s.stats.reputation + v, 0, 100); return { k: "du public", v }; };

B.boards = { studio: s => { const blk = (t, b) => `<div class="panel"><h2>${t}</h2>${b}</div>`; const last = s.videos.slice(-10).reverse();
  return `<div class="kpi four"><div><small>Abonnés</small><b>${MM(s.stats.abonnes)}</b></div><div><small>Vues par mois</small><b>${MM(s.stats.vues)}</b></div><div><small>Vidéos publiées</small><b>${s.videos.length}</b></div><div><small>Équipe</small><b>${esc(B.teams[s.team][0])}</b></div><div><small>Meilleure vidéo</small><b>${s.videos.length ? MM(Math.max(...s.videos.map(v => v.views))) : "—"}</b></div><div><small>Dons cumulés</small><b>${MS(s.dons)}</b></div></div>`
    + blk("En production", s.prod ? `<div class="res w"><small>${esc(TYPES[s.prod.type].label)} · ${esc(B.regionName(s.prod.lieu))} · budget ${MS(s.prod.budget)}</small><span>« ${esc(s.prod.title)} » : sortie dans ${s.prod.w} semaine${s.prod.w > 1 ? "s" : ""}.</span></div>` : s.rank === "retire" ? `<span class="note">Vous ne tournez plus.</span>` : `<p class="note" style="margin:0 0 8px">Aucun tournage en cours. Choisissez un type, un concept, un titre, une miniature et un budget : le public jugera.</p><button class="btn primary" data-do="char|video" style="min-height:56px;font-size:1rem">Créer une vidéo</button>`)
    + blk("Dernières vidéos", last.length ? `<div class="tbl">${last.map(v => `<div><span>${esc(v.title)} <small class="note">· ${esc(TYPES[v.type].label)} · ${esc(frMonth(v.d))}</small></span><span>${MM(v.views)} · ×${v.mult.toFixed(1).replace(".", ",")}</span></div>`).join("")}</div>` : `<span class="note">Aucune vidéo publiée dans cette partie.</span>`); } };

const lv = (...n) => v => n[v];
const live = (id, label, min, max, step, fmt, extra) => s => ({ k: "slider", act: "pol", arg: id, label, min, max, step, val: s.pol[id], fmt, live: v => { const old = s.pol[id]; s.pol[id] = +v; const b = B.budget(s); const ex = extra ? extra(s, +v) : ""; s.pol[id] = old; return `${ex}${ex ? " · " : ""}solde mensuel ${sg(b.solde, 2)} M $`; } });
const note = (id, label, min, max, step, fmt, txt) => s => ({ k: "slider", act: "pol", arg: id, label, min, max, step, val: s.pol[id], fmt, live: v => txt(s, +v) });
B.panels = [
  { id: "equipe", label: "Équipe et studio", cond: s => true, blocks: s => [

    { k: "btn", act: "embaucher", label: "Agrandir l’équipe", cost: s.team >= 4 ? "Taille maximale" : `${B.teams[s.team + 1][0]} · ${MS(B.teams[s.team + 1][1])} par mois`, dis: (s.team >= 4 && "Taille maximale") || (s.stats.tresorerie < B.teams[Math.min(4, s.team + 1)][1] * 3 && "Trésorerie insuffisante (trois mois de salaires)") },
    { k: "btn", act: "licencier", label: "Réduire l’équipe", cost: "Moral −10", dis: s.team <= 0 && "Vous êtes déjà seul", confirm: true },

    live("salaires", "Niveau des salaires", 80, 130, 5, v => v + " %", (s, v) => `moral visé ${sg((v - 100) * .6)}`)(s),

  { id: "sponsors", label: "Sponsors", cond: s => true, blocks: s => [
