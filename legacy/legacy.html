<title>Legacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout : une "salle de commandement" en trois colonnes (vie privée · tableau de bord · relations),
   qui se replie en onglets sur téléphone. Chaque personnage repeint les jetons via une classe de thème. */
:root{
  --bg:#0f1316; --bg2:#151b1f; --panel:#1a2125; --panel2:#222b30;
  --ink:#eee6d4; --muted:#a9a292; --faint:#746e61; --line:rgba(238,230,212,.13);
  --accent:#c9a24a; --accent-ink:#1b1507; --accent2:#9b2f35;
  --good:#86b06f; --warn:#d8aa46; --bad:#d0583f;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:6px; --sea:#0e2230;
  color-scheme:dark;
}
/* Thème Empire : vert impérial, or des abeilles, cramoisi des tentures */
.theme-empire{
  --bg:#0c1611; --bg2:#112017; --panel:#15261d; --panel2:#1b3025;
  --ink:#f0e8d5; --muted:#b0a88f; --faint:#7a7461; --line:rgba(207,165,73,.2);
  --accent:#d2a74b; --accent-ink:#1c1505; --accent2:#9a2633; --sea:#0c1f2b;
}
/* Thème Stade : nuit de match, projecteurs, rouge du maillot */
.theme-stade{
  --bg:#0a1119; --bg2:#0f1823; --panel:#131e2b; --panel2:#1a2838;
  --ink:#eef2f6; --muted:#9fadbd; --faint:#6c7a8a; --line:rgba(159,173,189,.2);
  --accent:#f2c14e; --accent-ink:#1a1405; --accent2:#c8102e; --sea:#0c1a29;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
.theme-stade h1,.theme-stade h2,.theme-stade h3,.theme-stade .blk-h,.theme-stade .legend-title{font-weight:600;letter-spacing:.06em}
.theme-stade .st-home{fill:#c8102e} .theme-stade .st-vassal{fill:#4d6a8a} .theme-stade .st-allie{fill:#2f9a63} .theme-stade .st-paix{fill:#33465c}
.theme-stade .map-legend .st-home{background:#c8102e} .theme-stade .map-legend .st-vassal{background:#4d6a8a} .theme-stade .map-legend .st-allie{background:#2f9a63} .theme-stade .map-legend .st-paix{background:#33465c}
.theme-stade .bub.me{background:#1d5a8a}
/* Thème Maison-Blanche : bleu nuit, ivoire, rouge du drapeau */
.theme-maison{
  --bg:#0b1020; --bg2:#10172b; --panel:#141d35; --panel2:#1b2644;
  --ink:#f1ece0; --muted:#a8afc2; --faint:#727a92; --line:rgba(168,175,194,.2);
  --accent:#e8c874; --accent-ink:#1a1405; --accent2:#b22234; --sea:#0d1730;
}
.theme-maison .st-home{fill:#e8c874} .theme-maison .map-legend .st-home{background:#e8c874}
.st-s5{fill:#b3282d} .st-s4{fill:#d77b72} .st-s3{fill:#8d8872} .st-s2{fill:#6f98c9} .st-s1{fill:#2f5fa8} .st-tendu{fill:#c08a3e}
.map-legend .st-s5{background:#b3282d} .map-legend .st-s4{background:#d77b72} .map-legend .st-s3{background:#8d8872} .map-legend .st-s2{background:#6f98c9} .map-legend .st-s1{background:#2f5fa8} .map-legend .st-tendu{background:#c08a3e}
.map-switch{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.map-switch button{min-height:44px;padding:0 .9em;border:1px solid var(--line);border-radius:99px;background:rgba(0,0,0,.55);color:var(--ink);font-family:var(--f-ui);font-size:.8rem;font-weight:600}
.map-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.map-legend{max-width:calc(100% - 210px)}
/* Thème Studio : nuit violette, néons rose et cyan */
.theme-studio{
  --bg:#100a1f; --bg2:#160e2a; --panel:#1b1233; --panel2:#251a45;
  --ink:#f3effa; --muted:#b1a6cc; --faint:#7d7399; --line:rgba(177,166,204,.2);
  --accent:#ff5fae; --accent-ink:#22061a; --accent2:#3ad0ff; --sea:#150d2b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
.theme-studio h1,.theme-studio h2,.theme-studio h3,.theme-studio .blk-h,.theme-studio .legend-title{font-weight:600;letter-spacing:.05em}
.theme-studio .st-home{fill:#ff5fae} .theme-studio .st-allie{fill:#3ad0ff} .theme-studio .st-vassal{fill:#7fd69a} .theme-studio .st-paix{fill:#3a2d5e}
.theme-studio .map-legend .st-home{background:#ff5fae} .theme-studio .map-legend .st-allie{background:#3ad0ff} .theme-studio .map-legend .st-vassal{background:#7fd69a} .theme-studio .map-legend .st-paix{background:#3a2d5e}
.theme-studio .pin circle{fill:#fff} .theme-studio .bub.me{background:#7a2f8f}
/* Thème Magie : nuit indigo, lueur de bougie */
.theme-magie{
  --bg:#0c0d1f; --bg2:#12142b; --panel:#171a36; --panel2:#20244a;
  --ink:#f1ecdd; --muted:#aeb0cf; --faint:#777a9e; --line:rgba(174,176,207,.2);
  --accent:#f0c35a; --accent-ink:#231a04; --accent2:#9fb4ff; --sea:#0e1026;
}
.theme-magie .st-home{fill:#f0c35a} .theme-magie .st-allie{fill:#6f86d6} .theme-magie .st-vassal{fill:#3b4480} .theme-magie .st-paix{fill:#23274a} .theme-magie .st-guerre{fill:#7a3050}
.theme-magie .map-legend .st-home{background:#f0c35a} .theme-magie .map-legend .st-allie{background:#6f86d6} .theme-magie .map-legend .st-vassal{background:#3b4480} .theme-magie .map-legend .st-paix{background:#23274a} .theme-magie .map-legend .st-guerre{background:#7a3050}
.theme-magie .pin circle{fill:#f0c35a} .theme-magie .pin text{fill:#231a04} .theme-magie .bub.me{background:#3b4480}
/* Agenda de la semaine */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.cal .cd{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:5px 6px 6px;display:flex;flex-direction:column;gap:4px;min-height:62px;min-width:0}
.cal .cd.past{opacity:.55}
.cal .cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel2)}
.cal .cw{font-family:var(--f-ui);font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.cal .cw b{color:var(--ink);font-size:.86rem}
.cal .rv{display:flex;align-items:center;gap:5px;min-height:30px;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--bg2);padding:3px 6px;font-family:var(--f-ui);font-size:.74rem;line-height:1.15;color:var(--ink)}
.cal .rv .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cal .rv .ic{flex:none;color:var(--accent);font-size:.85rem}
.cal .rv.k-hist,.cal .rv.k-match{border-color:var(--accent)}
.cal .rv.done{opacity:.55}
.cal .rv.done .ic{color:var(--good)}
.cal-next{display:none;font-family:var(--f-ui);font-size:.8rem;color:var(--muted);margin-top:4px}
.cal-next b{color:var(--accent)}
.advance{display:flex;gap:6px}.advance .btn{min-height:44px;white-space:nowrap}
@media (max-width:760px){.advance{order:5;flex:1 1 100%}.advance .btn{flex:1}}
.rdv-extra{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.rdv-extra .btn{min-height:44px}
@media (max-width:760px){
  .cal{gap:3px}.cal .cd{padding:4px 3px;min-height:52px;align-items:center}.cal .cw{font-size:.62rem;text-align:center}
  .cal .rv{justify-content:center;padding:2px;min-height:26px}.cal .rv .tt{display:none}.cal-next{display:block}
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:.04em;text-wrap:balance;margin:0}
.ui{font-family:var(--f-ui)}
.label{font-family:var(--f-ui);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px}
.btn{font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.86rem;
  border:1px solid var(--line);background:var(--panel2);padding:.6em 1em;border-radius:var(--r);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{font-size:.74rem;padding:.45em .7em}

/* ---------- Écran titre ---------- */
.title-hero{display:grid;gap:10px;padding-block:28px 18px;text-align:left}
.logo{font-family:var(--f-display);font-size:clamp(3rem,9vw,6.4rem);line-height:.9;letter-spacing:.18em;font-weight:700;
  background:linear-gradient(180deg,#f3e3b0,#b88d36 70%,#7d5a1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:1.15rem;max-width:60ch;color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.card-char{min-height:44px}
.mode{font-family:var(--f-ui);border:1px solid var(--line);border-radius:99px;padding:.4em 1em;background:transparent;font-size:.9rem}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode .soon{font-size:.72rem;opacity:.7;margin-left:.4em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card-char{position:relative;text-align:left;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);padding:0;display:grid;grid-template-rows:auto 1fr}
.card-char .art{height:170px;display:grid;place-items:center;background:var(--art,#223)}
.card-char .art svg{height:150px;width:auto}
.card-char .body{padding:12px 14px 14px;display:grid;gap:4px}
.card-char h3{font-size:1.1rem}
.card-char .role{font-size:.92rem;color:var(--muted)}
.card-char.locked{opacity:.55;cursor:default}
.card-char:not(.locked):hover{border-color:var(--accent);transform:translateY(-2px)}
.card-char{transition:transform .2s,border-color .2s}
.badge{position:absolute;top:10px;right:10px;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:.25em .6em;border-radius:99px}
.title-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.disclaimer{margin-top:26px;font-size:.88rem;color:var(--faint);max-width:75ch}

/* ---------- Écran de départ ---------- */
.setup{display:grid;gap:22px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start;padding-block:12px}
.setup .portrait-lg svg{width:100%;height:auto;max-width:320px}
.starts{display:grid;gap:12px}
.start{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;text-align:left;display:grid;gap:6px}
.start:hover,.start[aria-pressed="true"]{border-color:var(--accent)}
.start[aria-pressed="true"]{background:var(--panel2)}
.start .yr{font-family:var(--f-display);font-size:1.5rem;color:var(--accent)}
.start h3{font-size:1.05rem}
.slot-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-pick select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.45em .6em;color:var(--ink);font-family:var(--f-ui)}
@media (max-width:760px){.setup{grid-template-columns:1fr}.setup .portrait-lg{max-width:220px}}

/* ---------- Jeu : tableau de bord pensé pour iPad en paysage ---------- */
body.in-game{overflow:hidden}
body.in-game #app{height:100%;display:flex;flex-direction:column}
.topbar{flex:none;border-bottom:1px solid var(--line);padding:8px 0}
.topbar-in{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.who h1{font-size:1.02rem;white-space:nowrap}
.who .rank{font-family:var(--f-ui);font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.clock{display:flex;flex-direction:column;line-height:1.15;margin-left:auto;text-align:right}
.clock .date{font-family:var(--f-display);font-size:1.05rem;color:var(--accent);white-space:nowrap}
.clock .age{font-family:var(--f-ui);color:var(--muted);font-size:.78rem;white-space:nowrap}
.speed{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.speed button{background:transparent;border:0;border-right:1px solid var(--line);font-family:var(--f-ui);font-weight:600;min-width:44px;min-height:44px}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.agir{display:flex;align-items:center;gap:8px}
.agir .btn{min-height:44px;font-size:1rem;padding:.5em 1.4em}
.agir .count{font-family:var(--f-ui);font-size:.76rem;color:var(--muted);line-height:1.2;max-width:92px}
.agir .count b{display:block;color:var(--ink);font-size:.95rem}
.icon-btn{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:transparent;font-family:var(--f-ui);font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 .6em}
.icon-btn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.icon-btn:hover{border-color:var(--accent)}
.tick-bar{height:2px;background:var(--line);margin-top:6px}
.tick-bar i{display:block;height:100%;width:0;background:var(--accent)}

.game{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr) 400px;gap:12px;padding-block:12px}
.col{min-height:0;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.panel h2,.blk-h{font-family:var(--f-display);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:500}
.col-left{display:grid;gap:10px;align-content:start}
.idcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.idcard svg{width:64px;height:auto;display:block}
.idcard .place{font-family:var(--f-ui);font-size:.82rem;color:var(--muted)}
.idcard .status{display:inline-block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:.1em .6em;margin-top:3px}
.gauges{display:grid;gap:9px}
.gauge{display:grid;gap:3px;min-width:0}
.gauge .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gauge .name{font-family:var(--f-ui);font-size:.86rem;font-weight:500}
.gauge .val{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:.9rem}
.trend{font-size:.72rem;margin-left:3px}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)}
.bar{position:relative;display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .35s ease}
.lvl-good{background:var(--good)} .lvl-warn{background:var(--warn)} .lvl-bad{background:var(--bad)}
.cond-chip{display:inline-block;font-family:var(--f-ui);font-size:.76rem;padding:.15em .55em;border-radius:99px;background:rgba(208,88,63,.18);color:#f0a390;margin:2px 4px 0 0}
.mini{font-family:var(--f-ui);font-size:.84rem;display:grid;gap:4px}
.mini div{display:flex;justify-content:space-between;gap:8px}
.mini span:first-child{color:var(--muted)}

.col-mid{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mapbox{position:relative;flex:1;min-height:180px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sea)}
.map-svg{width:100%;height:100%;display:block}
.sea{fill:var(--sea)} .sea-lines path{fill:none;stroke:rgba(255,255,255,.07);stroke-width:2}
.rg{stroke:var(--sea);stroke-width:2.5;cursor:pointer;transition:filter .15s;outline:none}
.rg:hover,.rg:focus-visible{filter:brightness(1.25)} .rg.sel{stroke:var(--accent);stroke-width:4}
.st-home{fill:#2f5fa8} .st-annexe{fill:#3f73bd} .st-vassal{fill:#6f98c9} .st-occupe{fill:#8177b5} .st-allie{fill:#4f9a84} .st-paix{fill:#8d8872} .st-guerre{fill:#a8463a}
.rg-l{font-family:var(--f-ui);font-size:18px;font-weight:600;fill:#f4eedd;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3.5px;pointer-events:none}
.pin{cursor:pointer;outline:none} .pin circle{fill:var(--accent);stroke:#1b1507;stroke-width:2} .pin text{font-family:var(--f-ui);font-size:13px;font-weight:700;fill:#1b1507;pointer-events:none}
.pin.moving circle{stroke-dasharray:3 3;fill:#e9d59a} .pin.sel circle{stroke:#fff;stroke-width:3.5} .pin:focus-visible circle{stroke:#fff}
.map-legend{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px);pointer-events:none}
.map-legend span{font-family:var(--f-ui);font-size:.68rem;background:rgba(0,0,0,.55);padding:.15em .5em;border-radius:99px;display:flex;gap:5px;align-items:center}
.map-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.map-info{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,16,13,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;max-height:70%;overflow:auto}
.map-info h3{font-size:1rem} .map-info .ops{display:flex;gap:6px;flex-wrap:wrap}
.map-info .x{position:absolute;top:2px;right:2px;min-width:44px;min-height:44px;background:none;border:0;font-size:1.2rem}
.feed{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;max-height:46%}
.feed-h{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 12px;background:none;border:0;text-align:left;width:100%}
.feed-h .label{flex:none;color:var(--accent)} .feed-h .last{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem;flex:1}
.feed-h .chev{flex:none;font-family:var(--f-ui);color:var(--muted)}
.feed-list{overflow:auto;padding:0 12px 12px;display:grid;gap:10px}
.feed.closed .feed-list{display:none}
.news{display:grid;gap:1px;border-left:2px solid var(--line);padding-left:10px;font-size:.92rem}
.news .m{font-family:var(--f-ui);font-size:.72rem;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.news b{font-weight:600} .news.good{border-left-color:var(--good)} .news.bad{border-left-color:var(--bad)} .news.key{border-left-color:var(--accent)}
.ai-status{font-family:var(--f-ui);font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn);animation:pulse 1.2s infinite} .dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

.col-right{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ptabs{display:flex;flex-direction:column;border-right:1px solid var(--line);overflow:auto;background:var(--bg2)}
.ptabs button{min-height:46px;background:transparent;border:0;border-bottom:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:.86rem;letter-spacing:.03em;text-align:left;padding:0 10px;color:var(--muted)}

/* ---------- Fenêtres ---------- */
.scene{position:relative;overflow:hidden;aspect-ratio:1200/330;max-width:100%;background:#000}

.realbox{border-left:2px solid var(--accent);padding:6px 0 6px 12px;font-size:.95rem;color:var(--muted)}
.realbox b{color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.loading{display:grid;gap:10px;justify-items:start}
.quill{width:42px;height:42px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
textarea.json{width:100%;min-height:180px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);font-family:ui-monospace,Menlo,monospace;font-size:.8rem;padding:8px}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.slot .meta{min-width:0}
.slot .meta b{font-family:var(--f-ui);font-weight:600}
.slot .meta div{font-size:.86rem;color:var(--muted);font-family:var(--f-ui)}
.slot .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);font-family:var(--f-ui);font-weight:600;padding:.6em 1.1em;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--f-ui);border-top:1px solid var(--line);padding-top:10px}
.setting select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:.4em .5em;font-family:var(--f-ui)}

.modal.wide{width:min(1000px,100%)}
.btn{min-height:44px}
.btn.small{min-height:36px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{min-height:44px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:0 1em;font-family:var(--f-ui);font-size:.9rem}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea.write{width:100%;min-height:150px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);font-family:var(--f-body);font-size:1.05rem;line-height:1.5;padding:10px 12px;resize:vertical}
.advice{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:rgba(0,0,0,.18);display:grid;gap:6px;font-size:.95rem}
.advice ul{margin:0;padding-left:1.1em;font-family:var(--f-ui);font-size:.86rem;color:var(--muted)}
.advice h4{margin:4px 0 0;font-family:var(--f-ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.refusal{border-left:3px solid var(--bad);padding:6px 0 6px 12px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.res-grid h4{margin:0 0 6px;font-family:var(--f-ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.comment{font-size:.92rem;border-top:1px solid var(--line);padding:5px 0}
.comment small{display:block;font-family:var(--f-ui);color:var(--faint);font-size:.74rem}
.later{font-family:var(--f-ui);font-size:.86rem;color:var(--muted)}
.bt{gap:10px}
.bt-forces{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-ui)}
.bt-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.bt-cell{position:relative;min-height:84px;border-radius:6px;padding:3px;display:grid;align-content:end;background:rgba(255,255,255,.03);border:1px dashed transparent}
.bt-cell.f{background:rgba(168,70,58,.13)} .bt-cell.m{background:rgba(47,95,168,.16)}
.bt-cell.front{padding-top:16px}
.bt-cell.m.front{margin-top:10px} .bt-cell.back{min-height:64px;opacity:.92}
.bt-cell small{position:absolute;top:2px;left:5px;font-family:var(--f-ui);font-size:.64rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.bt-cell.t-colline,.bt-cell.t-village,.bt-cell.t-bois,.bt-cell.t-riviere{border-color:var(--line)}
.bt-unit{display:grid;gap:1px;width:100%;text-align:left;border-radius:5px;border:1px solid var(--line);padding:4px 5px;font-family:var(--f-ui);font-size:.72rem;line-height:1.2;min-height:56px;color:var(--ink)}
.bt-unit.m{background:#234a82} .bt-unit.f{background:#7a342b;opacity:1;cursor:default}
.bt-unit.sel{outline:2px solid var(--accent);outline-offset:1px}
.bt-unit b{font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .bt-unit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.bt-unit em{font-style:normal;color:#f3dfa8;font-weight:600} .bt-unit .bar{height:4px}
.bt-orders{display:grid;gap:6px}
.bt-ord{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bt-ord .btn{padding:.4em .3em;font-size:.76rem}
@media (max-width:560px){.bt-ord{grid-template-columns:repeat(2,minmax(0,1fr))}.bt-unit span:not(.num):not(.bar){display:none}}

/* ---------- Fin de partie ---------- */
.end-hero{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px;align-items:center;padding-block:24px 10px}
.end-hero .portrait svg{max-width:240px;filter:grayscale(.35)}
.legend-title{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.6rem);line-height:1;color:var(--accent);letter-spacing:.06em}
.epitaph{font-size:1.12rem;max-width:62ch}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.vs div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.vs b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--ink)}
.vs small{font-family:var(--f-ui);color:var(--muted)}
.frise{display:grid;gap:0;margin-top:10px}
.frise-h{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.frise-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.frise-row .when{font-family:var(--f-ui);color:var(--accent);font-weight:600}
.frise-row h3{font-size:1rem;margin-bottom:4px}
.frise-row .you,.frise-row .real{font-size:.95rem;min-width:0}
.frise-row .tag{display:inline-block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.15em .5em;border-radius:99px;margin-bottom:4px}
.tag.same{background:rgba(134,176,111,.18);color:#b6d9a3}
.tag.diff{background:rgba(208,88,63,.2);color:#f0a390}
.tag.none{background:rgba(238,230,212,.08);color:var(--muted)}
.anec{font-size:.88rem;color:var(--faint);font-style:italic;margin-top:4px}
@media (max-width:760px){
  .end-hero{grid-template-columns:1fr}
  .end-hero .portrait svg{max-width:170px}
  .frise-h{display:none}
  .frise-row{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  eraNotes: {
    1796: "Directoire. Première coalition (Autriche, Grande-Bretagne, Piémont). Campagne d’Italie : Lodi, Arcole. Mariage avec Joséphine.",
    1797: "Rivoli, traité de Campoformio avec l’Autriche. Bonaparte rentre à Paris auréolé de gloire ; coup d’État du 18 fructidor.",
    1798: "Expédition d’Égypte, bataille des Pyramides, destruction de la flotte à Aboukir par Nelson. Loi Jourdan sur la conscription.",
    1799: "Siège d’Acre manqué, peste à Jaffa. Retour en France, coup d’État du 18 Brumaire, Consulat. Deuxième coalition.",
    1800: "Création de la Banque de France et des préfets. Marengo. Attentat de la rue Saint-Nicaise. Hohenlinden (Moreau).",
    1801: "Paix de Lunéville avec l’Autriche. Concordat avec Pie VII. Assassinat du tsar Paul Ier, avènement d’Alexandre Ier.",
    1802: "Paix d’Amiens avec l’Angleterre. Légion d’honneur. Consulat à vie. Création des lycées. Expédition de Saint-Domingue.",
    1803: "Rupture de la paix d’Amiens. Vente de la Louisiane aux États-Unis. Camp de Boulogne. Exil de Madame de Staël.",
    1804: "Complot de Cadoudal. Exécution du duc d’Enghien. Code civil. Proclamation de l’Empire, maréchalat, Sacre.",
    1805: "Troisième coalition. Ulm, Trafalgar, Austerlitz, traité de Presbourg.",
    1806: "Confédération du Rhin, fin du Saint-Empire. Iéna et Auerstaedt. Blocus continental (décret de Berlin).",
    1807: "Eylau, Friedland, traités de Tilsit avec Alexandre. Création du duché de Varsovie.",
    1808: "Soulèvement de Madrid (Dos de Mayo), Joseph roi d’Espagne, capitulation de Bailén. Entrevue d’Erfurt.",
    1809: "Disgrâce de Talleyrand. Aspern-Essling (mort de Lannes), Wagram. Annexion des États pontificaux, Pie VII arrêté. Divorce.",
    1810: "Mariage avec Marie-Louise. Annexion de la Hollande. Masséna arrêté devant Torres Vedras par Wellington.",
    1811: "Naissance du roi de Rome. Crise économique et disette. L’Empire atteint 130 départements.",
    1812: "Campagne de Russie : la Moskova, incendie de Moscou, retraite, Bérézina. Conspiration Malet à Paris.",
    1813: "Sixième coalition. Lützen, Bautzen, Dresde, puis défaite de Leipzig. Wellington victorieux à Vitoria.",
    1814: "Campagne de France. Paris capitule. Abdication à Fontainebleau, exil à l’île d’Elbe. Restauration de Louis XVIII. Congrès de Vienne.",
    1815: "Cent-Jours. Waterloo. Seconde abdication, reddition aux Anglais, départ pour Sainte-Hélène.",

    1818: "Sainte-Hélène : isolement croissant, départ du médecin O’Meara.",
    1819: "Sainte-Hélène : arrivée du médecin Antommarchi ; Napoléon jardine à Longwood.",

  events: [
    { id: "italie", date: "1796-04-10", until: "1796-07-01", title: "Franchir les Alpes ligures", place: "Savone, Riviera ligure", scene: "italie", people: ["berthier", "murat"],
      text: "L’armée d’Italie piétine depuis des mois sur la côte. Face à vous, deux armées alliées : les Piémontais de Colli et les Autrichiens de Beaulieu. Vos soldats n’ont ni souliers ni solde, mais ils sont aguerris. Le Directoire vous demande surtout de nourrir l’armée sur le pays… et d’envoyer de l’argent à Paris.",
      real: "Bonaparte frappe à la jonction des deux armées : Montenotte (12 avril), Millesimo, Mondovi. Le Piémont signe l’armistice de Cherasco le 28 avril 1796.",
      anecdote: "Sa proclamation à l’armée promettait « les plaines les plus fertiles du monde » ; son authenticité exacte est discutée, elle fut probablement réécrite plus tard à Sainte-Hélène.",
      choices: [
        { t: "Frapper vite à la jonction des Piémontais et des Autrichiens", hist: true, res: "Vous séparez les deux armées et battez les Piémontais coup sur coup.",

        { t: "Attendre les renforts promis par le Directoire", res: "Les renforts n’arrivent qu’au compte-gouttes. L’armée s’impatiente.", fx: { s: { moral: -12, popularite: -6, coalition: 5, armee: 6 } } },
        { t: "Laisser les soldats se nourrir sur le pays sans attaquer", res: "Le pillage nourrit l’armée mais soulève les villages.", fx: { s: { moral: 8, tresor: 10, popularite: -4, loyaute: -6 } } }
      ] },
    { id: "arcole", date: "1796-11-15", until: "1797-02-01", cond: s => !s.flags.noItaly, title: "Le pont d’Arcole", place: "Marais de l’Adige, près de Vérone", scene: "bataille", people: ["murat", "berthier"],
      text: "Les Autrichiens d’Alvinczy marchent pour délivrer Mantoue. Pour les prendre à revers, il faut franchir l’Alpone sur un étroit pont de bois balayé par la mitraille. Deux assauts ont échoué. Les grenadiers hésitent ; vos officiers vous regardent.",
      real: "Bonaparte saisit un drapeau et s’élance sur le pont. L’assaut échoue, il tombe dans un fossé marécageux et manque d’être pris. La bataille est gagnée le troisième jour par la manœuvre.",
      anecdote: "Son aide de camp Jean-Baptiste Muiron meurt en le couvrant de son corps. Bonaparte rentrera d’Égypte trois ans plus tard à bord d’une frégate baptisée La Muiron.",
      choices: [
        { t: "Saisir le drapeau et mener soi-même l’assaut sur le pont", hist: true, res: "Vous vous jetez en avant sous la mitraille, drapeau en main.",
