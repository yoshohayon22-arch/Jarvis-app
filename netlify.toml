# Configuration Netlify : sans ce fichier, Netlify publie le dépôt tel quel sans construire l'app.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Adaptateur Next.js de Netlify (rendu serveur, proxy, routes /auth). Version non figée : Netlify la met à jour.
[[plugins]]
  package = "@netlify/plugin-nextjs"
