<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QG Jarvis</title>
<meta name="description" content="Le quartier général des agents IA de Jarvis : un open space où chaque pôle travaille sur les vraies tâches du quotidien.">
<meta name="theme-color" content="#05080f">
<style>
  :root{
    --bg:#05080f; --panel:#0c121d; --panel2:#111a29; --line:#1d2a3f;
    --text:#e3e9f3; --muted:#8796ad; --neon:#00d4ff; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0a1220,#05080f)}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:#334155;box-shadow:none;transition:.4s}
  body.on .brand .dot{background:var(--neon);box-shadow:0 0 12px var(--neon)}
  .brand h1{font-size:18px;margin:0;letter-spacing:.5px}
  .brand h1 span{color:var(--neon)}
  .brand small{color:var(--muted);display:block;font-size:12px}
  .clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);min-width:118px}
  .clock b{color:var(--text);font-size:18px}
  .speed{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .speed button{background:transparent;color:var(--muted);border:0;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px}
  .speed button.sel{background:var(--panel2);color:var(--neon)}
  #power{border:1px solid var(--neon);background:transparent;color:var(--neon);padding:9px 16px;border-radius:999px;
    font:inherit;font-weight:600;cursor:pointer;transition:.25s;letter-spacing:.3px}
  #power:hover{background:rgba(0,212,255,.1)}
  body.on #power{background:var(--neon);color:#001018;box-shadow:0 0 18px rgba(0,212,255,.55)}

  main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;padding:14px 16px;align-items:start}
  .stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b0f17}
  canvas{display:block;width:100%;cursor:default}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .kpi{flex:1 1 120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--muted)}

  aside{display:flex;flex-direction:column;gap:12px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .card h2 em{font-style:normal;color:var(--neon);text-transform:none;letter-spacing:0}
  #agentCard .empty{color:var(--muted);font-size:13px}
  .ag-head{display:flex;gap:10px;align-items:center}
  .ag-av{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid #fff3}
  .ag-head b{display:block}
  .ag-head small{color:var(--muted)}
  .ag-now{margin-top:10px;font-size:13px}
  .bar{height:6px;background:#1b2536;border-radius:9px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--neon);width:0;transition:width .3s}
  .ag-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}

  form{display:flex;flex-direction:column;gap:8px}
  select,input,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
  textarea{resize:vertical;min-height:58px}
  .btn{background:var(--neon);color:#001018;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  .switch{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.35}
  .switch input{width:auto;margin-top:2px}
  .ai-state{font-size:12px;padding:2px 8px;border-radius:99px;background:#1b2536;color:var(--muted)}
  .ai-state.ok{background:rgba(34,197,94,.15);color:var(--ok)}

  .poles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pole{display:flex;gap:7px;align-items:center;font-size:12px;background:var(--panel2);border-radius:8px;padding:6px 8px;min-width:0}
  .pole i{width:9px;height:9px;border-radius:3px;flex:none}
  .pole span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .pole b{font-variant-numeric:tabular-nums}

  #log{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:12.5px}
  #log li{padding:5px 0;border-bottom:1px dashed #1a2537;color:#c4cede}
  #log li time{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
  #log li i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}
  #deliv{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
  #deliv li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
  #deliv li:hover{background:var(--panel2)}
  #deliv li i{width:8px;height:8px;border-radius:2px;flex:none}
  #deliv li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:10.5px;padding:2px 6px;border-radius:99px;background:#1b2536;color:var(--muted);flex:none}
  .tag.ai{background:rgba(0,212,255,.14);color:var(--neon)}
  .tag.run{background:rgba(245,158,11,.15);color:var(--warn)}
  .tag.err{background:rgba(239,68,68,.15);color:#f87171}
  .empty-note{color:var(--muted);font-size:13px}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:min(680px,92vw);width:680px;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-h{padding:14px 16px;border-bottom:1px solid var(--line)}
  .dlg-h b{display:block;font-size:16px}
  .dlg-h small{color:var(--muted)}
  #dlgBody{white-space:pre-wrap;padding:14px 16px;max-height:60vh;overflow:auto;font-size:14px;line-height:1.55;margin:0;font-family:inherit}
  .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}

  @media (max-width:980px){ main{grid-template-columns:1fr} }
  @media (max-width:520px){
    header{padding:10px 16px} main{padding:12px 16px}
    .brand small{display:none} .clock{min-width:0}
    .kpi{flex-basis:96px;padding:8px 10px} .kpi b{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="dot"></div>
    <div><h1>QG <span>Jarvis</span></h1><small>Le quartier général de tes agents IA</small></div>
  </div>
  <div class="clock" id="clock"><b>--:--</b> · veille</div>
  <div class="speed" id="speed">
    <button data-s="1" class="sel">×1</button><button data-s="2">×2</button><button data-s="4">×4</button>
  </div>
  <button id="power">Activer le QG</button>
</header>

<main>
  <section>
    <div class="stage"><canvas id="office" aria-label="Open space du QG"></canvas></div>
    <div class="kpis">
      <div class="kpi"><b id="kAgents">0</b><span>agents présents</span></div>
      <div class="kpi"><b id="kDone">0</b><span>tâches terminées</span></div>
      <div class="kpi"><b id="kCalls">0</b><span>appels passés</span></div>
      <div class="kpi"><b id="kPrints">0</b><span>pages imprimées</span></div>
      <div class="kpi"><b id="kCoffee">0</b><span>cafés</span></div>
    </div>
  </section>

  <aside>
    <div class="card" id="agentCard">
      <h2>Agent</h2>
      <div class="empty">Clique sur un agent dans l'open space pour voir ce qu'il fait.</div>
    </div>

    <div class="card">
      <h2>Confier une tâche <span class="ai-state" id="aiState">IA : simulation</span></h2>
      <form id="assign">
        <select id="aPole"></select>
        <textarea id="aTask" placeholder="Ex. : Rédige une candidature spontanée pour une librairie aux Eaux-Vives" required></textarea>
        <label class="switch"><input type="checkbox" id="realAll">
          <span>Exécuter aussi les tâches de routine avec l'IA (consomme des crédits API). Tes tâches à toi passent toujours par l'IA quand elle est connectée.</span></label>
        <button class="btn" type="submit">Confier au pôle</button>
      </form>
    </div>

    <div class="card"><h2>Pôles <em id="poleSum"></em></h2><div class="poles" id="poles"></div></div>
    <div class="card"><h2>Livrables</h2><ul id="deliv"></ul></div>
    <div class="card"><h2>Fil d'activité</h2><ul id="log"></ul></div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dlg-h"><b id="dlgTitle"></b><small id="dlgMeta"></small></div>
  <pre id="dlgBody"></pre>
  <div class="dlg-f"><button class="btn ghost" id="dlgCopy">Copier</button><button class="btn" id="dlgClose">Fermer</button></div>
</dialog>

<script>
(() => {
'use strict';

/* ======================================================================
   Monde
   ====================================================================== */
const W = 1200, H = 660, CELL = 10, COLS = W / CELL, ROWS = H / CELL, R = 9;
const DOOR = { x: 420, y: H - 22 };
const API = (location.protocol.startsWith('http') ? '' : 'http://localhost:5000');

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ----------------------------------------------------------------------
   Les pôles et leurs vraies tâches du quotidien
   Étapes : type (rédaction), web (recherche), call (appel), print
   (impression), meeting (salle de réunion), tour (tour des pôles)
   ---------------------------------------------------------------------- */
const POLES = [
  { id: 'direction', name: 'Direction', full: 'Direction · Jarvis', color: '#38bdf8', cx: 140, cy: 170,
    agents: [
      { name: 'Jarvis', role: "Chef d'orchestre", skin: '#c8d6e5', hair: '#00d4ff', jarvis: true },
      { name: 'Clara', role: 'Assistante de direction', skin: '#f1c7a5', hair: '#3b2416' },
    ],
    calls: ['On cale les priorités du jour ?', 'Je te mets ça dans l’agenda', 'Point rapide à 14h ?'],
    tasks: [
      { t: 'Préparer le brief de la journée', s: ['type', 'print'] },
      { t: 'Faire le tour des pôles', s: ['tour'] },
      { t: 'Planifier la semaine : agenda et priorités', s: ['type', 'meeting'] },
      { t: 'Trier la boîte mail et lister les réponses à faire', s: ['web', 'type'] },
    ] },
  { id: 'candidatures', name: 'Candidatures', full: 'Pôle Candidatures', color: '#f59e0b', cx: 420, cy: 170,
    agents: [
      { name: 'Hugo', role: 'Chasseur d’offres', skin: '#e0ac69', hair: '#1f1309' },
      { name: 'Inès', role: 'Rédactrice de lettres', skin: '#8d5524', hair: '#0d0806' },
      { name: 'Malik', role: 'Chargé de relances', skin: '#c68642', hair: '#120c08' },
    ],
    calls: ['Bonjour, je vous appelle pour ma candidature…', 'Le poste à temps partiel est-il toujours ouvert ?', 'Je peux passer déposer mon CV ?', 'Merci, je vous renvoie ça par mail'],
    tasks: [
      { t: 'Repérer 5 offres d’emploi étudiant à temps partiel à Genève', s: ['web', 'type'] },
      { t: 'Rédiger une candidature spontanée pour un commerce des Eaux-Vives', s: ['type', 'print'] },
      { t: 'Relancer les candidatures restées sans réponse', s: ['call', 'type'] },
      { t: 'Mettre à jour le CV (maturité fédérale obtenue)', s: ['type', 'print'] },
      { t: 'Préparer les réponses types pour un entretien', s: ['type', 'call'] },
      { t: 'Redéposer une candidature sur WhatsApp quand le mail n’est plus lu', s: ['web', 'call'] },
    ] },
  { id: 'admin', name: 'Administratif', full: 'Pôle Administratif', color: '#a78bfa', cx: 700, cy: 170,
    agents: [
      { name: 'Paul', role: 'Démarches & état civil', skin: '#f1c27d', hair: '#6b4423' },
      { name: 'Sofia', role: 'Dossiers & archivage', skin: '#ffdbac', hair: '#a0522d' },
    ],
    calls: ['Service de l’état civil ? Bonjour…', 'Quelles pièces faut-il fournir ?', 'Le dossier est-il complet ?', 'Je vous envoie l’attestation par mail'],
    tasks: [
      { t: 'Demander l’attestation et l’acte de naissance', s: ['type', 'call'] },
      { t: 'Relancer le service administratif sans réponse', s: ['call', 'type'] },
      { t: 'Scanner et classer les documents reçus', s: ['print', 'type'] },
      { t: 'Préparer le dossier de pièces justificatives', s: ['type', 'print'] },
    ] },
  { id: 'reseaux', name: 'Réseaux MCI', full: 'Pôle Réseaux · MCI Sport', color: '#f43f5e', cx: 140, cy: 455,
    agents: [
      { name: 'Léa', role: 'Rédactrice LinkedIn', skin: '#ffdbac', hair: '#e6be8a' },
      { name: 'Noah', role: 'Créateur de Reels', skin: '#c68642', hair: '#1a1a1a' },
      { name: 'Emma', role: 'Analyste des stats', skin: '#f1c27d', hair: '#4a2c17' },
    ],
    calls: ['On valide le post avec le club ?', 'Tu peux m’envoyer les photos du match ?', 'Le Reel sort demain 18h', 'On tague qui sur LinkedIn ?'],
    tasks: [
      { t: 'Rédiger le post LinkedIn de la semaine pour MCI Sport', s: ['type', 'meeting'] },
      { t: 'Écrire le script d’un Reel Instagram', s: ['type', 'web'] },
      { t: 'Analyser les stats des derniers posts', s: ['web', 'type', 'print'] },
      { t: 'Programmer les publications de la semaine', s: ['type'] },
      { t: 'Répondre aux commentaires et aux DM', s: ['type', 'call'] },
    ] },
  { id: 'stage', name: 'Stage Liège', full: 'Pôle Stage · Standard de Liège', color: '#22c55e', cx: 420, cy: 455,
    agents: [
      { name: 'Tom', role: 'Logistique', skin: '#e0ac69', hair: '#2b1a0e' },
      { name: 'Jade', role: 'Planning & programme', skin: '#8d5524', hair: '#140a05' },
    ],
    calls: ['Les chambres sont confirmées pour le groupe ?', 'Le car part à quelle heure ?', 'On a le terrain de 10h à 12h ?', 'Il me faut la liste des joueurs'],
    tasks: [
      { t: 'Construire le planning du stage de préparation', s: ['type', 'meeting', 'print'] },
      { t: 'Appeler l’hébergement pour confirmer les chambres', s: ['call'] },
      { t: 'Organiser le transport de l’équipe', s: ['call', 'type'] },
      { t: 'Préparer la feuille de route des joueurs', s: ['type', 'print'] },
    ] },
  { id: 'etudes', name: 'Études', full: 'Pôle Études', color: '#14b8a6', cx: 700, cy: 455,
    agents: [
      { name: 'Yanis', role: 'Recherche d’écoles', skin: '#f1c27d', hair: '#000' },
      { name: 'Chloé', role: 'Tutrice de révision', skin: '#ffdbac', hair: '#8b4513' },
    ],
    calls: ['Quelle est la date limite d’inscription ?', 'Le programme est-il en français ?', 'Combien coûte l’année ?', 'Faut-il un entretien d’admission ?'],
    tasks: [
      { t: 'Comparer des écoles : programmes, prix, délais', s: ['web', 'type'] },
      { t: 'Vérifier les dates limites d’admission', s: ['web', 'call'] },
      { t: 'Créer une fiche de révision', s: ['type', 'print'] },
      { t: 'Générer un quiz de révision', s: ['type'] },
    ] },
];

const SHIRTS = ['#0f172a'];
POLES.forEach(p => {
  p.seats = [
    { x: p.cx - 42, y: p.cy - 60, up: false }, { x: p.cx + 42, y: p.cy - 60, up: false },
    { x: p.cx - 42, y: p.cy + 60, up: true },  { x: p.cx + 42, y: p.cy + 60, up: true },
  ];
  p.custom = []; p.done = 0; p.last = null;
});

/* ----------------------------------------------------------------------
   Obstacles et grille de déplacement
   ---------------------------------------------------------------------- */
const obstacles = [];
const ob = (x, y, w, h) => obstacles.push({ x, y, w, h });
// murs extérieurs (porte en bas)
ob(0, 0, W, 8); ob(0, 0, 8, H); ob(W - 8, 0, 8, H);
ob(0, H - 8, DOOR.x - 30, 8); ob(DOOR.x + 30, H - 8, W - DOOR.x - 30, 8);
// îlots de bureaux
POLES.forEach(p => ob(p.cx - 82, p.cy - 42, 164, 84));
// cuisine
ob(880, 8, 312, 44);
// imprimante
const PRINTER = { x: 872, y: 250, w: 46, h: 44 };
ob(PRINTER.x, PRINTER.y, PRINTER.w, PRINTER.h);
// salon
const SOFA = { x: 1070, y: 222, w: 112, h: 34 }, TABLE = { x: 1092, y: 278, w: 68, h: 26 };
ob(SOFA.x, SOFA.y, SOFA.w, SOFA.h); ob(TABLE.x, TABLE.y, TABLE.w, TABLE.h);
// salle de réunion (porte à gauche)
const MR = { x: 890, y: 380, w: W - 8 - 890, h: H - 8 - 380, doorY0: 466, doorY1: 534 };
ob(MR.x, MR.y, MR.w, 6); ob(MR.x, MR.y, 6, MR.doorY0 - MR.y); ob(MR.x, MR.doorY1, 6, H - MR.doorY1);
const MTABLE = { x: 965, y: 452, w: 160, h: 76 };
ob(MTABLE.x, MTABLE.y, MTABLE.w, MTABLE.h);
// plantes
const PLANTS = [[30, 30], [850, 30], [30, 630], [850, 610], [600, 630], [250, 630]];
PLANTS.forEach(([x, y]) => ob(x - 12, y - 12, 24, 24));

const blocked = new Uint8Array(COLS * ROWS);
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
  for (const o of obstacles) {
    if (x > o.x - R && x < o.x + o.w + R && y > o.y - R && y < o.y + o.h + R) { blocked[r * COLS + c] = 1; break; }
  }
}
const cellOf = (x, y) => [clamp(Math.floor(x / CELL), 0, COLS - 1), clamp(Math.floor(y / CELL), 0, ROWS - 1)];
const free = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !blocked[r * COLS + c];
function nearestFree(c, r) {
  if (free(c, r)) return [c, r];
  for (let d = 1; d < 30; d++) for (let dc = -d; dc <= d; dc++) for (let dr = -d; dr <= d; dr++) {
    if (Math.max(Math.abs(dc), Math.abs(dr)) === d && free(c + dc, r + dr)) return [c + dc, r + dr];
  }
  return [c, r];
}
function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 4);
  for (let i = 0; i <= n; i++) {
    const [c, r] = cellOf(ax + (bx - ax) * i / n, ay + (by - ay) * i / n);
    if (!free(c, r)) return false;
  }
  return true;
}
function findPath(ax, ay, bx, by) {
  const [sc, sr] = nearestFree(...cellOf(ax, ay)), [gc, gr] = nearestFree(...cellOf(bx, by));
  const start = sr * COLS + sc, goal = gr * COLS + gc;
  const g = new Float32Array(COLS * ROWS).fill(Infinity), from = new Int32Array(COLS * ROWS).fill(-1);
  const closed = new Uint8Array(COLS * ROWS);
  const heap = [[0, start]];
  const push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  const h = (c, r) => { const dx = Math.abs(c - gc), dy = Math.abs(r - gr); return dx + dy - 0.586 * Math.min(dx, dy); };
  g[start] = 0;
  while (heap.length) {
    const [, cur] = pop();
    if (cur === goal) break;
    if (closed[cur]) continue; closed[cur] = 1;
    const cc = cur % COLS, cr = (cur / COLS) | 0;
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
      if (!dc && !dr) continue;
      const nc = cc + dc, nr = cr + dr;
      if (!free(nc, nr)) continue;
      if (dc && dr && (!free(cc + dc, cr) || !free(cc, cr + dr))) continue;
      const ni = nr * COLS + nc, ng = g[cur] + (dc && dr ? 1.414 : 1);
      if (ng < g[ni]) { g[ni] = ng; from[ni] = cur; push(ng + h(nc, nr), ni); }
    }
  }
  const pts = [];
  if (from[goal] === -1 && goal !== start) return [{ x: bx, y: by }];
  for (let i = goal; i !== -1 && i !== start; i = from[i]) pts.push({ x: (i % COLS) * CELL + CELL / 2, y: ((i / COLS) | 0) * CELL + CELL / 2 });
  pts.reverse();
  pts.push({ x: bx, y: by });
  // lissage (string pulling)
  const out = []; let ox = ax, oy = ay, k = 0;
  while (k < pts.length) {
    let j = pts.length - 1;
    while (j > k && !los(ox, oy, pts[j].x, pts[j].y)) j--;
    out.push(pts[j]); ox = pts[j].x; oy = pts[j].y; k = j + 1;
  }
  return out;
}

/* ----------------------------------------------------------------------
   Équipements partagés (file d'attente)
   ---------------------------------------------------------------------- */
const AMEN = {
  coffee:  { label: 'machine à café', queue: true, slots: [{ x: 930, y: 74 }, { x: 905, y: 104 }, { x: 932, y: 116 }, { x: 958, y: 104 }], users: [] },
  water:   { label: 'fontaine', queue: true, slots: [{ x: 1030, y: 74 }, { x: 1055, y: 104 }, { x: 1028, y: 116 }], users: [] },
  printer: { label: 'imprimante', queue: true, slots: [{ x: 936, y: 272 }, { x: 962, y: 300 }, { x: 962, y: 244 }], users: [] },
  sofa:    { label: 'canapé', queue: false, slots: [{ x: 1096, y: 246 }, { x: 1126, y: 246 }, { x: 1156, y: 246 }], users: [] },
  meeting: { label: 'salle de réunion', queue: false, slots: [
    { x: 985, y: 438 }, { x: 1045, y: 438 }, { x: 1105, y: 438 }, { x: 985, y: 542 }, { x: 1045, y: 542 }, { x: 1105, y: 542 }, { x: 950, y: 490 }, { x: 1140, y: 490 }], users: [] },
};
Object.values(AMEN).forEach(a => { a.users = new Array(a.slots.length).fill(null); a.busy = 0; });
const release = (a) => Object.values(AMEN).forEach(m => m.users.forEach((u, i) => { if (u === a) m.users[i] = null; }));

/* ======================================================================
   État du QG
   ====================================================================== */
const HQ = {
  active: false, light: 0, speed: 1, minutes: 9 * 60, day: 1,
  done: 0, calls: 0, prints: 0, coffees: 0, ai: false, realAll: false,
  deliverables: [], particles: [], selected: null, hover: null,
};
const timeStr = () => { const m = Math.floor(HQ.minutes) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };

/* ======================================================================
   Actions
   ====================================================================== */
const Act = {
  walk: (x, y, o = {}) => ({ kind: 'walk', start(a) { a.anim = o.anim || 'idle'; if (o.label) a.doing = o.label; a.goTo(x, y); }, update(a, dt) { if (o.tick) o.tick(a, dt); return !a.moving; } }),
  wait: (dur, anim, o = {}) => ({ kind: 'wait', t: 0, start(a) { a.anim = anim; if (o.label) a.doing = o.label; if (o.face != null) a.face = o.face; o.onStart && o.onStart(a); },
    update(a, dt) { this.t += dt; o.tick && o.tick(a, dt, this.t / dur); if (o.work) a.stepFrac = Math.max(a.stepFrac, (o.work[0] + Math.min(1, this.t / dur)) / o.work[1]); if (this.t >= dur) { o.onEnd && o.onEnd(a); return true; } return false; } }),
  fn: f => ({ kind: 'fn', start(a) { f(a); }, update() { return true; } }),
  amenity: (id, dur, anim, o = {}) => ({ kind: 'amenity', id, phase: 'go', t: 0, slot: -1,
    start(a) {
      const m = AMEN[id];
      let s = m.users.indexOf(null);
      if (s === -1) { this.phase = 'skip'; return; }
      this.slot = s; m.users[s] = a; a.anim = 'idle'; a.doing = o.label || `Va vers la ${m.label}`;
      a.goTo(m.slots[s].x, m.slots[s].y);
    },
    update(a, dt) {
      const m = AMEN[id];
      if (this.phase === 'skip') return true;
      if (this.phase === 'go') {
        if (a.moving) return false;
        if (m.queue && this.slot !== 0) { this.phase = 'queue'; a.doing = `Fait la queue à la ${m.label}`; a.anim = 'idle'; return false; }
        this.phase = 'use'; this.t = 0; a.anim = anim; a.doing = o.label || `À la ${m.label}`; if (m.queue) m.busy++; o.onStart && o.onStart(a); return false;
      }
      if (this.phase === 'queue') {
        if (!m.users[0]) { m.users[this.slot] = null; this.slot = 0; m.users[0] = a; this.phase = 'go'; a.goTo(m.slots[0].x, m.slots[0].y); }
        return false;
      }
      this.t += dt; o.tick && o.tick(a, dt, this.t / dur);
      if (o.work) a.stepFrac = Math.max(a.stepFrac, (o.work[0] + Math.min(1, this.t / dur)) / o.work[1]);
      if (this.t >= dur) { if (m.queue) m.busy = Math.max(0, m.busy - 1); m.users[this.slot] = null; a.anim = 'idle'; o.onEnd && o.onEnd(a); return true; }
      return false;
    } }),
};

/* ======================================================================
   Agents
   ====================================================================== */
class Agent {
  constructor(pole, i, def) {
    Object.assign(this, def);
    this.pole = pole; this.seat = pole.seats[i]; this.id = pole.id + i;
    this.x = DOOR.x; this.y = H + 30; this.visible = false; this.inside = false;
    this.queue = []; this.act = null; this.path = []; this.moving = false;
    this.task = null; this.stepIdx = 0; this.stepFrac = 0;
    this.energy = rnd(55, 100); this.hold = null; this.holdT = 0;
    this.anim = 'idle'; this.bubble = null; this.face = 0; this.walkT = 0;
    this.doing = 'Pas encore arrivé'; this.speed = rnd(62, 78); this.done = 0; this.papers = 0;
    this.shirt = def.jarvis ? '#0b3b52' : shade(pole.color, -0.35);
  }
  goTo(x, y) { this.path = findPath(this.x, this.y, x, y); this.moving = this.path.length > 0; }
  say(text, dur = 3.2) { this.bubble = { text, t: dur, max: dur }; }
  update(dt) {
    if (this.bubble && (this.bubble.t -= dt) <= 0) this.bubble = null;
    if (this.hold && (this.holdT -= dt) <= 0) this.hold = null;
    if (this.moving) {
      let step = this.speed * dt;
      while (step > 0 && this.path.length) {
        const p = this.path[0], dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy);
        if (d > 0.01) this.face = Math.atan2(dy, dx);
        if (d <= step) { this.x = p.x; this.y = p.y; this.path.shift(); step -= d; }
        else { this.x += dx / d * step; this.y += dy / d * step; step = 0; }
      }
      this.walkT += dt * 9;
      if (!this.path.length) this.moving = false;
    }
    if (this.inside && this.anim !== 'relax' && this.anim !== 'coffee') this.energy -= dt * (this.anim === 'idle' ? 0.6 : 1.4);
    if (!this.act) {
      if (!this.queue.length) this.queue = plan(this);
      this.act = this.queue.shift();
      if (this.act) this.act.start(this);
    }
    if (this.act && this.act.update(this, dt)) this.act = null;
  }
  get progress() { return this.task ? (this.stepIdx + this.stepFrac) / this.task.steps.length : 0; }
  get seated() { return !this.moving && Math.hypot(this.x - this.seat.x, this.y - this.seat.y) < 2; }
}
const faceSeat = s => (s.up ? -Math.PI / 2 : Math.PI / 2);
const AGENTS = [];
POLES.forEach(p => p.agents.forEach((d, i) => { const a = new Agent(p, i, d); p.members = p.members || []; p.members.push(a); AGENTS.push(a); }));

/* ----------------------------------------------------------------------
   Planification : le "cerveau" de chaque agent
   ---------------------------------------------------------------------- */
function plan(a) {
  if (!HQ.active) return [];
  if (!a.task) startTask(a);
  if (a.energy < 28) return planBreak(a);
  if (Math.random() < 0.07) return planChat(a);
  return planStep(a);
}

function startTask(a) {
  const p = a.pole;
  let t;
  if (p.custom.length) t = p.custom.shift();
  else {
    const pool = p.tasks.filter(x => x.t !== p.last) ;
    const tpl = pick(pool.length ? pool : p.tasks); p.last = tpl.t;
    t = { title: tpl.t, steps: tpl.s.slice(), custom: false };
  }
  t.started = timeStr();
  a.task = t; a.stepIdx = 0; a.stepFrac = 0; a.stats = { calls: 0, prints: 0, meetings: 0 };
  log(a, `${a.name} commence : ${t.title}`);
}

function planStep(a) {
  const step = a.task.steps[a.stepIdx], s = a.seat, f = faceSeat(s), p = a.pole;
  const back = Act.walk(s.x, s.y, { label: 'Retourne à son bureau' });
  const L = [];
  const sit = (dur, anim, label, work, extra = {}) => Act.wait(dur, anim, Object.assign({ face: f, label, work }, extra));
  switch (step) {
    case 'type':
      L.push(back, sit(rnd(9, 14), 'type', `Rédige : ${a.task.title}`, [0, 1], { onStart: x => Math.random() < .5 && x.say('✍️ Je rédige…') }));
      break;
    case 'web':
      L.push(back, sit(rnd(8, 12), 'web', `Recherche en ligne : ${a.task.title}`, [0, 1], { onStart: x => x.say('🔎 Je cherche…') }));
      break;
    case 'call': {
      const line = pick(p.calls);
      const onStart = x => { HQ.calls++; x.stats.calls++; x.say('📞 ' + line, 4); };
      if (Math.random() < 0.4) {
        const spot = pick([{ x: rnd(240, 320), y: rnd(250, 330) }, { x: rnd(520, 600), y: rnd(250, 330) }, { x: rnd(240, 760), y: rnd(560, 610) }]);
        L.push(back, sit(2.5, 'call', 'Au téléphone', [0, 3], { onStart }),
          Act.walk(spot.x, spot.y, { anim: 'call', label: 'Fait les cent pas au téléphone' }),
          Act.wait(rnd(3, 5), 'call', { work: [1, 3], onStart: x => x.say('📞 ' + pick(p.calls), 3.5) }),
          Act.walk(s.x, s.y, { anim: 'call', label: 'Au téléphone' }),
          sit(2.5, 'call', 'Raccroche', [2, 3], { onEnd: x => x.say('👍 Merci, au revoir !', 2) }));
      } else {
        L.push(back, sit(rnd(8, 12), 'call', 'Au téléphone', [0, 1], { onStart, tick: (x, dt, k) => { if (k > .55 && !x._c2) { x._c2 = 1; x.say('📞 ' + pick(p.calls), 3.5); } }, onEnd: x => { x._c2 = 0; } }));
      }
      break;
    }
    case 'print':
      L.push(back, sit(rnd(4, 6), 'type', 'Prépare le document à imprimer', [0, 2], { onEnd: x => x.say('🖨️ J’imprime !', 2) }),
        Act.amenity('printer', 3.2, 'print', { label: 'Va à l’imprimante', work: [1, 2], onEnd: x => { x.hold = 'paper'; x.holdT = 60; HQ.prints += 2; x.stats.prints += 2; } }),
        back, Act.fn(x => { x.hold = null; x.papers = Math.min(4, x.papers + 1); }));
      break;
    case 'meeting':
      L.push(Act.amenity('meeting', rnd(9, 13), 'meeting', { label: 'En réunion', work: [0, 1], onStart: x => { x.stats.meetings++; x.say('💬 On fait le point ?'); } }), back);
      break;
    case 'tour': {
      const others = POLES.filter(q => q !== p);
      others.slice(0, 3 + Math.floor(Math.random() * 2)).forEach((q, k, arr) => {
        const target = { x: q.cx, y: q.cy + (Math.random() < .5 ? -95 : 95) };
        L.push(Act.walk(target.x, target.y, { label: `Passe voir le ${q.full}` }),
          Act.wait(2.8, 'chat', { work: [k, arr.length], onStart: x => { x.say(pick(['Où en êtes-vous ?', 'Besoin de quelque chose ?', 'Super boulot 👏', 'On priorise ça ?'])); const m = q.members.find(y => y.inside); m && setTimeout(() => m.say(pick(['Ça avance !', 'Presque fini 💪', 'On envoie ce soir', 'Tout roule'])), 1200 / HQ.speed); } }));
      });
      L.push(back);
      break;
    }
  }
  L.push(Act.fn(nextStep));
  return L;
}

function nextStep(a) {
  if (!a.task) return;
  a.stepIdx++; a.stepFrac = 0;
  if (a.stepIdx >= a.task.steps.length) completeTask(a);
}

function planBreak(a) {
  const s = a.seat, r = Math.random();
  const back = Act.walk(s.x, s.y, { label: 'Retourne à son bureau' });
  if (r < 0.55) {
    return [Act.amenity('coffee', 4, 'coffee', { label: 'Pause café ☕', onStart: x => { x.say('☕ Un petit café…'); HQ.coffees++; }, onEnd: x => { x.hold = 'coffee'; x.holdT = 40; x.energy = 100; } }),
      ...(Math.random() < .4 ? [Act.wait(3, 'chat', { label: 'Discute à la machine à café', onStart: x => x.say(pick(['Tu as vu le dernier post ?', 'Grosse journée aujourd’hui', 'Il est bon ce café', 'On mange ensemble ?'])) })] : []),
      back];
  }
  if (r < 0.8) return [Act.amenity('water', 3, 'drink', { label: 'Va boire de l’eau', onEnd: x => { x.energy = Math.max(x.energy, 80); } }), back];
  return [Act.amenity('sofa', rnd(6, 9), 'relax', { label: 'Souffle 5 minutes sur le canapé', onStart: x => x.say('😌 Pause'), onEnd: x => { x.energy = 100; } }), back];
}

function planChat(a) {
  const mates = AGENTS.filter(b => b !== a && b.inside && b.seated && b.anim !== 'call');
  if (!mates.length) return planStep(a);
  const b = pick(mates), off = b.seat.up ? 24 : -24;
  return [Act.walk(b.seat.x + (b.seat.x < b.pole.cx ? -20 : 20), b.seat.y + off, { label: `Va voir ${b.name}` }),
    Act.wait(4, 'chat', { label: `Discute avec ${b.name}`, onStart: x => { x.say(pick(['Tu peux relire ça ?', 'Besoin d’un coup de main ?', 'Tu as le contact ?', 'J’ai fini la relance 👍'])); setTimeout(() => b.say(pick(['Je regarde ça', 'Oui, envoie !', 'Top, merci', 'Dans 5 min'])), 1500 / HQ.speed); } }),
    Act.walk(a.seat.x, a.seat.y, { label: 'Retourne à son bureau' })];
}

/* ----------------------------------------------------------------------
   Arrivée / départ
   ---------------------------------------------------------------------- */
function arrive() {
  AGENTS.forEach((a, i) => {
    a.queue = []; a.act = null; release(a);
    const delay = a.jarvis ? 0.2 : 0.8 + i * rnd(0.7, 1.1);
    if (a.inside) { a.queue = [Act.walk(a.seat.x, a.seat.y)]; return; }
    a.queue = [
      Act.wait(delay, 'hidden', { label: 'Arrive au bureau' }),
      Act.fn(x => { x.x = DOOR.x + rnd(-10, 10); x.y = H + 14; x.visible = true; x.inside = true; }),
      Act.walk(a.seat.x, a.seat.y, { label: 'Arrive et rejoint son bureau', onStart: null }),
      Act.wait(1.2, 'idle', { face: faceSeat(a.seat), onStart: x => x.say(x.jarvis ? 'Bonjour à tous. Au travail !' : pick(['Bonjour !', 'Salut tout le monde', 'Hello 👋', 'Bonne journée !']), 2.5) }),
    ];
  });
}
function leave() {
  AGENTS.forEach((a, i) => {
    a.queue = []; a.act = null; release(a); a.hold = null;
    if (!a.inside) return;
    a.queue = [
      Act.wait(rnd(0, 2), 'idle', { label: 'Range ses affaires', onStart: x => Math.random() < .5 && x.say(pick(['À demain !', 'Bonne soirée', 'Je file'])) }),
      Act.walk(DOOR.x, H - 14, { label: 'Rentre à la maison' }),
      Act.walk(DOOR.x, H + 20),
      Act.fn(x => { x.visible = false; x.inside = false; x.doing = 'Hors du bureau'; }),
    ];
  });
  Object.values(AMEN).forEach(m => { m.users.fill(null); m.busy = 0; });
}

/* ======================================================================
   Livrables (et exécution réelle via l'IA)
   ====================================================================== */
const LS_KEY = 'jarvis-hq-livrables';
try { HQ.deliverables = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { HQ.deliverables = []; }
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(HQ.deliverables.slice(0, 60))); } catch (e) {} };

function completeTask(a) {
  const t = a.task, p = a.pole;
  a.task = null; a.done++; p.done++; HQ.done++;
  a.say('✅ Terminé !', 2.5);
  const d = { id: Date.now() + Math.random(), title: t.title, pole: p.id, agent: a.name, time: `J${HQ.day} ${timeStr()}`, status: 'sim', content: simulated(a, t) };
  HQ.deliverables.unshift(d);
  log(a, `${a.name} a terminé : ${t.title}`, true);
  if (HQ.ai && (t.custom || HQ.realAll)) {
    d.status = 'run';
    fetch(API + '/hq/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pole: p.id, agent: a.name, role: a.role, task: t.title }) })
      .then(r => r.json()).then(j => { if (j.answer) { d.content = j.answer; d.status = 'ai'; } else { d.status = 'err'; d.content = 'Erreur IA : ' + (j.error || 'inconnue') + '\n\n' + d.content; } })
      .catch(e => { d.status = 'err'; d.content = 'Serveur injoignable : ' + e.message + '\n\n' + d.content; })
      .finally(() => { save(); renderDeliv(); });
  }
  save(); renderDeliv();
}

function simulated(a, t) {
  const st = a.stats || {};
  const lines = [
    `Livrable — ${t.title}`,
    `Réalisé par ${a.name} (${a.role}, ${a.pole.full})`,
    `Commencé à ${t.started}, terminé à ${timeStr()}.`,
    '',
    'Ce que l’agent a fait :',
    ...t.steps.map(s => '• ' + ({ type: 'Rédaction du document', web: 'Recherche et collecte d’informations', call: 'Appels téléphoniques', print: 'Impression et classement', meeting: 'Réunion de validation', tour: 'Tour des pôles et arbitrage des priorités' })[s]),
  ];
  if (st.calls) lines.push(`• ${st.calls} appel(s) passé(s)`);
  if (st.prints) lines.push(`• ${st.prints} page(s) imprimée(s)`);
  lines.push('', HQ.ai
    ? 'Tâche de routine en simulation. Coche « Exécuter aussi les tâches de routine avec l’IA » pour obtenir le vrai contenu.'
    : 'Mode simulation : lance le serveur Jarvis (server.py avec OPENAI_API_KEY) et ouvre /hq pour que les agents rendent de vrais livrables.');
  return lines.join('\n');
}

function guessSteps(text) {
  const s = text.toLowerCase();
  if (/appel|appeler|téléphon|relanc|contacter/.test(s)) return ['call', 'type'];
  if (/imprim|dossier|\bcv\b|feuille|planning/.test(s)) return ['type', 'print'];
  if (/réunion|point|valider|brainstorm/.test(s)) return ['meeting', 'type'];
  if (/cherch|compar|trouv|repér|analys|veille/.test(s)) return ['web', 'type'];
  return ['type', 'type'];
}

const canvas = document.getElementById('office'), ctx = canvas.getContext('2d');

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

let T = 0;
function drawFloor() {
  ctx.fillStyle = '#e9e4da'; ctx.fillRect(0, 0, W, H);

  // tapis des pôles

  // zone détente

function drawPole(p) {
  // panneau
  ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
  const tw = ctx.measureText(p.full).width + 22, top = p.cy < 300;
  const ly = top ? p.cy - 104 : p.cy + 92;
  ctx.fillStyle = p.color; rrect(p.cx - tw / 2, ly, tw, 20, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(p.full, p.cx, ly + 14);

  [[-82, -42], [2, -42], [-82, 2], [2, 2]].forEach(([dx, dy]) => {
    ctx.fillStyle = 'rgba(0,0,0,.12)'; rrect(p.cx + dx + 2, p.cy + dy + 3, 80, 40, 4); ctx.fill();
    ctx.fillStyle = '#f7f3ec'; rrect(p.cx + dx, p.cy + dy, 80, 40, 4); ctx.fill();
    ctx.strokeStyle = '#cfc6b6'; ctx.lineWidth = 1; ctx.stroke();
  });
  ctx.fillStyle = alpha(p.color, .55); ctx.fillRect(p.cx - 82, p.cy - 1.5, 164, 3);
  // postes de travail
  p.seats.forEach((s, i) => {
    const a = p.members[i], up = s.up, my = up ? p.cy + 6 : p.cy - 24;
    // chaise
    ctx.fillStyle = '#3b4252'; ctx.beginPath(); ctx.arc(s.x, s.y + (up ? 4 : -4), 10, 0, 7); ctx.fill();
    // écran
    const sx = s.x - 17, sy = my, active = a && a.seated && ['type', 'web', 'call'].includes(a.anim);
    ctx.fillStyle = '#1f2633'; rrect(sx - 2, sy - 2, 38, 22, 3); ctx.fill();
    ctx.fillStyle = HQ.light > .3 && a && a.inside ? (active ? '#0b1726' : '#16202e') : '#0d1118'; ctx.fillRect(sx, sy, 34, 18);
    if (active) drawScreen(a, sx, sy);
    else if (a && a.inside) { ctx.fillStyle = alpha(p.color, .35 + .2 * Math.sin(T * 2 + i)); ctx.beginPath(); ctx.arc(sx + 17, sy + 9, 3, 0, 7); ctx.fill(); }
    // clavier
    ctx.fillStyle = '#c9ccd3'; ctx.fillRect(s.x - 11, up ? p.cy + 30 : p.cy - 36, 22, 6);
    // documents imprimés
    if (a) for (let k = 0; k < a.papers; k++) { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#bbb'; ctx.fillRect(s.x + 20 + k, (up ? p.cy + 10 : p.cy - 30) - k * 2, 14, 18); ctx.strokeRect(s.x + 20 + k, (up ? p.cy + 10 : p.cy - 30) - k * 2, 14, 18); }
    // tasse posée / plante
    if (i === 1 || i === 2) { ctx.fillStyle = '#4a7c59'; ctx.beginPath(); ctx.arc(s.x - 32, up ? p.cy + 30 : p.cy - 30, 5, 0, 7); ctx.fill(); }
  });
}

function drawScreen(a, x, y) {
  const c = a.pole.color;
  if (a.anim === 'type') {
    const off = (T * 12) % 4;
    for (let k = 0; k < 5; k++) { ctx.fillStyle = alpha(c, .9 - k * .12); ctx.fillRect(x + 3, y + 3 + k * 3 - off * .2, 6 + ((k * 7 + Math.floor(T * 3)) % 22), 1.6); }
    if (Math.floor(T * 3) % 2) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 28, y + 13, 2, 3); }
  } else if (a.anim === 'web') {
    ctx.fillStyle = '#334155'; ctx.fillRect(x, y, 34, 4);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(x + 2, y + 1, 18, 2);
    const sc = (T * 8) % 10;
    for (let k = 0; k < 3; k++) { ctx.fillStyle = alpha(c, .7); ctx.fillRect(x + 3, y + 6 + k * 4 - sc * .1, 10, 3); ctx.fillStyle = '#64748b'; ctx.fillRect(x + 15, y + 6 + k * 4, 16, 1.5); }
  } else {
    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(x + 17, y + 8, 4 + Math.sin(T * 6) * .8, 0, 7); ctx.fill();
    ctx.fillStyle = '#86efac'; ctx.font = '6px system-ui'; ctx.textAlign = 'center'; ctx.fillText('en appel', x + 17, y + 17);
  }
}

function drawAmenities() {
  // comptoir
  ctx.fillStyle = '#b9a88d'; ctx.fillRect(880, 8, 312, 44); ctx.fillStyle = '#cdbfa8'; ctx.fillRect(880, 8, 312, 6);
  // machine à café
  ctx.fillStyle = '#20242c'; rrect(912, 16, 36, 30, 4); ctx.fill();
  ctx.fillStyle = AMEN.coffee.busy ? '#f59e0b' : '#64748b'; ctx.beginPath(); ctx.arc(940, 24, 2.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(925, 36, 9, 8);
  label('Café', 930, 62);
  // fontaine
  ctx.fillStyle = '#e2e8f0'; rrect(1016, 14, 28, 32, 4); ctx.fill(); ctx.fillStyle = '#7dd3fc'; ctx.beginPath(); ctx.arc(1030, 26, 9, 0, 7); ctx.fill();
  label('Eau', 1030, 62);
  // frigo + micro-ondes
  ctx.fillStyle = '#f1f5f9'; rrect(1124, 12, 40, 36, 3); ctx.fill(); ctx.strokeStyle = '#94a3b8'; ctx.stroke(); ctx.fillStyle = '#94a3b8'; ctx.fillRect(1158, 20, 2, 12);
  ctx.fillStyle = '#334155'; rrect(1074, 18, 32, 22, 3); ctx.fill(); ctx.fillStyle = '#0f172a'; ctx.fillRect(1078, 22, 18, 14);
  // imprimante
  const P = PRINTER;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; rrect(P.x + 2, P.y + 3, P.w, P.h, 5); ctx.fill();
  ctx.fillStyle = '#e5e7eb'; rrect(P.x, P.y, P.w, P.h, 5); ctx.fill();
  ctx.fillStyle = '#9ca3af'; ctx.fillRect(P.x + 6, P.y + 6, P.w - 12, 8);
  ctx.fillStyle = AMEN.printer.busy && Math.floor(T * 6) % 2 ? '#22c55e' : '#475569'; ctx.beginPath(); ctx.arc(P.x + P.w - 8, P.y + P.h - 8, 3, 0, 7); ctx.fill();
  if (AMEN.printer.busy) { const k = (T * 1.5) % 1; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#cbd5e1'; ctx.fillRect(P.x + P.w - 2, P.y + 14, 12 * k + 2, 18); ctx.strokeRect(P.x + P.w - 2, P.y + 14, 12 * k + 2, 18); }
  label('Imprimante', P.x + P.w / 2, P.y - 8);
  // salon
  ctx.fillStyle = '#5b6ee1'; rrect(SOFA.x, SOFA.y, SOFA.w, SOFA.h, 10); ctx.fill();
  ctx.fillStyle = '#7584ea'; rrect(SOFA.x + 6, SOFA.y + 10, SOFA.w - 12, SOFA.h - 14, 7); ctx.fill();
  ctx.fillStyle = '#a07850'; rrect(TABLE.x, TABLE.y, TABLE.w, TABLE.h, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(TABLE.x + 10, TABLE.y + 8, 14, 10);
  label('Détente', SOFA.x + SOFA.w / 2, SOFA.y - 8);
  // réunion
  ctx.fillStyle = '#8b6b4a'; rrect(MTABLE.x, MTABLE.y, MTABLE.w, MTABLE.h, 30); ctx.fill();
  ctx.fillStyle = '#a3825f'; rrect(MTABLE.x + 6, MTABLE.y + 6, MTABLE.w - 12, MTABLE.h - 12, 26); ctx.fill();
  AMEN.meeting.slots.forEach(s => { ctx.fillStyle = '#3b4252'; ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, 7); ctx.fill(); });
  const inMeeting = AMEN.meeting.users.some(Boolean);
  ctx.fillStyle = '#111827'; ctx.fillRect(1180, 440, 6, 100);
  ctx.fillStyle = inMeeting && HQ.light > .3 ? '#38bdf8' : '#1f2937'; ctx.fillRect(1181, 444, 4, 92);
  ctx.strokeStyle = 'rgba(56,130,200,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(MR.x + 3, MR.y + 3); ctx.lineTo(W - 8, MR.y + 3); ctx.moveTo(MR.x + 3, MR.y); ctx.lineTo(MR.x + 3, MR.doorY0); ctx.moveTo(MR.x + 3, MR.doorY1); ctx.lineTo(MR.x + 3, H - 8); ctx.stroke();
  label('Salle de réunion', 1045, 400);
  // plantes
  PLANTS.forEach(([x, y]) => { ctx.fillStyle = '#8b5e3c'; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill(); ctx.fillStyle = '#3f8f4f'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 1.3) * 6, y + Math.sin(k * 1.3) * 6, 7, 0, 7); ctx.fill(); } });
}
function label(t, x, y) { ctx.font = '600 10px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#6b7280'; ctx.fillText(t, x, y); }

function drawAgent(a) {
  if (!a.visible) return;
  ctx.save(); ctx.translate(a.x, a.y); ctx.scale(1.3, 1.3); ctx.translate(-a.x, -a.y);
  drawAgentBody(a);
  ctx.restore();
}
function drawAgentBody(a) {
  const { x, y } = a, walking = a.moving, bob = walking ? Math.sin(a.walkT) * 1.2 : 0;
  const fy = Math.sin(a.face), fx = Math.cos(a.face), back = fy < -0.5;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, y + 9, 10, 4, 0, 0, 7); ctx.fill();
  if (walking) { ctx.fillStyle = '#1f2937'; const s = Math.sin(a.walkT) * 4;
    ctx.beginPath(); ctx.arc(x - 4 + fx * s, y + 7 + fy * s * .5, 2.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 4 - fx * s, y + 7 - fy * s * .5, 2.6, 0, 7); ctx.fill(); }
  if (a === HQ.selected || a === HQ.hover) { ctx.strokeStyle = a === HQ.selected ? '#00d4ff' : 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y + 6, 15, 7, 0, 0, 7); ctx.stroke(); }
  // corps
  ctx.fillStyle = a.shirt; ctx.beginPath(); ctx.ellipse(x, y + 1 + bob * .3, 10, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = a.pole.color; ctx.fillRect(x - 2, y - 4 + bob * .3, 4, 5);
  // mains (frappe au clavier)
  if (a.anim === 'type' || a.anim === 'web') { const j = Math.sin(T * 22) * 1.2, dy = a.seat.up ? -9 : 9;
    ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(x - 5, y + dy + j, 2.4, 0, 7); ctx.arc(x + 5, y + dy - j, 2.4, 0, 7); ctx.fill(); }
  // tête
  const hy = y - 7 + bob;
  if (a.jarvis) { ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 10; }
  ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(x, hy, 6.5, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = a.hair; ctx.beginPath();
  if (back) ctx.arc(x, hy, 6.8, 0, 7); else ctx.arc(x, hy - 1, 6.8, Math.PI * 1.02, Math.PI * 1.98);
  ctx.fill();
  if (a.jarvis && !back) { ctx.fillStyle = '#00d4ff'; ctx.fillRect(x - 4, hy, 8, 1.6); }
  // téléphone
  if (a.anim === 'call') { ctx.fillStyle = '#111827'; rrect(x + 5, hy - 3, 4, 8, 1.5); ctx.fill(); ctx.fillStyle = '#22c55e'; ctx.fillRect(x + 6, hy - 2, 2, 1); }
  // objets portés
  if (a.hold === 'coffee' || a.anim === 'coffee') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 10, y + 1, 3.6, 0, 7); ctx.fill(); ctx.fillStyle = '#6f4e37'; ctx.beginPath(); ctx.arc(x + 10, y + 1, 2.3, 0, 7); ctx.fill();
    if (Math.random() < .08) HQ.particles.push({ x: x + 10, y: y - 2, vy: -12, life: 1, c: 'rgba(255,255,255,' }); }
  if (a.hold === 'paper') { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.fillRect(x - 15, y - 3, 9, 12); ctx.strokeRect(x - 15, y - 3, 9, 12); }
  if (a.anim === 'drink') { ctx.fillStyle = '#bae6fd'; ctx.fillRect(x + 7, y - 3, 5, 7); }
  if (a.anim === 'relax') { ctx.fillStyle = '#334155'; ctx.font = '10px system-ui'; ctx.fillText('z', x + 10, hy - 8 - (T * 6 % 6)); }
  // nom
  if (a === HQ.selected || a === HQ.hover || (a.jarvis && HQ.light > .5)) {
    ctx.font = '700 10px system-ui'; ctx.textAlign = 'center';
    const w = ctx.measureText(a.name).width + 10;
    ctx.fillStyle = 'rgba(15,23,42,.85)'; rrect(x - w / 2, y + 14, w, 14, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(a.name, x, y + 24.5);
  }
}

function drawBubble(a) {
  if (!a.visible || !a.bubble) return;
  const b = a.bubble, k = Math.min(1, b.t * 3, (b.max - b.t) * 6);
  ctx.globalAlpha = Math.max(0, k);
  ctx.font = '600 11px system-ui'; ctx.textAlign = 'center';
  let text = b.text; while (ctx.measureText(text).width > 190 && text.length > 6) text = text.slice(0, -2);
  if (text !== b.text) text = text.slice(0, -1) + '…';
  const w = ctx.measureText(text).width + 16, bx = clamp(a.x - w / 2, 10, W - w - 10), by = a.y - 50;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = alpha(a.pole.color, .9); ctx.lineWidth = 1.5;
  rrect(bx, by, w, 20, 10); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x - 4, by + 20); ctx.lineTo(a.x, by + 28); ctx.lineTo(a.x + 4, by + 20); ctx.fill();
  ctx.fillStyle = '#0f172a'; ctx.fillText(text, bx + w / 2, by + 14);
  ctx.globalAlpha = 1;
}

function drawParticles(dt) {
  if (AMEN.coffee.busy && Math.random() < .3) HQ.particles.push({ x: 930 + rnd(-3, 3), y: 34, vy: -14, life: 1, c: 'rgba(255,255,255,' });
  HQ.particles = HQ.particles.filter(p => (p.life -= dt * .9) > 0);
  HQ.particles.forEach(p => { p.y += p.vy * dt; p.x += Math.sin(p.y * .3) * .2; ctx.fillStyle = p.c + (p.life * .6) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5 + (1 - p.life) * 2, 0, 7); ctx.fill(); });
}

function drawLights() {
  if (HQ.light >= 1) return;
  ctx.fillStyle = `rgba(4,7,14,${(1 - HQ.light) * .82})`; ctx.fillRect(0, 0, W, H);
  if (HQ.light < .05 && !AGENTS.some(a => a.visible)) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,212,255,.9)'; ctx.font = '700 26px system-ui';
    ctx.fillText('QG en veille', W / 2, H / 2 - 6);
    ctx.fillStyle = 'rgba(200,215,235,.75)'; ctx.font = '15px system-ui';
    ctx.fillText('Appuie sur « Activer le QG » : les agents arrivent et se mettent au travail.', W / 2, H / 2 + 22);
  }
}

/* ======================================================================
   Boucle
   ====================================================================== */
let lastT = performance.now(), uiT = 0;
function frame(now) {
  const raw = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const dt = raw * HQ.speed; T += raw;
  HQ.light = clamp(HQ.light + (HQ.active ? raw * .8 : -raw * .5), 0, 1);
  if (HQ.active) { HQ.minutes += dt * 2; if (HQ.minutes >= 19 * 60) { HQ.minutes = 9 * 60; HQ.day++; } }
  AGENTS.forEach(a => a.update(dt));

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawFloor(); drawAmenities(); POLES.forEach(drawPole);
  AGENTS.filter(a => a.visible).sort((a, b) => a.y - b.y).forEach(drawAgent);
  drawParticles(raw);
  AGENTS.forEach(drawBubble);
  drawLights();

  if ((uiT += raw) > .25) { uiT = 0; renderUI(); }
  requestAnimationFrame(frame);
}

/* ======================================================================
   Interface
   ====================================================================== */
const $ = id => document.getElementById(id);
const logEl = $('log'), delivEl = $('deliv');
function log(a, text, done) {
  const li = document.createElement('li');
  li.innerHTML = `<time>${timeStr()}</time><i style="background:${a.pole.color}"></i>`;
  li.appendChild(document.createTextNode((done ? '✅ ' : '') + text));
  logEl.prepend(li);
  while (logEl.children.length > 80) logEl.lastChild.remove();
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
const poleById = id => POLES.find(p => p.id === id) || POLES[0];

function renderDeliv() {
  if (!HQ.deliverables.length) { delivEl.innerHTML = '<li class="empty-note" style="cursor:default">Les documents produits par les agents arrivent ici.</li>'; return; }
  const TAG = { sim: ['simulé', ''], run: ['IA en cours…', 'run'], ai: ['IA', 'ai'], err: ['erreur', 'err'] };
  delivEl.innerHTML = HQ.deliverables.slice(0, 40).map((d, i) => {
    const [t, c] = TAG[d.status] || TAG.sim;
    return `<li data-i="${i}"><i style="background:${poleById(d.pole).color}"></i><span>${esc(d.title)}</span><em class="tag ${c}">${t}</em></li>`;
  }).join('');
}
delivEl.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  const d = HQ.deliverables[+li.dataset.i];
  $('dlgTitle').textContent = d.title;
  $('dlgMeta').textContent = `${d.agent} · ${poleById(d.pole).full} · ${d.time}`;
  $('dlgBody').textContent = d.content;
  $('dlg').showModal();
});
$('dlgClose').onclick = () => $('dlg').close();
$('dlgCopy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('dlgBody').textContent).then(() => { $('dlgCopy').textContent = 'Copié ✓'; setTimeout(() => $('dlgCopy').textContent = 'Copier', 1500); }); };

let lastCard = '';
function renderUI() {
  $('clock').innerHTML = HQ.active || AGENTS.some(a => a.visible) ? `<b>${timeStr()}</b> · jour ${HQ.day}` : `<b>--:--</b> · veille`;
  $('kAgents').textContent = AGENTS.filter(a => a.inside).length;
  $('kDone').textContent = HQ.done; $('kCalls').textContent = HQ.calls; $('kPrints').textContent = HQ.prints; $('kCoffee').textContent = HQ.coffees;
  $('poles').innerHTML = POLES.map(p => `<div class="pole" title="${esc(p.full)}"><i style="background:${p.color}"></i><span>${esc(p.name)}</span><b>${p.done}</b></div>`).join('');
  $('poleSum').textContent = `${POLES.length} pôles · ${AGENTS.length} agents`;
  const a = HQ.selected, card = $('agentCard');
  if (!a) { if (lastCard !== 'none') { card.innerHTML = '<h2>Agent</h2><div class="empty">Clique sur un agent dans l\'open space pour voir ce qu\'il fait.</div>'; lastCard = 'none'; } return; }
  const html = `<h2>Agent <em>${esc(a.pole.full)}</em></h2>
    <div class="ag-head"><div class="ag-av" style="background:radial-gradient(circle at 50% 38%, ${a.skin} 0 38%, ${a.hair} 39% 52%, ${a.shirt} 53%)"></div>
    <div><b>${esc(a.name)}</b><small>${esc(a.role)}</small></div></div>
    <div class="ag-now"><b>${a.task ? esc(a.task.title) : 'Aucune tâche en cours'}</b>
    <div style="color:var(--muted);margin-top:3px">${esc(a.doing)}</div>
    <div class="bar"><i style="width:${Math.round(a.progress * 100)}%"></i></div></div>
    <div class="ag-meta"><span>Énergie ${Math.round(clamp(a.energy, 0, 100))}%</span><span>${a.done} tâche(s) finie(s)</span>${a.task ? `<span>Étape ${Math.min(a.stepIdx + 1, a.task.steps.length)}/${a.task.steps.length}</span>` : ''}</div>`;
  if (html !== lastCard) { card.innerHTML = html; lastCard = html; }
}

// sélection d'agents
function agentAt(ev) {
  const r = canvas.getBoundingClientRect(), x = (ev.clientX - r.left) / cssScale, y = (ev.clientY - r.top) / cssScale;
  let best = null, bd = 18;
  AGENTS.forEach(a => { if (!a.visible) return; const d = Math.hypot(a.x - x, a.y - 3 - y); if (d < bd) { bd = d; best = a; } });
  return best;
}
canvas.addEventListener('mousemove', e => { HQ.hover = agentAt(e); canvas.style.cursor = HQ.hover ? 'pointer' : 'default'; });
canvas.addEventListener('mouseleave', () => HQ.hover = null);
canvas.addEventListener('click', e => { HQ.selected = agentAt(e); lastCard = ''; renderUI(); });

// activation
$('power').onclick = () => {
  HQ.active = !HQ.active;
  document.body.classList.toggle('on', HQ.active);
  $('power').textContent = HQ.active ? 'Mettre en veille' : 'Activer le QG';
  if (HQ.active) { if (HQ.minutes > 18 * 60) HQ.minutes = 9 * 60; arrive(); } else leave();
};
$('speed').onclick = e => { const b = e.target.closest('button'); if (!b) return; HQ.speed = +b.dataset.s; [...$('speed').children].forEach(x => x.classList.toggle('sel', x === b)); };

// confier une tâche
$('aPole').innerHTML = POLES.map(p => `<option value="${p.id}">${esc(p.full)}</option>`).join('');
$('realAll').onchange = e => HQ.realAll = e.target.checked;
$('assign').onsubmit = e => {
  e.preventDefault();
  const p = poleById($('aPole').value), text = $('aTask').value.trim();
  if (!text) return;
  p.custom.push({ title: text, steps: guessSteps(text), custom: true });
  $('aTask').value = '';
  const lead = p.members[0];
  log(lead, `Nouvelle tâche confiée au ${p.full} : ${text}`);
  if (lead.inside) lead.say('📥 Bien reçu, on s’en occupe !', 3);
  if (!HQ.active) $('power').click();
};

// IA disponible ?
fetch(API + '/hq/health').then(r => r.json()).then(j => {
  HQ.ai = !!j.ai;
  $('aiState').textContent = HQ.ai ? 'IA : connectée' : 'IA : pas de clé API';
  $('aiState').classList.toggle('ok', HQ.ai);
}).catch(() => { $('aiState').textContent = 'IA : simulation'; });

renderDeliv(); renderUI();
requestAnimationFrame(frame);

// accès debug
window.HQ = HQ; window.AGENTS = AGENTS;
})();
</script>
</body>
</html>
