<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QG Jarvis</title>
<meta name="description" content="Le QG des agents IA de Jarvis : un open space de startup où chaque pôle travaille sur tes vrais projets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Loft brut : plan vu de dessus à gauche, salle de contrôle à droite */
  :root{
    --bg:#f3f1ec; --surface:#fffdf9; --surface2:#f6f2ea; --ink:#1d1f24; --muted:#6a6660; --line:#e2ddd3;
    --accent:#0f7b6c; --accent-ink:#ffffff; --warn:#b45309; --bad:#b91c1c; --ok:#15803d;
    --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#131418; --surface:#1b1d22; --surface2:#22252b; --ink:#ecebe7; --muted:#9a978f; --line:#2c2f36;
    --accent:#3fc1ab; --accent-ink:#06201b; --warn:#f59e0b; --bad:#f87171; --ok:#4ade80; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#131418; --surface:#1b1d22; --surface2:#22252b; --ink:#ecebe7; --muted:#9a978f; --line:#2c2f36;
    --accent:#3fc1ab; --accent-ink:#06201b; --warn:#f59e0b; --bad:#f87171; --ok:#4ade80; color-scheme:dark }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line)}
  .brand{margin-right:auto;display:flex;align-items:center;gap:10px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--line);transition:.4s}
  body.on .brand .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent)}
  .brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
  .brand small{display:block;color:var(--muted);font-size:12.5px}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);min-width:120px}
  .clock b{color:var(--ink);font-size:19px;font-family:var(--display)}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .seg button{background:transparent;color:var(--muted);border:0;padding:7px 12px;cursor:pointer;font:600 13px var(--body)}
  .seg button.sel{background:var(--ink);color:var(--bg)}
  #power{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 18px;border-radius:999px;font:700 14px var(--body);cursor:pointer}
  body.on #power{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;padding-block:16px 40px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  canvas{display:block;width:100%}
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
  .kpi b{display:block;font:800 20px var(--display);font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--muted)}
  aside{display:flex;flex-direction:column;gap:12px;min-width:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
  .empty{color:var(--muted);font-size:13.5px}
  .ag-head{display:flex;gap:10px;align-items:center}
  .ag-av{width:36px;height:36px;border-radius:50%;flex:none}
  .ag-head b{display:block;font-family:var(--display);font-size:17px}
  .ag-head small{color:var(--muted)}
  .ag-now{margin-top:10px;font-size:14px}
  .bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .ag-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
  form{display:flex;flex-direction:column;gap:8px}
  select,textarea{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:14px var(--body)}
  textarea{resize:vertical;min-height:58px}
  .btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 14px;font:700 14px var(--body);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .switch{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.4}
  .switch input{margin-top:2px;accent-color:var(--accent)}
  .pill{font:600 11.5px var(--body);padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);text-transform:none;letter-spacing:0}
  .pill.ok{color:var(--ok);background:color-mix(in srgb, var(--ok) 14%, transparent)}
  .states{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .poles{display:flex;flex-direction:column;gap:6px}
  .pole{display:flex;gap:8px;align-items:center;font-size:13.5px}
  .pole i{width:10px;height:10px;border-radius:3px;flex:none}
  .pole span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pole b{font-variant-numeric:tabular-nums}
  #log{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto;font-size:13px}
  #log li{padding:5px 0;border-bottom:1px dashed var(--line)}
  #log time{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
  #log li i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}
  #deliv{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
  #deliv li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
  #deliv li:hover{background:var(--surface2)}
  #deliv li i{width:8px;height:8px;border-radius:2px;flex:none}
  #deliv li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);flex:none;font-style:normal}
  .tag.ai{color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent)}
  .tag.run{color:var(--warn);background:color-mix(in srgb, var(--warn) 14%, transparent)}
  .tag.err{color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, transparent)}
  .seg.small button{padding:4px 10px;font-size:12px}
  dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(680px,92vw);padding:0}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-h{padding:14px 16px;border-bottom:1px solid var(--line)}
  .dlg-h b{display:block;font:700 18px var(--display)}
  .dlg-h small{color:var(--muted)}
  #dlgBody{white-space:pre-wrap;padding:14px 16px;max-height:60vh;overflow:auto;font:14px/1.6 var(--body);margin:0}
  .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
  @media (max-width:1020px){ main{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:520px){ .brand small{display:none} .clock{min-width:0} }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="dot"></div><div><h1>QG Jarvis</h1><small>L’open space de tes agents IA</small></div></div>
  <div class="clock" id="clock"><b>--:--</b> · veille</div>
  <div class="seg" id="speed"><button data-s="1" class="sel">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></div>
  <button id="power">Activer le QG</button>
</header>

<main>
  <section>
    <div class="stage"><canvas id="office" aria-label="Open space du QG"></canvas></div>
    <div class="kpis">
      <div class="kpi"><b id="kAgents">0</b><span>présents</span></div>
      <div class="kpi"><b id="kDone">0</b><span>tâches finies</span></div>
      <div class="kpi"><b id="kCalls">0</b><span>appels</span></div>
      <div class="kpi"><b id="kPrints">0</b><span>pages imprimées</span></div>
      <div class="kpi"><b id="kCoffee">0</b><span>cafés</span></div>
      <div class="kpi"><b id="kPing">0</b><span>parties de ping-pong</span></div>
    </div>
  </section>

  <aside>
    <div class="card" id="agentCard"><h2>Agent</h2><div class="empty">Clique sur un agent dans l’open space pour voir ce qu’il fait.</div></div>

    <div class="card">
      <h2>Confier une tâche</h2>
      <form id="assign">
        <select id="aPole" aria-label="Pôle"></select>
        <textarea id="aTask" placeholder="Ex. : Écris le post LinkedIn sur le match de samedi" required></textarea>
        <label class="switch"><input type="checkbox" id="realAll">
          <span>Exécuter aussi les tâches de routine avec l’IA (consomme des crédits API). Tes tâches à toi passent toujours par l’IA quand elle est connectée.</span></label>
        <button class="btn" type="submit">Confier au pôle</button>
      </form>
    </div>

    <div class="card">
      <h2>Pôles <em id="poleSum"></em></h2>
      <div class="states"><span class="pill" id="aiState">IA : simulation</span><span class="pill" id="mailState">Gmail : non connecté</span></div>
      <div class="poles" id="poles"></div>
    </div>

    <div class="card">
      <h2>Livrables <span class="seg small" id="dFilter"><button data-f="all" class="sel">Tous</button><button data-f="mail">Mails</button></span></h2>
      <ul id="deliv"></ul>
    </div>
    <div class="card"><h2>Fil d’activité</h2><ul id="log"></ul></div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dlg-h"><b id="dlgTitle"></b><small id="dlgMeta"></small></div>
  <pre id="dlgBody"></pre>
  <div class="dlg-f"><button class="btn ghost" id="dlgCopy">Copier</button><button class="btn" id="dlgClose">Fermer</button></div>
</dialog>

<script>
(() => {
'use strict';
/* ======================================================================
   Monde : 1200 × 760, cellules de 10 px pour les déplacements
   ====================================================================== */
const W = 1200, H = 760, CELL = 10, COLS = W / CELL, ROWS = H / CELL, R = 9;
const DOOR = { x: 135, y: H };
const API = (location.protocol.startsWith('http') ? '' : 'http://localhost:5000');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MIN = (h, m = 0) => h * 60 + m;

/* ----------------------------------------------------------------------
   Pôles et tâches (tirées de tes vrais projets)
   ---------------------------------------------------------------------- */
const POLES = [
  { id:'dir', name:'Direction', full:'Direction · Jarvis', color:'#0ea5e9',
    agents:[ { name:'Jarvis', role:'Chef d’orchestre', jarvis:true }, { name:'Clara', role:'Assistante de direction' } ],
    calls:['On cale les priorités du jour ?', 'Je te mets ça dans l’agenda', 'Point rapide à 14h ?'],
    tasks:[ { t:'Préparer le brief de la journée', s:['type','print'] }, { t:'Faire le tour des pôles', s:['tour'] },
      { t:'Planifier la semaine : priorités par pôle', s:['type','meeting'] }, { t:'Faire le bilan de fin de journée', s:['type'] } ] },
  { id:'edu', name:'Study Buddy', full:'Produit Study Buddy', color:'#7c3aed', bench:0, half:0,
    agents:[ { name:'Inès', role:'Product manager' }, { name:'Yanis', role:'Développeur front' }, { name:'Chloé', role:'Tests et retours élèves' } ],
    calls:['Le quiz t’a aidé à réviser ?', 'Qu’est-ce qui t’a bloqué dans l’appli ?', 'Tu utiliserais les flashcards ?'],
    tasks:[ { t:'Prioriser la roadmap de Smart Study Buddy', s:['meeting','type'] },
      { t:'Fusionner les doublons : Study Buddy, Study Companion, Repères Scolaires', s:['web','meeting'] },
      { t:'Tester le quiz auto-corrigé de Dossier Interactif', s:['web','type'] },
      { t:'Rédiger les textes de l’écran d’accueil en français et en anglais', s:['type'] },
      { t:'Appeler deux élèves testeurs pour leurs retours', s:['call','type'] },
      { t:'Préparer la mise en ligne de Smart Study Buddy', s:['type','print'] } ] },
  { id:'soc', name:'Réseaux & Contenu', full:'Réseaux & Contenu', color:'#f97316', bench:0, half:1,
    agents:[ { name:'Léa', role:'Rédactrice LinkedIn' }, { name:'Noah', role:'Créateur de Reels' }, { name:'Emma', role:'Analyste des stats' } ],
    calls:['On valide le post avec MCI Sport ?', 'Tu peux m’envoyer les photos du match ?', 'Le Reel sort demain 18h', 'On tague qui sur LinkedIn ?'],
    tasks:[ { t:'Rédiger le post LinkedIn de la semaine pour MCI Sport', s:['type','meeting'] },
      { t:'Écrire le script d’un Reel Instagram', s:['type','web'] },
      { t:'Analyser les stats Metricool des derniers posts', s:['web','type','print'] },
      { t:'Programmer les publications de la semaine dans Typefully', s:['type'] },
      { t:'Répondre aux commentaires et aux DM', s:['type','call'] } ] },
  { id:'tech', name:'Tech & Agents IA', full:'Tech & Agents IA', color:'#10b981', bench:1, half:0,
    agents:[ { name:'Hugo', role:'Développeur Jarvis' }, { name:'Malik', role:'Agents vocaux' }, { name:'Sofia', role:'Intégrations et déploiement' } ],
    calls:['Le webhook répond en 200 ?', 'On teste l’agent vocal ensemble ?', 'Je déploie dans 5 minutes'],
    tasks:[ { t:'Ajouter une fonction à Jarvis', s:['type','web'] }, { t:'Configurer un agent vocal ElevenLabs', s:['type','call'] },
      { t:'Corriger un bug de Send Me Files', s:['web','type'] }, { t:'Revue de code de la semaine', s:['meeting','type'] },
      { t:'Brancher le QG sur l’agenda Google', s:['type','web'] } ] },
  { id:'ops', name:'Ops · Mail & Admin', full:'Ops · Mail & Admin', color:'#64748b', bench:1, half:1,
    agents:[ { name:'Max', role:'Boîte mail' }, { name:'Jade', role:'Administratif' }, { name:'Lucas', role:'Candidatures' } ],
    calls:['Service de l’état civil ? Bonjour…', 'Le poste à temps partiel est-il toujours ouvert ?', 'Bien reçu votre mail, je vous réponds vite'],
    tasks:[ { t:'Demander l’attestation et l’acte de naissance', s:['type','call'] },
      { t:'Relancer le service administratif sans réponse', s:['call','type'] },
      { t:'Scanner et classer les documents reçus', s:['print','type'] },
      { t:'Repérer 5 offres d’emploi étudiant à temps partiel à Genève', s:['web','type'] },
      { t:'Rédiger une candidature spontanée', s:['type','print'] },
      { t:'Trier la boîte de réception (simulation)', s:['read','type'], noMail:true },
      { t:'Surveiller la boîte de réception', s:['read'], watch:true, needMail:true } ] },
];
const poleById = id => POLES.find(p => p.id === id) || POLES[0];

/* ----------------------------------------------------------------------
   Plan
   ---------------------------------------------------------------------- */
const BENCHES = [ { y:170 }, { y:400 } ];
const BX = 320, BW = 500, BH = 56;
const seatPos = (bi, half, i, top) => ({ x: BX + half * 250 + 45 + i * 80, y: top ? BENCHES[bi].y - 18 : BENCHES[bi].y + BH + 18, up: !top });
POLES.forEach(p => {
  if (p.id === 'dir') p.seats = [ { x:1005, y:282, up:false }, { x:1005, y:364, up:true } ];
  else p.seats = [ seatPos(p.bench, p.half, 0, true), seatPos(p.bench, p.half, 2, false), seatPos(p.bench, p.half, 1, true) ];
  p.custom = []; p.done = 0; p.last = null;
});

const ZONES = [
  { x:0,   y:0,   w:250, h:170, f:'tile',   label:'Toilettes' },
  { x:0,   y:320, w:250, h:240, f:'wood',   label:'Cafète' },
  { x:0,   y:580, w:250, h:180, f:'rug',    label:'Accueil' },
  { x:890, y:0,   w:310, h:190, f:'tile',   label:'Coin café' },
  { x:900, y:220, w:190, h:250, f:'carpet', label:'Bureau Jarvis' },
  { x:890, y:510, w:310, h:250, f:'carpet', label:'Salle de réunion' },
  { x:280, y:600, w:560, h:160, f:'rug',    label:'Détente' },
  { x:0,   y:180, w:250, h:130, f:null,     label:'Impression' },
  { x:1100,y:205, w:100, h:270, f:null,     label:'Box' },
];
// murs : x1,y1,x2,y2, vitré ?
const WALLS = [
  [0,0,1200,0,0],[0,0,0,760,0],[1200,0,1200,760,0],[0,760,100,760,0],[170,760,1200,760,0],
  [250,0,250,170,0],[0,170,110,170,0],[160,170,250,170,0],[80,0,80,80,0],[160,0,160,80,0],
  [0,320,250,320,0],[250,320,250,400,0],[250,470,250,560,0],[0,560,250,560,0],
  [900,220,1090,220,1],[900,220,900,320,1],[900,370,900,470,1],[900,470,1090,470,1],[1090,220,1090,470,1],
  [890,510,1200,510,1],[890,510,890,590,1],[890,650,890,760,1],
];
for (let k = 0; k < 4; k++) { const y = 215 + k * 65; WALLS.push([1110,y,1200,y,1],[1110,y,1110,y+12,1],[1110,y+53,1110,y+65,1]); }
WALLS.push([1110,475,1200,475,1]);

const ITEMS = [];
const item = (x,y,w,h,m,icon,id) => { const o = {x,y,w,h,m,icon,id}; ITEMS.push(o); return o; };
BENCHES.forEach(b => item(BX, b.y, BW, BH, 'wood'));
item(10,8,44,30,'ceramic','🚽'); item(100,8,44,30,'ceramic','🚽'); item(190,15,52,30,'ceramic',null,'sink');
item(30,200,64,40,'white','🖨','printer'); item(160,200,60,30,'wood');
item(8,330,30,120,'white',null,'micro');
const CAF_TABLES = [[110,395],[190,395],[110,495],[190,495]];
CAF_TABLES.forEach(([x,y]) => item(x-24,y-20,48,40,'wood'));
item(40,620,130,34,'white',null,'desk'); item(190,600,40,40,'green');
item(898,8,294,40,'white'); item(925,14,34,28,'dark','☕','coffee'); item(1010,12,30,32,'ceramic','💧'); item(1140,8,50,40,'white','🧊','fridge');
item(960,105,170,34,'wood');
item(950,300,110,46,'dark');
for (let k = 0; k < 4; k++) item(1165,227+k*65,26,40,'wood');
item(960,590,190,80,'wood'); item(1188,575,8,110,'dark',null,'screen');
item(300,690,140,44,'fabric'); item(600,650,130,70,'green',null,'pingpong'); item(470,680,30,30,'fabric'); item(515,700,30,30,'fabric');
item(380,6,360,10,'white',null,'kanban');
const PLANTS = [[275,20],[865,20],[275,590],[865,590],[850,740],[235,740]];
PLANTS.forEach(([x,y]) => item(x-12,y-12,24,24,'plant'));

/* grille de déplacement */
const blocked = new Uint8Array(COLS * ROWS);
const rects = ITEMS.map(o => o).concat(WALLS.map(([x1,y1,x2,y2,g]) => { const t = g ? 4 : 8; return y1 === y2 ? { x: Math.min(x1,x2), y: y1 - t/2, w: Math.abs(x2-x1), h: t } : { x: x1 - t/2, y: Math.min(y1,y2), w: t, h: Math.abs(y2-y1) }; }));
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
  for (const o of rects) if (x > o.x - R && x < o.x + o.w + R && y > o.y - R && y < o.y + o.h + R) { blocked[r * COLS + c] = 1; break; }
}
const cellOf = (x, y) => [clamp(Math.floor(x / CELL), 0, COLS - 1), clamp(Math.floor(y / CELL), 0, ROWS - 1)];
const free = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !blocked[r * COLS + c];
function nearestFree(c, r) {
  if (free(c, r)) return [c, r];
  for (let d = 1; d < 30; d++) for (let dc = -d; dc <= d; dc++) for (let dr = -d; dr <= d; dr++)
    if (Math.max(Math.abs(dc), Math.abs(dr)) === d && free(c + dc, r + dr)) return [c + dc, r + dr];
  return [c, r];
}
function los(ax, ay, bx, by) {
  const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 4);
  for (let i = 0; i <= n; i++) { const [c, r] = cellOf(ax + (bx - ax) * i / n, ay + (by - ay) * i / n); if (!free(c, r)) return false; }
  return true;

}

function plan(a) {
  if (a.courier || !HQ.active) return [];
  const m = HQ.minutes;
  if (!a.ate && m >= MIN(12) && m < MIN(13, 30) && Math.random() < .5) return planLunch(a);
  if (HQ.parcel === 'waiting' && a.pole.id === 'ops') { HQ.parcel = 'claimed'; return planParcel(a); }
  if (HQ.waterPending && Math.random() < .15) { HQ.waterPending = false; return planWater(a); }
  if (a.bladder > 85) return planWC(a);
  if (a.energy < 28) return planBreak(a);
  if (Math.random() < .06) return planChat(a);

}

function startTask(a) {

    const tpl = pick(pool.length ? pool : p.tasks); p.last = tpl.t;

function startStandup() {

function arrive() {
  AGENTS.forEach((a, i) => {
    if (a.inside) { a.interrupt([Act.walk(a.seat.x, a.seat.y)]); return; }
    a.interrupt([
      Act.wait(a.jarvis ? .2 : .8 + i * rnd(.6, .9), 'hidden', { label:'Arrive au bureau' }),
      Act.fn(x => { x.x = DOOR.x + rnd(-12, 12); x.y = H + 14; x.visible = true; x.inside = true; }),
      Act.walk(a.seat.x, a.seat.y, { label:'Arrive et rejoint son bureau' }),
      Act.wait(1.2, 'idle', { face: faceSeat(a.seat), onStart: x => x.say(x.jarvis ? 'Bonjour à tous. Au travail !' : pick(['Bonjour !', 'Salut tout le monde', 'Hello 👋', 'Bonne journée !']), 2.5) }),
    ]);

}
function leave() {
  AGENTS.forEach(a => {
    if (!a.inside) { a.interrupt([]); return; }
    a.hold = null;
    a.interrupt([
      Act.wait(rnd(0, 2), 'idle', { label:'Range ses affaires', onStart: x => Math.random() < .5 && x.say(pick(['À demain !', 'Bonne soirée', 'Je file'])) }),
      Act.walk(DOOR.x, H - 14, { label:'Rentre à la maison' }), Act.walk(DOOR.x, H + 20),
      Act.fn(x => { x.visible = false; x.inside = false; x.doing = 'Hors du bureau'; }),

}

  if (mate) setTimeout(() => { mate.say('✋ Bien joué !', 2); mate.stretchT = 1; }, 700 / HQ.speed);

function completeTask(a) {
  const t = a.task, p = a.pole;
  a.task = null;
  if (t.watch) { a.say(pick(['📭 Rien de neuf', 'Boîte à jour ✓', 'J’attends le prochain mail']), 2.2); return; }
  a.done++; p.done++; HQ.done++;
  highFive(a);
  if (t.mail) return completeMail(a, t);
  const d = { id: Date.now() + Math.random(), title: t.title, pole: p.id, agent: a.name, time: `J${HQ.day} ${timeStr()}`, status: 'sim', content: simulated(a, t) };
  HQ.deliverables.unshift(d);

}

const STEP_LABEL = { type:'Rédaction du document', web:'Recherche et collecte d’informations', call:'Appels et visios', print:'Impression et classement', meeting:'Réunion de validation', tour:'Tour des pôles', read:'Lecture des mails', reply:'Rédaction du brouillon de réponse' };

function completeMail(a, t) {

  HQ.deliverables.unshift(d);
  log(a, `${a.name} a traité le mail « ${m.subject} »`, true);
  if (HQ.ai) {

    fetch(API + '/hq/mail/process', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ uid: m.uid }) })
      .then(r => r.json()).then(j => {

function pollMail(force) {
  if (!HQ.mail || !HQ.active) return;
  if (!force && performance.now() - lastPoll < 90000) return;
  lastPoll = performance.now();
  const p = poleById('ops');
  fetch(API + '/hq/mail/inbox').then(r => r.json()).then(j => {

    const fresh = (j.mails || []).filter(m => !seenMails.includes(m.uid));
    fresh.reverse().forEach(m => {

      p.custom.push({ title: `Traiter le mail « ${m.subject} » de ${m.from_name}`, steps: ['read', 'reply'], custom: true, mail: m });
      log(p.members[0], `📬 Nouveau mail de ${m.from_name} : ${m.subject}`);

      try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenMails.slice(-500))); } catch (e) {}

}

function guessSteps(text) {
  const s = text.toLowerCase();
  if (/appel|appeler|téléphon|relanc|contacter/.test(s)) return ['call', 'type'];
  if (/imprim|dossier|\bcv\b|feuille|planning/.test(s)) return ['type', 'print'];
  if (/réunion|point|valider|brainstorm/.test(s)) return ['meeting', 'type'];
  if (/cherch|compar|trouv|repér|analys|veille|test/.test(s)) return ['web', 'type'];
  return ['type', 'type'];
}

  if (!a.visible) return;
  const x = a.x, y = a.y, walking = a.moving, bob = walking ? Math.sin(a.walkT) * 1.2 : 0;
  const fy = Math.sin(a.face), fx = Math.cos(a.face), back = fy < -.5 && !['eat','meeting'].includes(a.anim);
  const shirt = a.courier ? a.shirt : a.pole.color;
  ctx.save(); ctx.translate(x, y); ctx.scale(1.15, 1.15); ctx.translate(-x, -y);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, y + 9, 10, 4, 0, 0, 7); ctx.fill();
  if (walking) { const s = Math.sin(a.walkT) * 4; ctx.fillStyle = '#23252b'; ctx.beginPath(); ctx.arc(x - 4 + fx * s, y + 7 + fy * s * .5, 2.6, 0, 7); ctx.arc(x + 4 - fx * s, y + 7 - fy * s * .5, 2.6, 0, 7); ctx.fill(); }
  if (a === HQ.selected || a === HQ.hover) { ctx.strokeStyle = a === HQ.selected ? '#0f7b6c' : 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y + 6, 15, 7, 0, 0, 7); ctx.stroke(); }
  ctx.fillStyle = shirt; ctx.beginPath(); ctx.ellipse(x, y + 1 + bob * .3, 10, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = a.skin;
  if (a.stretchT > 0 || (a.anim === 'standup' && Math.sin(T * 2 + x) > .8)) { ctx.beginPath(); ctx.arc(x - 9, y - 14, 2.6, 0, 7); ctx.arc(x + 9, y - 14, 2.6, 0, 7); ctx.fill(); }
  else if (['type','web','mail','visio'].includes(a.anim) && !walking) { const j = Math.sin(T * 22) * 1.2, dy = a.seat.up ? -9 : 9; ctx.beginPath(); ctx.arc(x - 5, y + dy + j, 2.4, 0, 7); ctx.arc(x + 5, y + dy - j, 2.4, 0, 7); ctx.fill(); }
  else if (a.anim === 'pingpong') { const sw = Math.sin(T * 5.2 + x) * 5, side = x < 660 ? 1 : -1; ctx.beginPath(); ctx.arc(x + 10 * side, y - 2 + sw, 2.6, 0, 7); ctx.fill(); ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(x + 14 * side, y - 4 + sw, 3.4, 0, 7); ctx.fill(); }
  const hy = y - 7 + bob;
  if (a.jarvis) { ctx.shadowColor = '#0ea5e9'; ctx.shadowBlur = 12; }
  ctx.fillStyle = a.skin; ctx.beginPath(); ctx.arc(x, hy, 6.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = a.hair; ctx.beginPath(); if (back) ctx.arc(x, hy, 6.8, 0, 7); else ctx.arc(x, hy - 1, 6.8, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  if (a.headset) { ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, hy, 7.6, Math.PI, 0); ctx.stroke(); ctx.fillStyle = '#111'; ctx.fillRect(x - 9, hy - 2, 3, 5); ctx.fillRect(x + 6, hy - 2, 3, 5); }
  if (a.anim === 'call') { ctx.fillStyle = '#111827'; rr(x + 5, hy - 3, 4, 8, 1.5); ctx.fill(); }
  const cup = (cx, cy, c1, c2) => { ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(cx, cy, 3.6, 0, 7); ctx.fill(); ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, 7); ctx.fill(); };
  if (a.hold === 'coffee' || a.anim === 'coffee') { cup(x + 10, y + 1, '#fff', '#6f4e37'); if (Math.random() < .06) HQ.particles.push({ x: x + 10, y: y - 2, vy: -12, life: 1 }); }
  if (a.hold === 'bottle' || a.anim === 'drink') { ctx.fillStyle = '#38bdf8'; rr(x + 7, y - 4, 5, 10, 2); ctx.fill(); }
  if (a.hold === 'paper') { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.fillRect(x - 15, y - 3, 9, 12); ctx.strokeRect(x - 15, y - 3, 9, 12); }
  if (a.hold === 'box' || a.courier) { ctx.fillStyle = '#c08a4a'; ctx.fillRect(x - 8, y - 2, 16, 11); ctx.strokeStyle = '#7a5226'; ctx.lineWidth = 1; ctx.strokeRect(x - 8, y - 2, 16, 11); }
  if (a.hold === 'food' || a.anim === 'eat') { const py = a.anim === 'eat' ? (AMEN.cafet.slots.findIndex(s => s.x === Math.round(x) && s.y === Math.round(y)) % 4 < 2 ? 14 : -16) : 0; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + (py ? 0 : 11), y + py, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(x + (py ? 0 : 11), y + py, 2.6, 0, 7); ctx.fill(); }
  if (a.hold === 'can') { ctx.fillStyle = '#16a34a'; rr(x + 7, y - 2, 8, 8, 2); ctx.fill(); ctx.fillRect(x + 14, y - 3, 5, 2); }
  if (a.anim === 'water') { ctx.fillStyle = '#7dd3fc'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + 20, y - 2 + ((T * 30 + k * 4) % 12), 1.2, 0, 7); ctx.fill(); } }
  if (a.anim === 'relax') { ctx.fillStyle = '#334155'; ctx.font = '10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('z', x + 10, hy - 8 - (T * 6 % 6)); }
  if (a === HQ.selected || a === HQ.hover || (a.jarvis && HQ.light > .5)) {
    ctx.font = '700 10px Figtree, system-ui'; ctx.textAlign = 'center'; const w = ctx.measureText(a.name).width + 10;
    ctx.fillStyle = 'rgba(15,23,42,.85)'; rr(x - w / 2, y + 14, w, 14, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(a.name, x, y + 24.5);
  }
  ctx.restore();
}

function drawBubble(a) {
  if (!a.visible || !a.bubble) return;
  const b = a.bubble, k = Math.min(1, b.t * 3, (b.max - b.t) * 6);
  ctx.globalAlpha = Math.max(0, k); ctx.font = '600 12px Figtree, system-ui';
  let text = b.text; while (ctx.measureText(text).width > 200 && text.length > 6) text = text.slice(0, -2);
  if (text !== b.text) text = text.slice(0, -1) + '…';
  const w = ctx.measureText(text).width + 16, bx = clamp(a.x - w / 2, 8, W - w - 8), by = a.y - 46;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = a.courier ? '#b45309' : a.pole.color; ctx.lineWidth = 1.5;
  rr(bx, by, w, 21, 10); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x - 4, by + 21); ctx.lineTo(a.x, by + 27); ctx.lineTo(a.x + 4, by + 21); ctx.fill();
  ctx.fillStyle = '#1d1f24'; ctx.textAlign = 'center'; ctx.fillText(text, bx + w / 2, by + 14.5);
  ctx.globalAlpha = 1;
}

function drawFx(dt) {
  if (inUse('coffee') && Math.random() < .3) HQ.particles.push({ x: 942 + rnd(-3, 3), y: 30, vy: -14, life: 1 });
  if (inUse('micro') && Math.random() < .1) HQ.particles.push({ x: 40, y: 360, vy: -10, life: .8 });
  HQ.particles = HQ.particles.filter(p => (p.life -= dt * .9) > 0);
  HQ.particles.forEach(p => { p.y += p.vy * dt; p.x += Math.sin(p.y * .3) * .2; ctx.fillStyle = `rgba(255,255,255,${p.life * .6})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5 + (1 - p.life) * 2, 0, 7); ctx.fill(); });
  const [p1, p2] = AMEN.pingpong.users;
  if (p1 && p2 && p1.anim === 'pingpong' && p2.anim === 'pingpong') { const k = (Math.sin(T * 5.2) + 1) / 2; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(612 + k * 106, 685 - Math.abs(Math.cos(T * 5.2)) * 10, 3.2, 0, 7); ctx.fill(); }
}

function drawLights() {
  if (HQ.light >= 1) return;
  ctx.fillStyle = `rgba(20,18,16,${(1 - HQ.light) * .72})`; ctx.fillRect(0, 0, W, H);
  if (HQ.light < .05 && !AGENTS.some(a => a.visible)) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#fffdf9'; ctx.font = '800 30px "Bricolage Grotesque", system-ui'; ctx.fillText('QG en veille', W / 2, H / 2 - 6);
    ctx.font = '16px Figtree, system-ui'; ctx.fillStyle = 'rgba(255,253,249,.8)'; ctx.fillText('Appuie sur « Activer le QG » : les agents arrivent et se mettent au travail.', W / 2, H / 2 + 24);
  }
}

/* ======================================================================
   Boucle
   ====================================================================== */
let lastT = performance.now(), uiT = 0;
function frame(now) {
  const raw = Math.min(.05, (now - lastT) / 1000); lastT = now;
  const dt = raw * HQ.speed; T += raw;
  HQ.light = clamp(HQ.light + (HQ.active ? raw * .8 : -raw * .5), 0, 1);
  if (HQ.active) {
    HQ.minutes += dt * 2;
    const m = HQ.minutes;
    if (!HQ.standup && m >= MIN(9, 30) && m < MIN(9, 45) && AGENTS.filter(a => a.inside).length >= 6) startStandup();
    if ((HQ.parcelsToday === 0 && m >= MIN(10, 40)) || (HQ.parcelsToday === 1 && m >= MIN(15, 10))) courierVisit();
    if (!HQ.watered && m >= MIN(16)) { HQ.watered = true; HQ.waterPending = true; }
    if (m >= MIN(19)) { HQ.minutes = MIN(9); HQ.day++; HQ.standup = false; HQ.parcelsToday = 0; HQ.watered = false; AGENTS.forEach(a => { a.ate = false; }); log(AGENTS[0], `Jour ${HQ.day} : nouvelle journée au QG`); }
  }
  AGENTS.forEach(a => a.update(dt)); COURIER.update(dt);
  pollMail(false);

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawFloor(); drawFurniture(); drawWalls();
  AGENTS.concat([COURIER]).filter(a => a.visible).sort((a, b) => a.y - b.y).forEach(drawAgent);
  drawFx(raw);
  AGENTS.forEach(drawBubble); drawBubble(COURIER);
  drawLights();
  if ((uiT += raw) > .25) { uiT = 0; renderUI(); }
  requestAnimationFrame(frame);
}

/* ======================================================================
   Interface
   ====================================================================== */
const $ = id => document.getElementById(id);
const logEl = $('log'), delivEl = $('deliv');
function log(a, text, done) {
  const li = document.createElement('li');
  li.innerHTML = `<time>${timeStr()}</time><i style="background:${a.pole.color}"></i>`;
  li.appendChild(document.createTextNode((done ? '✅ ' : '') + text));
  logEl.prepend(li); while (logEl.children.length > 80) logEl.lastChild.remove();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

let delivFilter = 'all';
function renderDeliv() {
  const list = HQ.deliverables.map((d, i) => [d, i]).filter(([d]) => delivFilter === 'all' || d.isMail || d.status === 'mail').slice(0, 40);
  if (!list.length) { delivEl.innerHTML = `<li class="empty" style="cursor:default">${delivFilter === 'all' ? 'Les documents produits par les agents arrivent ici.' : 'Aucun mail traité pour l’instant.'}</li>`; return; }
  const TAG = { sim:['simulé',''], run:['IA en cours…','run'], ai:['IA','ai'], err:['erreur','err'], mail:['mail','ai'] };
  delivEl.innerHTML = list.map(([d, i]) => { const [t, c] = TAG[d.status] || TAG.sim; return `<li data-i="${i}"><i style="background:${poleById(d.pole).color}"></i><span>${esc(d.title)}</span><em class="tag ${c}">${t}</em></li>`; }).join('');
}
delivEl.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return; const d = HQ.deliverables[+li.dataset.i];
  $('dlgTitle').textContent = d.title; $('dlgMeta').textContent = `${d.agent} · ${poleById(d.pole).full} · ${d.time}`; $('dlgBody').textContent = d.content; $('dlg').showModal();
});
$('dFilter').onclick = e => { const b = e.target.closest('button'); if (!b) return; delivFilter = b.dataset.f; [...$('dFilter').children].forEach(x => x.classList.toggle('sel', x === b)); renderDeliv(); };
$('dlgClose').onclick = () => $('dlg').close();
$('dlgCopy').onclick = () => { const t = $('dlgBody').textContent; const ok = () => { $('dlgCopy').textContent = 'Copié ✓'; setTimeout(() => $('dlgCopy').textContent = 'Copier', 1500); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents($('dlgBody')); getSelection().removeAllRanges(); getSelection().addRange(r); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, sel); else sel(); };

let lastCard = '';
function renderUI() {
  $('clock').innerHTML = HQ.active || AGENTS.some(a => a.visible) ? `<b>${timeStr()}</b> · jour ${HQ.day}` : '<b>--:--</b> · veille';
  $('kAgents').textContent = AGENTS.filter(a => a.inside).length; $('kDone').textContent = HQ.done; $('kCalls').textContent = HQ.calls;
  $('kPrints').textContent = HQ.prints; $('kCoffee').textContent = HQ.coffees; $('kPing').textContent = HQ.pings;
  $('poles').innerHTML = POLES.map(p => `<div class="pole"><i style="background:${p.color}"></i><span>${esc(p.full)}</span><b>${p.done}</b></div>`).join('');
  $('poleSum').textContent = `${POLES.length} pôles · ${AGENTS.length} agents`;
  const a = HQ.selected, card = $('agentCard');
  if (!a) { if (lastCard !== 'none') { card.innerHTML = '<h2>Agent</h2><div class="empty">Clique sur un agent dans l’open space pour voir ce qu’il fait.</div>'; lastCard = 'none'; } return; }
  const html = `<h2>Agent <em>${esc(a.courier ? 'Visiteur' : a.pole.full)}</em></h2>
    <div class="ag-head"><div class="ag-av" style="background:radial-gradient(circle at 50% 38%, ${a.skin} 0 38%, ${a.hair} 39% 52%, ${a.courier ? a.shirt : a.pole.color} 53%)"></div>
    <div><b>${esc(a.name)}</b><small>${esc(a.role)}</small></div></div>
    <div class="ag-now"><b>${a.task ? esc(a.task.title) : 'Aucune tâche en cours'}</b><div style="color:var(--muted);margin-top:3px">${esc(a.doing)}</div>
    <div class="bar"><i style="width:${Math.round(a.progress * 100)}%"></i></div></div>
    <div class="ag-meta"><span>Énergie ${Math.round(clamp(a.energy, 0, 100))} %</span><span>${a.done} tâche(s) finie(s)</span>${a.task ? `<span>Étape ${Math.min(a.stepIdx + 1, a.task.steps.length)}/${a.task.steps.length}</span>` : ''}</div>`;
  if (html !== lastCard) { card.innerHTML = html; lastCard = html; }
}

function agentAt(ev) {
  const r = canvas.getBoundingClientRect(), x = (ev.clientX - r.left) / cssScale, y = (ev.clientY - r.top) / cssScale;
  let best = null, bd = 18;
  AGENTS.concat([COURIER]).forEach(a => { if (!a.visible) return; const d = Math.hypot(a.x - x, a.y - 3 - y); if (d < bd) { bd = d; best = a; } });
  return best;
}
canvas.addEventListener('mousemove', e => { HQ.hover = agentAt(e); canvas.style.cursor = HQ.hover ? 'pointer' : 'default'; });
canvas.addEventListener('mouseleave', () => HQ.hover = null);
canvas.addEventListener('click', e => { HQ.selected = agentAt(e); lastCard = ''; renderUI(); });

$('power').onclick = () => {
  HQ.active = !HQ.active; document.body.classList.toggle('on', HQ.active);
  $('power').textContent = HQ.active ? 'Mettre en veille' : 'Activer le QG';
  if (HQ.active) { if (HQ.minutes > MIN(18)) HQ.minutes = MIN(9); arrive(); setTimeout(() => pollMail(true), 4000); } else leave();
};
$('speed').onclick = e => { const b = e.target.closest('button'); if (!b) return; HQ.speed = +b.dataset.s; [...$('speed').children].forEach(x => x.classList.toggle('sel', x === b)); };

$('aPole').innerHTML = POLES.map(p => `<option value="${p.id}">${esc(p.full)}</option>`).join('');
$('realAll').onchange = e => HQ.realAll = e.target.checked;
$('assign').onsubmit = e => {
  e.preventDefault();
  const p = poleById($('aPole').value), text = $('aTask').value.trim(); if (!text) return;
  p.custom.push({ title: text, steps: guessSteps(text), custom: true });
  $('aTask').value = '';
  const lead = p.members[0]; log(lead, `Nouvelle tâche confiée à ${p.full} : ${text}`);
  if (lead.inside) lead.say('📥 Bien reçu, on s’en occupe !', 3);
  if (!HQ.active) $('power').click();
};

fetch(API + '/hq/health').then(r => r.json()).then(j => {
  HQ.ai = !!j.ai; HQ.mail = !!j.mail; HQ.mailAddr = j.mail_address || '';
  $('aiState').textContent = HQ.ai ? 'IA : connectée' : 'IA : pas de clé API'; $('aiState').classList.toggle('ok', HQ.ai);
  $('mailState').textContent = HQ.mail ? 'Gmail : ' + HQ.mailAddr : 'Gmail : non connecté'; $('mailState').classList.toggle('ok', HQ.mail);
  if (HQ.mail) pollMail(true);
}).catch(() => {});

renderDeliv(); renderUI();
requestAnimationFrame(frame);
window.HQ = HQ; window.AGENTS = AGENTS; window.AMEN = AMEN;
})();
</script>
</body>
